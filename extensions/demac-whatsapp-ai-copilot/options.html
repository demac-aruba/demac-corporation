<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ajustes · DEMAC WhatsApp AI Copilot</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="options-page">
    <main class="options-shell">
      <p class="eyebrow">DEMAC</p>
      <h1>Ajustes del WhatsApp AI Copilot</h1>
      <p class="muted">La clave de OpenAI permanece en Firebase. Chrome solo guarda un token privado y revocable para acceder a la función de DEMAC.</p>

      <form id="settingsForm" class="card form-grid">
        <label>
          <span>Nombre de la empresa</span>
          <input id="companyName" type="text" required />
        </label>
        <label>
          <span>Nombre del operador o departamento</span>
          <input id="operatorName" type="text" required />
        </label>
        <label>
          <span>Endpoint seguro de Firebase</span>
          <input id="backendUrl" type="url" placeholder="https://...cloudfunctions.net/whatsappCopilotDraft" />
        </label>
        <label>
          <span>Token privado de la extensión</span>
          <input id="backendToken" type="password" autocomplete="off" placeholder="Pega aquí el token configurado en Firebase" />
          <small>No es la clave de OpenAI. Este token protege únicamente la función del Copilot.</small>
        </label>
        <label>
          <span>Mensajes visibles que puede analizar</span>
          <input id="maxMessages" type="number" min="8" max="50" />
        </label>
        <label>
          <span>Idioma de respuesta</span>
          <select id="languageMode">
            <option value="auto">Detectar automáticamente el idioma del cliente</option>
            <option value="es">Siempre español</option>
            <option value="en">Always English</option>
            <option value="pap-aw">Sempre Papiamento di Aruba</option>
          </select>
        </label>
        <div class="button-row">
          <button class="primary-button" type="submit">Guardar ajustes</button>
          <button class="secondary-button" id="testBackendButton" type="button">Probar OpenAI</button>
          <span id="saveStatus" class="muted"></span>
        </div>
      </form>

      <section class="notice" id="backendNotice">
        <strong id="backendNoticeTitle">Estado de OpenAI</strong>
        <span id="backendStatus">Guarda el token y pulsa “Probar OpenAI” para verificar la conexión completa.</span>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
