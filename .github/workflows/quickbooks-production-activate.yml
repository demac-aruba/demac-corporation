name: QuickBooks production identity activation
on:
  pull_request:
    paths:
      - 'scripts/quickbooks-production-*.cjs'
      - 'apps/erp-next/public/legal/quickbooks-*.html'
      - '.github/workflows/quickbooks-production-activate.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/quickbooks-production-*.cjs'
      - 'apps/erp-next/public/legal/quickbooks-*.html'
      - '.github/workflows/quickbooks-production-activate.yml'
permissions:
  contents: read
concurrency:
  group: quickbooks-production-installation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node --check scripts/quickbooks-production-activate.cjs
      - run: node --test scripts/quickbooks-production-activate.test.cjs scripts/quickbooks-production-prepare.test.cjs functions/quickbooksConnection.test.js functions/quickbooksSandbox.test.js functions/quickbooksSandboxReports.test.js
      - run: node scripts/quickbooks-production-activate.cjs --check
  activate-identity-only:
    if: github.repository == 'demac-aruba/demac-corporation' && github.event_name == 'push' && github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, '[activate-qbo-production]') || contains(github.event.head_commit.message, '[disable-qbo-production]'))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - name: Enable owner-only identity connection after published-disclosure verification
        if: contains(github.event.head_commit.message, '[activate-qbo-production]') && !contains(github.event.head_commit.message, '[disable-qbo-production]')
        run: node scripts/quickbooks-production-activate.cjs --activate
      - name: Suspend production connection without revoking or deleting credentials
        if: contains(github.event.head_commit.message, '[disable-qbo-production]')
        run: node scripts/quickbooks-production-activate.cjs --disable
# Reviewed runtime configuration only. No accounting, report, IAM or secret-writing command.
