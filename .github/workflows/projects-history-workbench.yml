name: Projects history and materials isolated source validation
on:
  push:
    branches: ['chore/projects-history-materials-validation']
permissions:
  contents: write
concurrency:
  group: projects-history-materials-isolated-source
  cancel-in-progress: false
jobs:
  validate-and-propose:
    if: github.repository == 'demac-aruba/demac-corporation' && github.ref == 'refs/heads/chore/projects-history-materials-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GCLOUD_PROJECT: demo-demac-projects
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare exact hash-verified source without moving refs or runtime access
        run: python3 .github/projects-history-workbench.py apply
      - run: echo "PROJECTS_UI_TOOLS=$RUNNER_TEMP/projects-history-tools" >> "$GITHUB_ENV"
      - name: Install isolated tooling only
        run: |
          npm install --prefix functions --no-audit --no-fund
          npm install --prefix apps/erp-next --no-audit --no-fund
          npm install --prefix "$PROJECTS_UI_TOOLS" --no-audit --no-fund firebase-tools@15.30.0 playwright@1.57.0 esbuild@0.25.9
          "$PROJECTS_UI_TOOLS/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: All Project unit contracts
        run: node --test functions/projects/*.test.js
      - name: Full ERP typecheck
        run: npm run typecheck --prefix apps/erp-next
      - name: Actual Auth Firestore history and materials integration
        run: >-
          "$PROJECTS_UI_TOOLS/node_modules/.bin/firebase" emulators:exec
          --project demo-demac-projects --config firebase.projects-emulator.json --only firestore,auth
          'node --test functions/projects/history-reconciliation.emulator.cjs'
      - name: Actual shared dialogs and material panel in both browser engines
        run: node apps/erp-next/scripts/projects-history-browser.cjs
      - name: Full ERP build including existing regression gates
        run: npm run build --prefix apps/erp-next
      - name: Propose reviewed Git objects only; no ref update or deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/projects-history-workbench.py propose
      - name: Retain source manifest and synthetic UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projects-history-proposed-source
          path: |
            projects-history-proposed.json
            projects-history-ui-evidence/
          retention-days: 3
          if-no-files-found: warn
