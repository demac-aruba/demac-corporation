name: Controlled overnight attendance release
on:
  pull_request:
    paths:
      - 'scripts/employee-overnight-*'
      - '.github/workflows/employee-overnight-release.yml'
  push:
    branches: [release/employee-overnight-20261026]
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node --check scripts/employee-overnight-release.cjs && node --test scripts/employee-overnight-release.test.cjs scripts/appointment-finance-source-update.test.cjs scripts/appointment-finance-transport.test.cjs
  publish:
    if: github.ref == 'refs/heads/release/employee-overnight-20261026'
    needs: safety
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: field-operations-authority-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Publish reviewed Work Order source, then adjusted-shift writer guard
        run: node scripts/employee-overnight-release.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: employee-overnight-release
          path: ${{ runner.temp }}/employee-overnight-release/summary.json
          if-no-files-found: error
          retention-days: 90
