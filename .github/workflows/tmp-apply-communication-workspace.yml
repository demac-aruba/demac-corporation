name: Temporary Communication Center workspace transform

on:
  push:
    branches:
      - feature/communication-center-operator-workspace
    paths:
      - .github/workflows/tmp-apply-communication-workspace.yml

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/communication-center-operator-workspace
          fetch-depth: 0
      - name: Apply focused transform
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/tmp-apply-communication-workspace.py')
          text = path.read_text()

          text = text.replace('"          const state =', '"            const state =')
          text = text.replace('\\n          const owner =', '\\n            const owner =')
          text = text.replace('"              <span className={styles.rowMeta}', '"                <span className={styles.rowMeta}')
          text = text.replace('"    </aside>\\n\\n    <main className={`${styles.panel} ${styles.chat}`}>\\n"', '"      </aside>\\n\\n      <main className={`${styles.panel} ${styles.chat}`}>\\n"')
          text = text.replace('"        <div className={styles.messages}>\\n"', '"          <div className={styles.messages}>\\n"')
          text = text.replace('"    {detailsVisible ? <aside className={`${styles.panel} ${styles.contextPanel}`}>\\n"', '"      {detailsVisible ? <aside className={`${styles.panel} ${styles.contextPanel}`}>\\n"')
          text = text.replace('"          {([\'overview\', \'properties\', \'equipment\', \'actions\'] as ContextTab[]).map', '"            {([\'overview\', \'properties\', \'equipment\', \'actions\'] as ContextTab[]).map')
          text = text.replace('r"        \\{contextTab === \'properties\'', 'r"          \\{contextTab === \'properties\'')
          text = text.replace("\\n\\n        \\{contextTab === 'equipment'", "\\n\\n          \\{contextTab === 'equipment'")
          text = text.replace('drawer_anchor = "    </aside> : null}\\n  </div>\\n</section>;\\n}"', 'drawer_anchor = "      </aside> : null}\\n    </div>\\n  </section>;\\n}"')

          def indent_block(source, start_marker, end_marker, spaces=2):
              start = source.index(start_marker) + len(start_marker)
              end = source.index(end_marker, start)
              block = source[start:end]
              shifted = '\n'.join(((' ' * spaces) + line if line else line) for line in block.split('\n'))
              return source[:start] + shifted + source[end:]

          text = indent_block(text, "old_header_actions = '''", "'''\nnew_header_actions =", 2)
          text = indent_block(text, "workflow = '''", "'''\nreplace(workflow", 2)
          path.write_text(text)
          PY
          python tools/tmp-apply-communication-workspace.py
          git diff --check
      - name: Commit final branch state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name demac-aruba
          git config user.email gm.demac@gmail.com
          git rm .github/workflows/tmp-apply-communication-workspace.yml tools/tmp-apply-communication-workspace.py
          git add apps/erp-next/components/communications/communication-center.tsx
          git commit -m "Redesign Communication Center operator workspace"
          git push origin HEAD:feature/communication-center-operator-workspace
