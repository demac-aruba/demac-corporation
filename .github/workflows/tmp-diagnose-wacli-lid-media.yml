name: Temporary read-only wacli LID media diagnostic

on:
  push:
    branches:
      - fix/wacli-canonical-lid-media-20260817
    paths:
      - .github/workflows/tmp-diagnose-wacli-lid-media.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      DO_HOST: 159.223.160.239
      DO_USER: demac-deploy
    steps:
      - name: Configure restricted SSH
        env:
          DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
          ssh-keyscan -T 10 -H "$DO_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"
      - name: Inspect target message storage identity
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes "$DO_USER@$DO_HOST" "sudo -n /usr/local/sbin/demac-wacli-ro messages list --limit 250 --json" > /tmp/messages.json
          python3 - <<'PY'
          import json
          target='3EB001FBB1019368C2896F'
          with open('/tmp/messages.json','r',encoding='utf-8') as f:
              payload=json.load(f)
          rows=payload.get('data', payload) if isinstance(payload,dict) else payload
          if isinstance(rows,dict): rows=rows.get('messages') or rows.get('items') or []
          if not isinstance(rows,list): rows=[]
          match=None
          for row in rows:
              mid=str(row.get('ID') or row.get('MessageID') or row.get('msg_id') or row.get('id') or '')
              if mid==target:
                  match=row; break
          print('target_found=' + str(bool(match)).lower())
          if match:
              chat=str(match.get('ChatJID') or match.get('Chat') or match.get('chat_jid') or match.get('chat') or '')
              media=str(match.get('MediaType') or match.get('mediaType') or match.get('media_type') or '')
              local=match.get('LocalPath') or match.get('localPath') or match.get('local_path')
              downloaded=match.get('DownloadedAt') or match.get('downloadedAt') or match.get('downloaded_at')
              print('stored_chat_suffix=' + ('s.whatsapp.net' if chat.endswith('@s.whatsapp.net') else 'lid' if chat.endswith('@lid') else 'other'))
              print('stored_chat=' + chat)
              print('media_type=' + media)
              print('local_path_present=' + str(bool(local)).lower())
              print('downloaded_present=' + str(bool(downloaded)).lower())
          PY
      - name: Remove runner SSH key
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519"
