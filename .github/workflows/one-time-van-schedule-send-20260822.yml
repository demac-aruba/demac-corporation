name: One-Time Van Schedule Send 2026-08-22

on:
  push:
    branches:
      - main
    paths:
      - 'functions/ops/sendVanSchedules20260822.js'
      - '.github/workflows/one-time-van-schedule-send-20260822.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: one-time-van-schedule-send-20260822
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install function dependencies
        run: npm install --prefix functions --no-audit --no-fund

      - name: Validate one-time sender syntax
        run: node --check functions/ops/sendVanSchedules20260822.js

      - name: Authenticate Firebase production service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}

      - name: Send 2026-08-22 schedules through canonical WhatsApp queue
        env:
          GCLOUD_PROJECT: demac-corporation
          GOOGLE_CLOUD_PROJECT: demac-corporation
        run: node functions/ops/sendVanSchedules20260822.js | tee /tmp/van-send-result.json

      - name: Publish verified send status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          summary="$(node - /tmp/van-send-result.json <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          process.stdout.write(`${p.workOrderCount} work orders / ${p.messageCount} WhatsApp messages sent`);
          NODE
          )"
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=success \
            -f context='DEMAC / Van Schedule Send / 2026-08-22' \
            -f description="$summary"

      - name: Publish failed send status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=failure \
            -f context='DEMAC / Van Schedule Send / 2026-08-22' \
            -f description='One-time Van schedule send failed; inspect workflow logs'
