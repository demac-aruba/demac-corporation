name: Technician release read-only diagnosis
on:
  push:
    branches: [fix/pr526-release-preflight-20261008]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.repository == 'demac-aruba/demac-corporation' && github.ref == 'refs/heads/fix/pr526-release-preflight-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node --check scripts/technician-approved-release-diagnostics.cjs
      - run: node --test scripts/technician-approved-release.test.cjs scripts/booking-references-release-config.test.cjs
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read only existing function metadata, schedule and source dependency lock
        run: node scripts/technician-approved-release-diagnostics.cjs
