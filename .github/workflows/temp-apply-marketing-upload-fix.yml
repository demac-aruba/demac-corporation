name: Temporary Apply Marketing Upload Fix

on:
  push:
    branches:
      - fix/marketing-upload-errors
    paths:
      - '.github/workflows/temp-apply-marketing-upload-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/marketing-upload-errors
          fetch-depth: 2
      - name: Apply narrow TypeScript fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/erp-next/lib/firebase/marketing.ts')
          s=p.read_text()
          old="  let token = payload.downloadTokens?.split(',')[0]"
          new="  let token: string | undefined = payload.downloadTokens?.split(',')[0]"
          if old not in s:
              raise SystemExit('Expected token declaration not found')
          p.write_text(s.replace(old,new,1))
          PY
          rm .github/workflows/temp-apply-marketing-upload-fix.yml
          git config user.name 'demac-aruba'
          git config user.email 'gm.demac@gmail.com'
          git add apps/erp-next/lib/firebase/marketing.ts .github/workflows/temp-apply-marketing-upload-fix.yml
          git commit -m 'fix Marketing upload token typing'
          git push origin HEAD:fix/marketing-upload-errors
