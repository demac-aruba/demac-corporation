name: Apply wacli standard bearer cutover once

on:
  push:
    branches:
      - fix/wacli-standard-bearer-cutover-20260816-apply
    paths:
      - '.github/workflows/apply-wacli-standard-bearer-cutover-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/wacli-standard-bearer-cutover-20260816-apply
          fetch-depth: 0

      - name: Rewrite runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          canonical = 'https://us-central1-demac-corporation.cloudfunctions.net/wacliWebhook'

          server_path = Path('ops/digitalocean/deploy/server-v2.mjs')
          server = server_path.read_text(encoding='utf-8')
          server = server.replace("const ERP_WEBHOOK_URL = String(process.env.ERP_WEBHOOK_URL || '').trim();", f"const ERP_WEBHOOK_URL = '{canonical}';")
          server = server.replace("const BRIDGE_SIGNING_KEY_PATH = path.join(STATE_DIR, 'bridge-signing-ed25519-private.pem');\n", '')
          server = server.replace("let bridgeSigningPrivateKey = null;\nlet bridgeSigningPublicKeyDer = '';\n", '')
          server = server.replace("  if (!/^https:\\/\\//i.test(ERP_WEBHOOK_URL)) missing.push('ERP_WEBHOOK_URL (HTTPS)');\n", '')
          server, n = re.subn(r"\nfunction bridgeSignatureFor\(rawBody\) \{.*?\n\}\n\nasync function ensureBridgeSigningIdentity\(\) \{.*?\n\}\n", "\n", server, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Could not remove Ed25519 bridge signing block exactly once')
          old_forward = """    headers: {\n      'Content-Type': 'application/json',\n      'X-Demac-Bridge-Signature': bridgeSignatureFor(rawBody),\n    },"""
          new_forward = """    headers: {\n      'Content-Type': 'application/json',\n      Authorization: `Bearer ${BRIDGE_TOKEN}`,\n    },"""
          if old_forward not in server:
              raise SystemExit('Could not locate Ed25519 forward headers')
          server = server.replace(old_forward, new_forward, 1)
          server, n = re.subn(
              r"async function handleHealth\(response\) \{.*?\n\}\n\nrequireConfiguration\(\);\nawait ensureBridgeSigningIdentity\(\);",
              """async function handleHealth(response) {\n  json(response, 200, {\n    ok: true,\n    service: 'demac-whatsapp-wacli-bridge-v2',\n    bridgeAuth: 'bearer-v1',\n    erpWebhookUrl: ERP_WEBHOOK_URL,\n    startedAt,\n    hostname: os.hostname(),\n    pendingWebhookEvents: await pendingWebhookCount(),\n    identityCache: identityCache.size,\n    avatarCache: avatarCache.size,\n    lastForwardSuccessAt,\n    lastForwardError,\n    lastSendSuccessAt,\n    lastSendError,\n  });\n}\n\nrequireConfiguration();""",
              server,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('Could not replace bridge health/Ed25519 startup block exactly once')
          if any(x in server for x in ['X-Demac-Bridge-Signature', 'bridgeSignatureFor(', 'bridgeSigningPrivateKey', 'bridgeSigningPublicKeyDer', 'BRIDGE_SIGNING_KEY_PATH']):
              raise SystemExit('Legacy Ed25519 symbols remain in bridge source')
          if f"const ERP_WEBHOOK_URL = '{canonical}';" not in server:
              raise SystemExit('Canonical Firebase target missing from bridge')
          server_path.write_text(server, encoding='utf-8')

          gateway_path = Path('functions/whatsappWacliGateway.js')
          gateway = gateway_path.read_text(encoding='utf-8')
          gateway, n = re.subn(
              r"\nconst BRIDGE_PUBLIC_KEY_DER_BASE64 = .*?\.digest\(\"hex\"\);\n",
              "\n",
              gateway,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('Could not remove Firebase Ed25519 public-key block')
          gateway, n = re.subn(
              r"function inspectBridgeSignature\(request\) \{.*?\n\}\n\nfunction inferQueue",
              '''function safeSecretEqual(left, right) {\n  const first = Buffer.from(String(left || ""));\n  const second = Buffer.from(String(right || ""));\n  return first.length === second.length && first.length > 0 && crypto.timingSafeEqual(first, second);\n}\n\nfunction authorizedBridgeRequest(request) {\n  const header = String(request.get("authorization") || "");\n  if (!header.startsWith("Bearer ")) return false;\n  return safeSecretEqual(header.slice(7).trim(), String(wacliBridgeToken.value() || "").trim());\n}\n\nfunction inferQueue''',
              gateway,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('Could not replace Firebase Ed25519 verifier')
          gateway, n = re.subn(
              r"    const bridgeSignature = inspectBridgeSignature\(request\);\n  if \(!bridgeSignature\.valid\) \{.*?\n  \}\n\n    const payload = request\.body \?\? \{\};",
              '''    if (!authorizedBridgeRequest(request)) {\n      logger.warn("Rejected DEMAC bridge webhook with invalid bearer token.");\n      response.status(401).json({ error: "Unauthorized" });\n      return;\n    }\n\n    const payload = request.body ?? {};''',
              gateway,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('Could not replace Firebase request authentication block')
          gateway = gateway.replace('auth: "ed25519-v1",', 'auth: "bridge-bearer-v1",')
          if any(x in gateway for x in ['x-demac-bridge-signature', 'BRIDGE_PUBLIC_KEY', 'inspectBridgeSignature(', 'ed25519-v1']):
              raise SystemExit('Legacy Ed25519 symbols remain in Firebase gateway')
          if 'authorizedBridgeRequest(request)' not in gateway:
              raise SystemExit('Bearer authorization missing from Firebase gateway')
          gateway_path.write_text(gateway, encoding='utf-8')

          task = '''#!/usr/bin/env bash\nset -euo pipefail\n\nSTAGED=/home/demac-deploy/stage/server-v2.mjs\nDEPLOYED=/opt/demac-whatsapp-bridge/server-v2.mjs\nEXPECTED_TARGET='https://us-central1-demac-corporation.cloudfunctions.net/wacliWebhook'\n\necho '=== DEMAC STANDARD WACLI BRIDGE DEPLOY ==='\nprintf 'time_utc=%s\\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"\n\ntest -s "$STAGED"\nnode --check "$STAGED"\n\nif grep -q 'X-Demac-Bridge-Signature\\|bridgeSignatureFor\\|BRIDGE_SIGNING_KEY\\|wacliMediaUploadTicketV2' "$STAGED"; then\n  echo 'ERROR: staged bridge still contains retired custom authentication/upload-ticket code.' >&2\n  exit 1\nfi\nif ! grep -q "Authorization: `Bearer \\${BRIDGE_TOKEN}`" "$STAGED"; then\n  echo 'ERROR: staged bridge is missing standard Bearer forwarding.' >&2\n  exit 1\nfi\nif ! grep -Fq "$EXPECTED_TARGET" "$STAGED"; then\n  echo 'ERROR: staged bridge is missing the canonical Firebase target.' >&2\n  exit 1\nfi\n\necho 'staged_bridge_sha256='"$(sha256sum "$STAGED" | awk '{print $1}')"\n\nsudo -n /usr/local/sbin/demac-deploy-bridge\n\nnode --check "$DEPLOYED"\necho 'deployed_bridge_sha256='"$(sha256sum "$DEPLOYED" | awk '{print $1}')"\n\necho '=== SERVICE HEALTH AFTER DEPLOY ==='\nfor attempt in $(seq 1 30); do\n  if health="$(curl -fsS http://127.0.0.1:8787/health 2>/dev/null)"; then\n    ok="$(printf '%s' "$health" | python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("ok",False)).lower())')"\n    auth="$(printf '%s' "$health" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("bridgeAuth") or "")')"\n    target="$(printf '%s' "$health" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("erpWebhookUrl") or "")')"\n    if [ "$ok" = 'true' ] && [ "$auth" = 'bearer-v1' ] && [ "$target" = "$EXPECTED_TARGET" ]; then\n      echo "bridge_health_ready attempt=$attempt auth=$auth target=canonical"\n      break\n    fi\n  fi\n  if [ "$attempt" = '30' ]; then\n    echo 'ERROR: standard bridge did not become healthy on the canonical Firebase target.' >&2\n    exit 1\n  fi\n  sleep 2\ndone\n\necho '=== WAIT FOR OUTBOX DRAIN ==='\nfor attempt in $(seq 1 60); do\n  health="$(curl -fsS http://127.0.0.1:8787/health)"\n  pending="$(printf '%s' "$health" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("pendingWebhookEvents",-1))')"\n  error="$(printf '%s' "$health" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("lastForwardError") or "")')"\n  success="$(printf '%s' "$health" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("lastForwardSuccessAt") or "")')"\n  printf 'attempt=%s pending=%s success=%s error_present=%s\\n' "$attempt" "$pending" "${success:-none}" "$([ -n "$error" ] && echo yes || echo no)"\n  if [ "$pending" = '0' ] && [ -z "$error" ] && [ -n "$success" ]; then\n    echo 'STANDARD_BRIDGE_QUEUE_RECOVERED'\n    exit 0\n  fi\n  sleep 5\ndone\n\necho 'ERROR: bridge is healthy but the webhook outbox did not drain.' >&2\ncurl -fsS http://127.0.0.1:8787/health | python3 -m json.tool\nexit 1\n'''
          Path('ops/digitalocean/run/task.sh').write_text(task, encoding='utf-8')
          PY

          node --check ops/digitalocean/deploy/server-v2.mjs
          node --check functions/whatsappWacliGateway.js
          bash -n ops/digitalocean/run/task.sh
          grep -Fq 'https://us-central1-demac-corporation.cloudfunctions.net/wacliWebhook' ops/digitalocean/deploy/server-v2.mjs
          ! grep -qi 'ed25519\|X-Demac-Bridge-Signature\|BRIDGE_PUBLIC_KEY' ops/digitalocean/deploy/server-v2.mjs functions/whatsappWacliGateway.js

      - name: Commit runtime changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'demac-aruba'
          git config user.email 'gm.demac@gmail.com'
          git add functions/whatsappWacliGateway.js ops/digitalocean/deploy/server-v2.mjs ops/digitalocean/run/task.sh
          git diff --cached --stat
          git commit -m 'Replace custom wacli Ed25519 boundary with standard Bearer auth'
          git push origin HEAD:fix/wacli-standard-bearer-cutover-20260816-apply
