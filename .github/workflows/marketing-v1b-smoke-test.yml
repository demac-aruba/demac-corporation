name: Marketing V1B Production Smoke Test

on:
  push:
    branches:
      - agent/marketing-function-gcloud-deploy
    paths:
      - '.github/workflows/marketing-v1b-smoke-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install Firebase Admin dependency
        run: npm install --prefix functions --no-audit --no-fund

      - name: Trigger production analysis with synthetic DEMAC asset and clean up
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}
        run: |
          set -euo pipefail
          cd functions
          node <<'NODE'
          const { cert, initializeApp } = require('firebase-admin/app');
          const { getFirestore } = require('firebase-admin/firestore');

          const credentials = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON);
          initializeApp({ credential: cert(credentials), projectId: 'demac-corporation' });
          const db = getFirestore();
          const stamp = Date.now();
          const sessionId = `marketing-smoke-${stamp}`;
          const assetId = `marketing-smoke-asset-${stamp}`;
          const sessionRef = db.collection('marketingUploadSessions').doc(sessionId);
          const assetRef = db.collection('marketingAssets').doc(assetId);
          const now = new Date().toISOString();

          async function sleep(ms) { return new Promise((resolve) => setTimeout(resolve, ms)); }

          (async () => {
            try {
              await sessionRef.set({
                id: sessionId,
                name: 'Automated V1B smoke test',
                campaignType: 'other',
                status: 'ready',
                expectedAssetCount: 1,
                uploadedAssetCount: 1,
                failedAssetCount: 0,
                createdAt: now,
                updatedAt: now,
                createdByUserId: 'automated-smoke-test',
                createdByName: 'Automated smoke test',
              });

              await assetRef.set({
                id: assetId,
                sessionId,
                originalFileName: 'demac-icon-smoke-test.png',
                contentType: 'image/png',
                sizeBytes: 25762,
                storagePath: 'synthetic-smoke-test/external-source',
                downloadUrl: 'https://raw.githubusercontent.com/demac-aruba/demac-corporation/main/assets/icon.png',
                status: 'uploaded',
                createdAt: now,
                updatedAt: now,
                uploadedByUserId: 'automated-smoke-test',
              });

              await sleep(1200);
              const requestedAt = new Date().toISOString();
              await sessionRef.set({
                analysisStatus: 'queued',
                analysisRequestedAt: requestedAt,
                updatedAt: requestedAt,
              }, { merge: true });

              let session;
              for (let attempt = 0; attempt < 60; attempt += 1) {
                await sleep(5000);
                const snapshot = await sessionRef.get();
                session = snapshot.data() || {};
                if (session.analysisStatus === 'completed') break;
                if (session.analysisStatus === 'failed') {
                  throw new Error(`Production Marketing Agent analysis failed: ${session.analysisError || 'unknown error'}`);
                }
              }

              if (session?.analysisStatus !== 'completed') {
                throw new Error(`Production Marketing Agent analysis did not complete within the smoke-test window. Last status: ${session?.analysisStatus || 'missing'}`);
              }

              const asset = (await assetRef.get()).data() || {};
              if (asset.analysisStatus !== 'completed') throw new Error(`Asset analysis status is ${asset.analysisStatus || 'missing'}, expected completed.`);
              if (!Number.isFinite(asset.qualityScore)) throw new Error('Asset qualityScore was not persisted.');
              if (!Number.isFinite(asset.marketingSuitabilityScore)) throw new Error('Asset marketingSuitabilityScore was not persisted.');
              if (!Number.isFinite(asset.rankingScore)) throw new Error('Asset rankingScore was not persisted.');
              if (asset.rank !== 1) throw new Error(`Asset rank is ${asset.rank}, expected 1.`);
              if (session.primaryAssetId !== assetId) throw new Error('Session primaryAssetId does not match the analyzed asset.');

              console.log('Marketing V1B production smoke test passed:', {
                analysisStatus: session.analysisStatus,
                analyzedAssetCount: session.analyzedAssetCount,
                qualityScore: asset.qualityScore,
                marketingSuitabilityScore: asset.marketingSuitabilityScore,
                rankingScore: asset.rankingScore,
                rank: asset.rank,
                doNotUse: Boolean(asset.doNotUse),
              });
            } finally {
              await Promise.allSettled([assetRef.delete(), sessionRef.delete()]);
              console.log('Synthetic smoke-test Firestore documents cleaned up.');
            }
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
