name: Technician exact source correction
on:
  pull_request:
    paths: ['.github/workflows/technician-source-fix-once.yml']
permissions:
  contents: write
jobs:
  source-blob:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/technician-app-20260923' && github.event.pull_request.number == 526
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: '8905180eeaaa8d9ec178f5692c1c45f2523316fa'
          persist-credentials: false
      - name: Remove unreachable complete-state rendering; write an unreferenced blob only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,urllib.request
          path=pathlib.Path('apps/erp-next/components/field/technician-field-home.tsx')
          data=path.read_bytes()
          def oid(data):return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          assert oid(data)=='a9ddcc1ce2c128e5566f3d881e5153f9d1ed72c9'
          text=data.decode()
          changes={"className={state === 'current' ? styles.flowStepCurrent : state === 'complete' ? styles.flowStepComplete : styles.flowStep}":"className={state === 'current' ? styles.flowStepCurrent : styles.flowStep}","<b>{state === 'complete' ? '✓' : index + 1}</b>":"<b>{index + 1}</b>"}
          for old,new in changes.items():
              assert text.count(old)==1
              text=text.replace(old,new)
          data=text.encode();assert oid(data)=='032745c5deab798b48366e3c99ccf7e846f3a074'
          req=urllib.request.Request('https://api.github.com/repos/demac-aruba/demac-corporation/git/blobs',data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as response:result=json.load(response)
          assert result['sha']==oid(data)
          print('Verified corrected source blob:',result['sha'])
          print('No branch, commit, test bypass, deployment or production operation performed.')
          PY
