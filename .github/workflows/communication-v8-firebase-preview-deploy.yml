name: Communication Center V8 Firebase Preview Deploy

on:
  push:
    branches:
      - preview/communication-center-v8-consolidated
    paths:
      - 'functions/whatsappWacliGatewayV2.js'
      - 'functions/whatsappWacliMediaSenderV2.js'
      - 'functions/whatsappWacliBackfill.js'
      - 'functions/bootstrap.js'
      - 'storage.rules'
      - '.github/workflows/communication-v8-firebase-preview-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-v8-preview-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install Firebase Functions dependencies
        run: npm install --prefix functions --no-audit --no-fund

      - name: Configure Firebase service account
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error title=Firebase credential missing::FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION is not configured."
            exit 1
          fi
          CREDENTIAL_FILE="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$CREDENTIAL_FILE"
          chmod 600 "$CREDENTIAL_FILE"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CREDENTIAL_FILE" >> "$GITHUB_ENV"

      - name: Deploy only Communication Center V8 backend
        run: >-
          npx --yes firebase-tools@15.2.1 deploy
          --project demac-corporation
          --non-interactive
          --only
          "functions:wacliWebhookV2,functions:wacliMediaUploadTicketV2,functions:sendQueuedWacliMediaMessageV2,functions:wacliBackfillUpdateV2,storage"

