name: QuickBooks production metadata preflight
on:
  pull_request:
    paths:
      - 'scripts/quickbooks-production-preflight*.py'
      - '.github/workflows/quickbooks-production-preflight.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/quickbooks-production-preflight*.py'
      - '.github/workflows/quickbooks-production-preflight.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: python3 scripts/quickbooks-production-preflight.test.py
  inspect-reviewed-metadata:
    if: github.repository == 'demac-aruba/demac-corporation' && github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[qbo-production-preflight]')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f
      - run: python3 scripts/quickbooks-production-preflight.py
# Fixed metadata GETs only. No payload reads, provider calls, deploy or configuration write.
