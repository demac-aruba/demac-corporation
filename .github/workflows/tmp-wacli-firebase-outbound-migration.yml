name: Temporary wacli Firebase outbound-only migration

on:
  push:
    branches:
      - refactor/wacli-outbound-only-firebase-20260817
    paths:
      - 'tools/migrate-wacli-firebase-outbound-only.py'
      - '.github/workflows/tmp-wacli-firebase-outbound-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/wacli-outbound-only-firebase-20260817
      - name: Apply deterministic migration
        run: python3 tools/migrate-wacli-firebase-outbound-only.py
      - name: Validate source
        run: |
          node --check functions/whatsappWacliGateway.js
          grep -q 'exports.wacliMediaIngest' functions/whatsappWacliGateway.js
          grep -q 'exports.wacliOutboundPoll' functions/whatsappWacliGateway.js
          grep -q 'exports.wacliOutboundAck' functions/whatsappWacliGateway.js
          ! grep -q 'WACLI_BRIDGE_URL' functions/whatsappWacliGateway.js
          ! grep -q 'sendQueuedWacliMessage' functions/whatsappWacliGateway.js
      - name: Commit migrated gateway
        run: |
          git config user.name 'demac-aruba'
          git config user.email 'gm.demac@gmail.com'
          git add functions/whatsappWacliGateway.js
          git commit -m 'Make wacli Firebase boundary outbound-only'
          git push origin HEAD:refactor/wacli-outbound-only-firebase-20260817
