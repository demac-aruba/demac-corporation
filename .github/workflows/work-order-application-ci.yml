name: Work Order Application

on:
  pull_request:
    paths:
      - 'functions/bootstrap.js'
      - 'functions/bookingAfterHours.js'
      - 'functions/bookingAfterHours.test.js'
      - 'functions/employeeAttendanceCalculation.js'
      - 'functions/employeeAttendanceCalculation.d.ts'
      - 'functions/employeeAttendanceCalculation.test.js'
      - 'functions/workOrderApplicationService.js'
      - 'functions/workOrderApplicationService.test.js'
      - 'functions/bookingAuthorityCore.js'
      - 'functions/bookingAuthorityFirestore.js'
      - 'functions/bookingVanIdentity.js'
      - 'functions/bookingSchedulingPrimitives.js'
      - 'functions/operatingCalendarService.js'
      - 'functions/package.json'
      - '.github/workflows/work-order-application-ci.yml'
  push:
    branches:
      - main
      - feature/scheduling-booking-whatsapp-consolidation
    paths:
      - 'functions/bootstrap.js'
      - 'functions/bookingAfterHours.js'
      - 'functions/bookingAfterHours.test.js'
      - 'functions/employeeAttendanceCalculation.js'
      - 'functions/employeeAttendanceCalculation.d.ts'
      - 'functions/employeeAttendanceCalculation.test.js'
      - 'functions/workOrderApplicationService.js'
      - 'functions/workOrderApplicationService.test.js'
      - 'functions/bookingAuthorityCore.js'
      - 'functions/bookingAuthorityFirestore.js'
      - 'functions/bookingVanIdentity.js'
      - 'functions/bookingSchedulingPrimitives.js'
      - 'functions/operatingCalendarService.js'
      - 'functions/package.json'
      - '.github/workflows/work-order-application-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: work-order-application-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-work-order-application:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install function dependencies
        run: npm install --prefix functions --no-audit --no-fund

      - name: Validate canonical lifecycle syntax
        run: |
          set -euo pipefail
          node --check functions/bootstrap.js
          node --check functions/bookingAfterHours.js
          node --check functions/employeeAttendanceCalculation.js
          node --check functions/workOrderApplicationService.js

      - name: Run shared attendance authority tests
        run: node --test functions/employeeAttendanceCalculation.test.js

      - name: Run Booking Authority aggregate regression
        run: npm run --prefix functions test:booking-authority

      - name: Validate Cloud Function export
        run: |
          node - <<'NODE'
          const mod = require('./functions/bootstrap');
          if (typeof mod.workOrderApplication !== 'function') {
            throw new Error('workOrderApplication export missing from functions/bootstrap.js');
          }
          NODE

  deploy-work-order-application:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-work-order-application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate Firebase deployment service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve DEMAC runtime identity
        id: config
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_FUNCTION='officeBookingAuthority'
          if ! gcloud functions describe "$SOURCE_FUNCTION" --project=demac-corporation --gen2 --region=us-central1 --format='value(name)' >/dev/null 2>&1; then
            SOURCE_FUNCTION='wacliWebhook'
          fi
          RUN_SA="$(gcloud functions describe "$SOURCE_FUNCTION" --project=demac-corporation --gen2 --region=us-central1 --format='value(serviceConfig.serviceAccountEmail)')"
          if [ -z "$RUN_SA" ]; then
            echo '::error::Could not resolve the DEMAC Cloud Functions runtime service account.'
            exit 1
          fi
          echo "run_service_account=${RUN_SA}" >> "$GITHUB_OUTPUT"

      - name: Deploy Work Order Application only
        shell: bash
        env:
          RUN_SERVICE_ACCOUNT: ${{ steps.config.outputs.run_service_account }}
        run: |
          set -euo pipefail
          gcloud functions deploy workOrderApplication \
            --project=demac-corporation \
            --gen2 \
            --region=us-central1 \
            --runtime=nodejs22 \
            --source=functions \
            --entry-point=workOrderApplication \
            --memory=256Mi \
            --timeout=60s \
            --run-service-account="$RUN_SERVICE_ACCOUNT" \
            --trigger-http \
            --allow-unauthenticated \
            --quiet

      - name: Verify deployed Work Order Application boundary
        shell: bash
        run: |
          set -euo pipefail
          name='workOrderApplication'
          endpoint="https://us-central1-demac-corporation.cloudfunctions.net/${name}"
          state="$(gcloud functions describe "$name" --project=demac-corporation --gen2 --region=us-central1 --format='value(state)')"
          if [ "$state" != 'ACTIVE' ]; then
            echo "::error::${name} state is ${state:-unknown}."
            exit 1
          fi

          cors_headers="$(mktemp)"
          cors_status="$(curl --silent --show-error --output /dev/null --dump-header "$cors_headers" --write-out '%{http_code}' \
            --request OPTIONS "$endpoint" \
            --header 'Origin: https://demac-corporation.vercel.app' \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: authorization,content-type')"
          if [ "$cors_status" != '204' ]; then
            echo "::error::Work Order Application CORS preflight returned HTTP ${cors_status}; expected 204."
            cat "$cors_headers"
            rm -f "$cors_headers"
            exit 1
          fi
          rm -f "$cors_headers"

          body="$(mktemp)"
          status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
            --request POST "$endpoint" \
            --header 'Content-Type: application/json' \
            --data '{"action":"complete_after_hours_work_order","data":{"requestId":"deployment-auth-check","workOrderId":"not-used"}}')"
          if [ "$status" != '401' ]; then
            echo "::error::${name} returned HTTP ${status}; expected 401 without Firebase authentication."
            cat "$body"
            rm -f "$body"
            exit 1
          fi
          node - "$body" <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (payload?.error?.code !== 'unauthenticated') {
            throw new Error(`Unexpected unauthenticated payload: ${JSON.stringify(payload)}`);
          }
          console.log('workOrderApplication: ACTIVE and Firebase-auth protected');
          NODE
          rm -f "$body"
