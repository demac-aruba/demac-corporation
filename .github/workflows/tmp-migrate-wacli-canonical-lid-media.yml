name: Temporary canonical LID media migration

on:
  push:
    branches:
      - fix/wacli-canonical-lid-media-20260817
    paths:
      - tools/migrate-wacli-canonical-lid-media.py
      - .github/workflows/tmp-migrate-wacli-canonical-lid-media.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply canonical LID store migration
        run: python3 tools/migrate-wacli-canonical-lid-media.py
      - name: Validate bridge source
        run: |
          node --check ops/digitalocean/deploy/server-v2.mjs
          grep -Fq "['chats', 'show', '--jid', sourceChat]" ops/digitalocean/deploy/server-v2.mjs
          grep -Fq 'storageChatForPayload' ops/digitalocean/deploy/server-v2.mjs
          grep -Fq 'downloadInboundMedia(storageChat, messageId)' ops/digitalocean/deploy/server-v2.mjs
          grep -Fq 'if (canonical) identityCache.set' ops/digitalocean/deploy/server-v2.mjs
      - name: Commit migrated bridge
        run: |
          git config user.name demac-aruba
          git config user.email gm.demac@gmail.com
          git add ops/digitalocean/deploy/server-v2.mjs
          git commit -m "Canonicalize WhatsApp LID store access"
          git push origin HEAD:fix/wacli-canonical-lid-media-20260817
