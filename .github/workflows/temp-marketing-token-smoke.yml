name: Temporary Marketing Token Smoke

on:
  push:
    branches:
      - fix/marketing-storage-download-token
    paths:
      - '.github/workflows/temp-marketing-token-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}

      - name: Install function dependencies
        run: npm install --prefix functions --no-audit --no-fund

      - name: Upload through production Storage rules and verify download token
        env:
          FIREBASE_WEB_API_KEY: 'AIzaSyCo31zuo6d8RsgiLWGqUVOvRmHkisoF1DE'
          FIREBASE_STORAGE_BUCKET: 'demac-corporation.firebasestorage.app'
        shell: bash
        run: |
          set -euo pipefail
          cd functions
          node <<'NODE'
          const { randomUUID } = require('node:crypto');
          const { applicationDefault, initializeApp } = require('firebase-admin/app');
          const { getAuth } = require('firebase-admin/auth');
          const { getFirestore } = require('firebase-admin/firestore');
          const { getStorage } = require('firebase-admin/storage');

          const app = initializeApp({ credential: applicationDefault(), projectId: 'demac-corporation', storageBucket: process.env.FIREBASE_STORAGE_BUCKET });
          const auth = getAuth(app);
          const db = getFirestore(app);
          const bucket = getStorage(app).bucket();

          async function signIn(email, password) {
            const response = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${encodeURIComponent(process.env.FIREBASE_WEB_API_KEY)}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email, password, returnSecureToken: true }),
            });
            const payload = await response.json();
            if (!response.ok || !payload.idToken) throw new Error(`Auth failed: ${JSON.stringify(payload)}`);
            return payload.idToken;
          }

          async function upload(path, idToken, uid, sessionId, assetId) {
            const boundary = `demac-token-smoke-${randomUUID().replace(/[^a-zA-Z0-9_-]/g, '')}`;
            const bytes = Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9ZpP8AAAAASUVORK5CYII=', 'base64');
            const metadata = { sessionId, assetId, uploadedByUid: uid, originalFileName: 'diagnostic.png', variant: 'original' };
            const body = new Blob([
              `--${boundary}\r\n`,
              'Content-Type: application/json; charset=utf-8\r\n\r\n',
              JSON.stringify({ name: path, contentType: 'image/png', metadata }),
              `\r\n--${boundary}\r\n`,
              'Content-Type: image/png\r\n\r\n',
              new Blob([bytes], { type: 'image/png' }),
              `\r\n--${boundary}--`,
            ], { type: `multipart/related; boundary=${boundary}` });
            const endpoint = `https://firebasestorage.googleapis.com/v0/b/${encodeURIComponent(process.env.FIREBASE_STORAGE_BUCKET)}/o?name=${encodeURIComponent(path)}`;
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${idToken}`,
                'Content-Type': `multipart/related; boundary=${boundary}`,
                'X-Goog-Upload-Protocol': 'multipart',
              },
              body,
            });
            const text = await response.text();
            let payload = {};
            try { payload = text ? JSON.parse(text) : {}; } catch {}
            if (!response.ok) throw new Error(`Storage upload ${response.status}: ${text}`);
            return payload;
          }

          (async () => {
            const stamp = `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
            const email = `marketing-token-smoke-${stamp}@demac-smoke.test`;
            const password = `Smoke-${randomUUID()}Aa1!`;
            const sessionId = `token-smoke-${stamp}`;
            const assetId = `asset-${stamp}`;
            const path = `marketing/originals/${sessionId}/${assetId}-diagnostic.png`;
            let uid = '';
            try {
              const user = await auth.createUser({ email, password, emailVerified: true, displayName: 'Marketing token smoke' });
              uid = user.uid;
              const now = new Date().toISOString();
              await db.collection('users').doc(uid).set({ id: uid, name: 'Marketing token smoke', displayName: 'Marketing token smoke', email, role: 'admin', active: true, syntheticSmokeTest: true, createdAt: now, updatedAt: now });
              const idToken = await signIn(email, password);
              await new Promise((resolve) => setTimeout(resolve, 1500));

              const uploadPayload = await upload(path, idToken, uid, sessionId, assetId);
              let token = String(uploadPayload.downloadTokens || '').split(',')[0];
              if (!token) {
                const metadataResponse = await fetch(`https://firebasestorage.googleapis.com/v0/b/${encodeURIComponent(process.env.FIREBASE_STORAGE_BUCKET)}/o/${encodeURIComponent(path)}`, { headers: { Authorization: `Bearer ${idToken}` } });
                const metadataPayload = await metadataResponse.json();
                if (!metadataResponse.ok) throw new Error(`Metadata lookup ${metadataResponse.status}: ${JSON.stringify(metadataPayload)}`);
                token = String(metadataPayload.downloadTokens || metadataPayload?.metadata?.firebaseStorageDownloadTokens || '').split(',')[0];
              }
              if (!token) throw new Error('Upload succeeded but Firebase returned no download token.');

              const mediaUrl = `https://firebasestorage.googleapis.com/v0/b/${encodeURIComponent(process.env.FIREBASE_STORAGE_BUCKET)}/o/${encodeURIComponent(path)}?alt=media&token=${encodeURIComponent(token)}`;
              const mediaResponse = await fetch(mediaUrl);
              if (!mediaResponse.ok) throw new Error(`Tokenized media URL failed: HTTP ${mediaResponse.status}`);
              console.log(JSON.stringify({ uploadStatus: 200, tokenPresent: true, mediaStatus: mediaResponse.status, path }, null, 2));
            } finally {
              await bucket.file(path).delete({ ignoreNotFound: true }).catch(() => undefined);
              if (uid) {
                await db.collection('users').doc(uid).delete().catch(() => undefined);
                await auth.deleteUser(uid).catch(() => undefined);
              }
            }
          })().catch((error) => { console.error(error); process.exitCode = 1; });
          NODE
