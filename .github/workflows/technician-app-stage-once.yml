name: Technician App source transport

on:
  pull_request:
    paths:
      - '.github/technician-stage/**'
      - '.github/workflows/technician-app-stage-once.yml'

# Temporary Git-database object creation only. No refs, commits, releases or deployments
# are written by this job. The reviewed tree is advanced by the authenticated connector.
permissions:
  contents: write

jobs:
  stage-reviewed-tree:
    if: github.repository == 'demac-aruba/demac-corporation' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/technician-app-20260923' && github.event.pull_request.number == 526
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact tested patch and create unreferenced Git objects
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          def git(*args):
              return subprocess.check_output(['git', *args])
          head = git('rev-parse', 'HEAD').decode().strip()
          assert head == os.environ['EXPECTED_HEAD']
          assert git('rev-parse', 'HEAD^').decode().strip() == '37464eaa184c60c2974f8b634379e0aec90da903', 'Source base moved'
          assert not git('status', '--porcelain'), 'Checkout is not clean'
          expected_parts = ['e02862241152d0466ce99b6c0ad0873f13a572cdb32a70bc743c16adf43134e4','5deafad6e2a2109bcd007ecea907caa833d9acac3239cd1d6ff717c95f730716','fc6d5b32c74fa539c3f7b3a52cd59c053d9b454daf8b493bb23f8fe13775f2b2','7ca3d1733ff71647ae3da511fc4a2a3910ac3ac5d0fd4241404ef732f8816da2']
          parts = []
          for index, digest in enumerate(expected_parts, 1):
              part = pathlib.Path(f'.github/technician-stage/{index:02}.b64').read_bytes()
              assert hashlib.sha256(part).hexdigest() == digest, f'Transport part {index} differs'
              parts.append(part)
          raw = base64.b64decode(b''.join(parts), validate=True)
          patch = lzma.decompress(raw, memlimit=256*1024*1024)
          assert len(patch) == 122896
          assert hashlib.sha256(patch).hexdigest() == '5bd3aa9dfef91f937d7ced9027f3d23f57a2058807407a1529ee7ac7ff6f4b5b'
          patch_file = pathlib.Path(os.environ['RUNNER_TEMP']) / 'tested-field.patch'
          patch_file.write_bytes(patch)
          expected = json.loads(pathlib.Path('.github/technician-stage/manifest.json').read_text())
          subprocess.run(['git','apply','--check','--index',str(patch_file)], check=True)
          subprocess.run(['git','apply','--index','--whitespace=error-all',str(patch_file)], check=True)
          names = git('diff','--cached','--name-only','-z').decode().strip('\0').split('\0')
          assert set(names) == set(expected), 'Changed paths differ from reviewed scope'
          for path, wanted in expected.items():
              if wanted is None:
                  assert not pathlib.Path(path).exists(), path
              else:
                  assert git('rev-parse', ':'+path).decode().strip() == wanted, 'Blob differs: '+path
          # This transport is not application runtime code and is removed from the output tree.
          transport = [f'.github/technician-stage/{i:02}.b64' for i in range(1,5)] + ['.github/technician-stage/manifest.json','.github/workflows/technician-app-stage-once.yml']
          subprocess.run(['git','rm','--',*transport], check=True)
          expected.update({path: None for path in transport})
          root_tree = git('rev-parse','HEAD^{tree}').decode().strip()
          wanted_tree = git('write-tree').decode().strip()
          prefix = 'https://api.github.com/repos/demac-aruba/demac-corporation/git/'
          def post(kind, body):
              assert kind in ('blobs','trees'), 'No ref, commit or deployment writes are allowed'
              request = urllib.request.Request(prefix+kind, data=json.dumps(body).encode(), method='POST', headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          entries=[]
          for path,wanted in expected.items():
              if wanted is not None:
                  content=git('show', ':'+path)
                  result=post('blobs',{'content':base64.b64encode(content).decode(),'encoding':'base64'})
                  assert result['sha'] == wanted, 'Remote blob differs'
              entries.append({'path':path,'mode':'100644','type':'blob','sha':wanted})
          result=post('trees',{'base_tree':root_tree,'tree':entries})
          assert result['sha'] == wanted_tree, 'Remote tree differs'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'field-staged-tree';out.mkdir()
          (out/'staged-tree.json').write_text(json.dumps({'base':head,'tree':wanted_tree,'files':expected},indent=2))
          print('Verified source transport complete; no branch or production change performed.')
          print('Tree:', wanted_tree)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: technician-staged-tree-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/field-staged-tree/
          retention-days: 1
          if-no-files-found: error
