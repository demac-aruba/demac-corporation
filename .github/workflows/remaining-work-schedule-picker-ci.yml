name: Remaining Work Schedule Picker CI

on:
  pull_request:
    paths:
      - 'apps/erp-next/components/scheduling/partial-completion-panel.tsx'
      - 'apps/erp-next/components/scheduling/remaining-work-schedule-picker.tsx'
      - 'apps/erp-next/components/scheduling/remaining-work-schedule-picker.module.css'
      - 'apps/erp-next/lib/remaining-work-schedule-picker-model.ts'
      - 'apps/erp-next/scripts/remaining-work-schedule-picker-acceptance.ts'
      - '.github/workflows/remaining-work-schedule-picker-ci.yml'

permissions:
  contents: read

jobs:
  validate-picker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install ERP Next dependencies
        run: npm install --prefix apps/erp-next --no-audit --no-fund
      - name: ERP Next typecheck
        run: npm run typecheck --prefix apps/erp-next
      - name: Compile picker acceptance
        working-directory: apps/erp-next
        run: |
          rm -rf .remaining-picker-test
          npx tsc --ignoreConfig scripts/remaining-work-schedule-picker-acceptance.ts --module commonjs --target ES2022 --moduleResolution node --ignoreDeprecations 6.0 --esModuleInterop --skipLibCheck --types node --outDir .remaining-picker-test --rootDir . --lib ES2022,DOM
      - name: Picker model acceptance
        working-directory: apps/erp-next
        run: node .remaining-picker-test/scripts/remaining-work-schedule-picker-acceptance.js
