name: Apply wacli signature observability v2

on:
  push:
    branches: [fix/wacli-sig-final3]
    paths:
      - '.github/workflows/apply-wacli-signature-observability-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/wacli-sig-final3
          fetch-depth: 0

      - name: Apply source edit, validate, and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('functions/whatsappWacliGateway.js')
          source = path.read_text(encoding='utf-8')

          new_auth = '''function inspectBridgeSignature(request) {
            const provided = String(request.get("x-demac-bridge-signature") || "").trim();
            const rawValue = request.rawBody;
            const rawBody = Buffer.isBuffer(rawValue)
              ? rawValue
              : rawValue instanceof Uint8Array
                ? Buffer.from(rawValue.buffer, rawValue.byteOffset, rawValue.byteLength)
                : null;
            let signature = null;
            try {
              signature = provided.startsWith("ed25519=")
                ? Buffer.from(provided.slice("ed25519=".length), "base64")
                : null;
            } catch {
              signature = null;
            }

            const rawValid = Boolean(
              rawBody &&
              signature?.length === 64 &&
              crypto.verify(null, rawBody, BRIDGE_PUBLIC_KEY, signature)
            );
            let parsedBody = null;
            let parsedValid = false;
            try {
              parsedBody = Buffer.from(JSON.stringify(request.body ?? {}));
              parsedValid = Boolean(
                signature?.length === 64 &&
                crypto.verify(null, parsedBody, BRIDGE_PUBLIC_KEY, signature)
              );
            } catch {
              parsedBody = null;
            }

            return {
              valid: rawValid,
              header: Boolean(provided),
              scheme: provided.includes("=") ? provided.slice(0, provided.indexOf("=")) : null,
              sigBytes: signature?.length ?? null,
              rawAvailable: Boolean(rawBody),
              rawBytes: rawBody?.length ?? null,
              rawSha256: rawBody ? crypto.createHash("sha256").update(rawBody).digest("hex") : null,
              parsedBytes: parsedBody?.length ?? null,
              parsedSha256: parsedBody ? crypto.createHash("sha256").update(parsedBody).digest("hex") : null,
              parsedValid,
              keyFingerprint: BRIDGE_PUBLIC_KEY_FINGERPRINT,
            };
          }

          '''

          pattern = re.compile(r'function verifyBridgeSignature\(request\) \{.*?\n\}\n\nfunction bridgeSignatureDiagnostics\(request\) \{.*?\n\}\n\n', re.S)
          source, count = pattern.subn(new_auth, source, count=1)
          if count != 1:
            raise SystemExit(f'Expected one legacy signature implementation, found {count}.')

          old_handler = '''    if (!verifyBridgeSignature(request)) {
              logger.warn("Rejected DEMAC bridge webhook with invalid Ed25519 signature.", bridgeSignatureDiagnostics(request));
              response.status(401).send("Invalid signature");
              return;
            }'''.replace('      logger', '      logger').replace('      response', '      response').replace('      return', '      return').replace('    }', '    }')
          # Match independent of indentation to avoid formatting-only failures.
          handler_pattern = re.compile(
              r'\s{4}if \(!verifyBridgeSignature\(request\)\) \{\n'
              r'\s+logger\.warn\("Rejected DEMAC bridge webhook with invalid Ed25519 signature\."[^\n]*\);\n'
              r'\s+response\.status\(401\)\.send\("Invalid signature"\);\n'
              r'\s+return;\n'
              r'\s{4}\}',
          )
          new_handler = '''    const bridgeSignature = inspectBridgeSignature(request);
            if (!bridgeSignature.valid) {
              logger.warn("Rejected DEMAC bridge webhook with invalid Ed25519 signature.", bridgeSignature);
              response.status(401).json({
                error: "Invalid signature",
                diagnostics: {
                  header: bridgeSignature.header,
                  scheme: bridgeSignature.scheme,
                  sigBytes: bridgeSignature.sigBytes,
                  rawAvailable: bridgeSignature.rawAvailable,
                  rawBytes: bridgeSignature.rawBytes,
                  rawSha256: bridgeSignature.rawSha256,
                  parsedBytes: bridgeSignature.parsedBytes,
                  parsedSha256: bridgeSignature.parsedSha256,
                  parsedValid: bridgeSignature.parsedValid,
                  keyFingerprint: bridgeSignature.keyFingerprint,
                },
              });
              return;
            }'''
          source, count = handler_pattern.subn(new_handler, source, count=1)
          if count != 1:
            raise SystemExit(f'Expected one webhook auth boundary, found {count}.')

          path.write_text(source, encoding='utf-8')
          for temporary in [
              '.github/workflows/wacli-auth-diagnostics.yml',
              '.github/workflows/apply-wacli-signature-observability.yml',
              '.github/workflows/apply-wacli-signature-observability-v2.yml',
          ]:
              Path(temporary).unlink(missing_ok=True)
          PY

          node --check functions/whatsappWacliGateway.js
          git diff --check
          grep -q 'function inspectBridgeSignature' functions/whatsappWacliGateway.js
          ! grep -q 'function verifyBridgeSignature' functions/whatsappWacliGateway.js
          ! grep -q 'bridgeSignatureDiagnostics' functions/whatsappWacliGateway.js
          test ! -e .github/workflows/wacli-auth-diagnostics.yml
          test ! -e .github/workflows/apply-wacli-signature-observability.yml
          test ! -e .github/workflows/apply-wacli-signature-observability-v2.yml

          git config user.name 'demac-aruba'
          git config user.email 'gm.demac@gmail.com'
          git add -A
          git commit -m 'Make wacli signature boundary self-diagnostic'
          git push origin HEAD:fix/wacli-sig-final3
