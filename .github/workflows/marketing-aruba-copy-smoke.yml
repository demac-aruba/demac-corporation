name: Marketing Aruba Copy Smoke

on:
  push:
    branches:
      - test/marketing-aruba-copy-smoke
    paths:
      - '.github/workflows/marketing-aruba-copy-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aruba-copy-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install function dependencies
        run: npm install --prefix functions --no-audit --no-fund

      - name: Run authenticated production Aruba-copy smoke
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}
          FIREBASE_WEB_API_KEY: AIzaSyCo31zuo6d8RsgiLWGqUVOvRmHkisoF1DE
          STRATEGY_URL: https://us-central1-demac-corporation.cloudfunctions.net/requestMarketingCampaignStrategy
        run: |
          set -euo pipefail
          cd functions
          node <<'NODE'
          const { cert, initializeApp } = require('firebase-admin/app');
          const { getAuth } = require('firebase-admin/auth');
          const { getFirestore } = require('firebase-admin/firestore');

          const credentials = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON);
          initializeApp({ credential: cert(credentials), projectId: 'demac-corporation' });
          const auth = getAuth();
          const db = getFirestore();
          const stamp = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
          const email = `marketing-aruba-smoke-${stamp}@demac-smoke.test`;
          const sessionId = `marketing-aruba-smoke-${stamp}`;
          const assetId = `marketing-aruba-hero-${stamp}`;
          let uid;

          async function exchangeCustomToken(customToken) {
            const response = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=${encodeURIComponent(process.env.FIREBASE_WEB_API_KEY)}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ token: customToken, returnSecureToken: true }),
            });
            const payload = await response.json();
            if (!response.ok || !payload.idToken) throw new Error(`Firebase token exchange failed: ${JSON.stringify(payload)}`);
            return payload.idToken;
          }

          async function callStrategy(idToken) {
            const response = await fetch(process.env.STRATEGY_URL, {
              method: 'POST',
              headers: { Authorization: `Bearer ${idToken}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ data: { sessionId } }),
            });
            const text = await response.text();
            let payload = {};
            try { payload = text ? JSON.parse(text) : {}; } catch {}
            if (!response.ok || payload.error) throw new Error(`Strategy callable failed (${response.status}): ${payload?.error?.message || text}`);
            return payload.result ?? payload.data ?? payload;
          }

          (async () => {
            const sessionRef = db.collection('marketingUploadSessions').doc(sessionId);
            const campaignRef = db.collection('marketingCampaigns').doc(sessionId);
            const assetRef = db.collection('marketingAssets').doc(assetId);
            const userRef = () => db.collection('users').doc(uid);
            try {
              const user = await auth.createUser({ email, emailVerified: true, displayName: 'Marketing Aruba copy smoke' });
              uid = user.uid;
              const now = new Date().toISOString();
              await userRef().set({ id: uid, name: 'Marketing Aruba copy smoke', displayName: 'Marketing Aruba copy smoke', email, active: true, role: 'admin', createdAt: now, updatedAt: now, syntheticSmokeTest: true });
              await sessionRef.set({
                id: sessionId,
                name: 'Installation Aruba Papiamento smoke',
                campaignType: 'installation',
                status: 'ready',
                expectedAssetCount: 1,
                uploadedAssetCount: 1,
                failedAssetCount: 0,
                analysisStatus: 'completed',
                analyzedAssetCount: 1,
                usableAssetCount: 1,
                primaryAssetId: assetId,
                bestAssetIds: [assetId],
                recommendedCampaignType: 'installation',
                createdAt: now,
                updatedAt: now,
                createdByUserId: uid,
                createdByName: 'Marketing Aruba copy smoke',
                syntheticSmokeTest: true,
              });
              await assetRef.set({
                id: assetId,
                sessionId,
                originalFileName: 'real-installation.jpg',
                status: 'uploaded',
                analysisStatus: 'completed',
                rank: 1,
                rankingScore: 95,
                marketingSuitabilityScore: 96,
                qualityScore: 92,
                shotType: 'completed_outdoor_installation',
                recommendedCampaignType: 'installation',
                strengths: ['Clean completed installation', 'Professional mounting', 'Authentic residential HVAC work'],
                issues: [],
                recommendedUse: 'Use as the dominant installation hero image.',
                analysisSummary: 'A completed DEMAC air-conditioning installation with a clearly visible outdoor condenser and professional mounting.',
                containsPerson: false,
                containsReadableSensitiveData: false,
                createdAt: now,
                updatedAt: now,
                uploadedByUserId: uid,
                syntheticSmokeTest: true,
              });

              const idToken = await exchangeCustomToken(await auth.createCustomToken(uid));
              const result = await callStrategy(idToken);
              const [sessionSnapshot, campaignSnapshot] = await Promise.all([sessionRef.get(), campaignRef.get()]);
              const session = sessionSnapshot.data() || {};
              const campaign = campaignSnapshot.data() || {};
              const copy = campaign.copy || {};
              const customerCopy = [copy.headline, copy.subheadline, copy.primaryText, copy.cta].filter(Boolean).join(' ');
              const normalized = customerCopy.toLocaleLowerCase('en-US');
              const forbiddenExact = normalized.match(/\b(?:ku|hasi|kada|atenshon|konfiabel|profeshonal)\b/g) || [];
              const shonForms = normalized.match(/\b[\p{L}\p{N}'’-]*shon[\p{L}\p{N}'’-]*\b/gu) || [];

              if (session.campaignStrategyStatus !== 'completed') throw new Error(`campaignStrategyStatus=${session.campaignStrategyStatus || 'missing'}; error=${session.campaignStrategyError || 'none'}`);
              if (campaign.status !== 'strategy_completed') throw new Error(`campaign status=${campaign.status || 'missing'}`);
              if (campaign.papiamentoValidationStatus !== 'passed') throw new Error(`Expected PAPIAMENTO PASS, got ${campaign.papiamentoValidationStatus}; review=${JSON.stringify(campaign.papiamentoUnknownWords || [])}`);
              if ((campaign.papiamentoUnknownWords || []).length) throw new Error(`Unknown/review words remain: ${campaign.papiamentoUnknownWords.join(', ')}`);
              if ((campaign.papiamentoForbiddenWords || []).length) throw new Error(`Forbidden Papiamento forms remain: ${campaign.papiamentoForbiddenWords.join(', ')}`);
              if (forbiddenExact.length || shonForms.length) throw new Error(`Curaçao-style forms survived: ${[...forbiddenExact, ...shonForms].join(', ')}`);
              if (!copy.headline || !copy.subheadline || !copy.primaryText || !copy.cta) throw new Error('Campaign copy fields are incomplete.');
              if (campaign.factPolicy?.priceOrPromoIncluded && !(campaign.approvedFactSnapshot?.approvedOffers || []).length) throw new Error('Campaign included a promotion without an approved offer.');

              console.log('ARUBA COPY SMOKE PASS:', JSON.stringify({
                callableResult: result,
                headline: copy.headline,
                subheadline: copy.subheadline,
                primaryText: copy.primaryText,
                cta: copy.cta,
                validationStatus: campaign.papiamentoValidationStatus,
                validationMode: campaign.papiamentoValidationMode,
                revisionCount: campaign.papiamentoRevisionCount,
                unknownWords: campaign.papiamentoUnknownWords,
                forbiddenWords: campaign.papiamentoForbiddenWords,
                vocabulary: campaign.papiamentoVocabulary,
              }));
            } finally {
              await Promise.allSettled([
                campaignRef.delete(),
                sessionRef.delete(),
                assetRef.delete(),
                uid ? userRef().delete() : Promise.resolve(),
                uid ? auth.deleteUser(uid) : Promise.resolve(),
              ]);
              console.log('Synthetic Aruba-copy smoke data cleaned up.');
            }
          })().catch((error) => { console.error(error); process.exitCode = 1; });
          NODE
