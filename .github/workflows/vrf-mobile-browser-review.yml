name: VRF mobile browser review

on:
  pull_request:
    paths:
      - 'apps/erp-next/app/services/vrf-systems/**'
      - 'apps/erp-next/components/public/vrf-mobile-*'
      - 'apps/erp-next/components/public/vrf-page-*'
      - 'functions/websiteEditorialContract*'
      - 'functions/websiteVrfDefaults.json'
      - 'apps/erp-next/components/public/vrf-indoor-*'
      - 'apps/erp-next/components/vrf-website-manager-workspace.tsx'
      - 'apps/erp-next/lib/public-vrf-content.ts'
      - 'apps/erp-next/lib/public-vrf-indoor.ts'
      - 'apps/erp-next/public/website/vrf/indoor-*'
      - 'apps/erp-next/scripts/vrf-mobile-browser-review.cjs'
      - 'apps/erp-next/scripts/vrf-indoor-*'
      - '.github/workflows/vrf-mobile-browser-review.yml'

permissions:
  contents: read

concurrency:
  group: vrf-mobile-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build the actual ERP Next public site
        run: |
          npm install --prefix apps/erp-next --no-audit --no-fund
          npm run typecheck --prefix apps/erp-next
          npm run build --prefix apps/erp-next
      - name: Validate indoor catalogue and exact image bytes without data writes
        working-directory: apps/erp-next
        run: |
          npx tsc --ignoreConfig scripts/vrf-indoor-catalog-acceptance.ts ../../functions/websiteEditorialContract.js --allowJs --checkJs false --module commonjs --target ES2022 --moduleResolution node --ignoreDeprecations 6.0 --esModuleInterop --skipLibCheck --types node --outDir .vrf-indoor-test --rootDir ../..
          mkdir -p .vrf-indoor-test/functions
          cp ../../functions/websiteVrfDefaults.json .vrf-indoor-test/functions/
          node .vrf-indoor-test/apps/erp-next/scripts/vrf-indoor-catalog-acceptance.js
      - name: Install isolated browser test tools
        run: |
          npm install --prefix /tmp/vrf-browser playwright@1.56.1 --no-audit --no-fund
          /tmp/vrf-browser/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Review indoor images and existing phone interactions without production writes
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory apps/erp-next/out > /tmp/vrf-ui-server.log 2>&1 &
          node apps/erp-next/scripts/vrf-indoor-browser-review.cjs
          node apps/erp-next/scripts/vrf-mobile-browser-review.cjs
      - name: Upload browser screenshots and review results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vrf-mobile-browser-review
          path: .vrf-mobile-artifacts/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
