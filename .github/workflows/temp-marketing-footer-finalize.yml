name: Temporary Marketing Footer Finalize

on:
  push:
    branches:
      - agent/marketing-footer-finalize
    paths:
      - '.github/workflows/temp-marketing-footer-finalize.yml'

permissions:
  contents: write

jobs:
  patch-footer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: agent/marketing-footer-finalize
      - name: Apply deterministic final footer layer
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('functions/marketingCreativeBuilder.js')
          text = path.read_text()
          old = '''  return sharp(background)\n    .composite([{ input: overlaySvg(exact, template), top: 0, left: 0 }])\n    .png({ compressionLevel: 8 })\n    .toBuffer();'''
          new = '''  const rendered = await sharp(background)\n    .composite([{ input: overlaySvg(exact, template), top: 0, left: 0 }])\n    .png({ compressionLevel: 8 })\n    .toBuffer();\n\n  // Apply the reserved footer as a final raster layer after every other visual\n  // operation. This guarantees that the original DEMAC footer always receives\n  // a physically blank, opaque white zone regardless of SVG/compositing behavior.\n  const footerLayer = await sharp({\n    create: {\n      width: OUTPUT_SIZE,\n      height: FOOTER_RESERVED_PX,\n      channels: 4,\n      background: { r: 255, g: 255, b: 255, alpha: 1 },\n    },\n  }).png().toBuffer();\n\n  return sharp(rendered)\n    .composite([{\n      input: footerLayer,\n      top: OUTPUT_SIZE - FOOTER_RESERVED_PX,\n      left: 0,\n    }])\n    .png({ compressionLevel: 8 })\n    .toBuffer();'''
          if old not in text:
              raise SystemExit('Expected renderCreative block was not found.')
          path.write_text(text.replace(old, new, 1))
          PY
          node --check functions/marketingCreativeBuilder.js
      - name: Commit durable footer fix only
        run: |
          rm .github/workflows/temp-marketing-footer-finalize.yml
          git config user.name 'demac-aruba'
          git config user.email 'gm.demac@gmail.com'
          git add functions/marketingCreativeBuilder.js .github/workflows/temp-marketing-footer-finalize.yml
          git commit -m 'enforce Marketing footer as final raster layer'
          git push origin HEAD:agent/marketing-footer-finalize
