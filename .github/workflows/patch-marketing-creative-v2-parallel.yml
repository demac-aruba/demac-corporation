name: Patch Marketing Creative V2 Parallel

on:
  push:
    branches:
      - fix/marketing-creative-v2-parallel
    paths:
      - '.github/workflows/patch-marketing-creative-v2-parallel.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/marketing-creative-v2-parallel
      - name: Parallelize the three initial premium variants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('functions/marketingCreativeBuilderV2.js')
          s = p.read_text()

          old_signature = "async function renderVariant({ sessionId, creativeId, concept, heroBuffer, exact, hard, core, variantIndex, revisionInstructions = [], suffix = '' }) {"
          new_signature = "async function renderVariant({ sessionId, creativeId, concept, heroBuffer, exact, hard, core, variantIndex, revisionInstructions = [], suffix = '', reportProgress = true }) {"
          assert s.count(old_signature) == 1, f'renderVariant signature count={s.count(old_signature)}'
          s = s.replace(old_signature, new_signature)

          progress_replacements = [
            (
              "  await setProgress(sessionId, `render_${concept.id}${suffix}`, progressBase, `Generating ${concept.name}${suffix ? ' revision' : ''} with GPT Image 2…`, { currentVariant: concept.id });",
              "  if (reportProgress) await setProgress(sessionId, `render_${concept.id}${suffix}`, progressBase, `Generating ${concept.name}${suffix ? ' revision' : ''} with GPT Image 2…`, { currentVariant: concept.id });",
            ),
            (
              "  await setProgress(sessionId, `layout_${concept.id}${suffix}`, progressBase + 8, `Applying exact DEMAC typography to ${concept.name}…`, { currentVariant: concept.id });",
              "  if (reportProgress) await setProgress(sessionId, `layout_${concept.id}${suffix}`, progressBase + 8, `Applying exact DEMAC typography to ${concept.name}…`, { currentVariant: concept.id });",
            ),
            (
              "  await setProgress(sessionId, `qa_${concept.id}${suffix}`, progressBase + 13, `Running agency-quality QA on ${concept.name}…`, { currentVariant: concept.id });",
              "  if (reportProgress) await setProgress(sessionId, `qa_${concept.id}${suffix}`, progressBase + 13, `Running agency-quality QA on ${concept.name}…`, { currentVariant: concept.id });",
            ),
          ]
          for old, new in progress_replacements:
            assert s.count(old) == 1, f'progress anchor count={s.count(old)} for {old[:50]}'
            s = s.replace(old, new)

          old_loop = """  const variants = [];
  for (let index = 0; index < artDirection.concepts.length; index += 1) {
    variants.push(await renderVariant({ sessionId, creativeId, concept: artDirection.concepts[index], heroBuffer, exact, hard, core, variantIndex: index }));
  }

  await setProgress(sessionId, 'compare', 80, 'Comparing creative quality, agency feel and scroll-stopping power…');"""
          new_loop = """  await setProgress(sessionId, 'render_variants_parallel', 24, 'Generating three premium GPT Image 2 variants in parallel…', { totalVariants: artDirection.concepts.length });
  const variants = await Promise.all(artDirection.concepts.map((concept, index) => renderVariant({
    sessionId,
    creativeId,
    concept,
    heroBuffer,
    exact,
    hard,
    core,
    variantIndex: index,
    reportProgress: false,
  })));

  await setProgress(sessionId, 'compare', 80, 'Three variants ready. Comparing creative quality, agency feel and scroll-stopping power…', { completedVariants: variants.length });"""
          assert s.count(old_loop) == 1, f'sequential loop anchor count={s.count(old_loop)}'
          s = s.replace(old_loop, new_loop)

          p.write_text(s)
          PY
          node --check functions/marketingCreativeBuilderV2.js
          grep -q "Promise.all(artDirection.concepts.map" functions/marketingCreativeBuilderV2.js
          grep -q "reportProgress: false" functions/marketingCreativeBuilderV2.js
          ! grep -q "const variants = \[\];" functions/marketingCreativeBuilderV2.js
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/patch-marketing-creative-v2-parallel.yml
          git config user.name demac-aruba
          git config user.email gm.demac@gmail.com
          git add functions/marketingCreativeBuilderV2.js .github/workflows/patch-marketing-creative-v2-parallel.yml
          git commit -m "Parallelize Marketing Creative V2 variants"
          git push origin HEAD:fix/marketing-creative-v2-parallel
