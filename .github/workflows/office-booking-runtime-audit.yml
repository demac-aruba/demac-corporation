name: Office Booking read-only runtime audit
on:
  push:
    branches: [fix/booking-authority-runtime-health]
    paths:
      - scripts/office-booking-runtime-audit.cjs
      - scripts/office-booking-runtime-audit.test.cjs
      - .github/workflows/office-booking-runtime-audit.yml
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/office-booking-runtime-audit.cjs
      - scripts/office-booking-runtime-audit.test.cjs
      - .github/workflows/office-booking-runtime-audit.yml
permissions:
  contents: read
jobs:
  inspect-runtime:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify diagnostic output sanitization
        run: node --test scripts/office-booking-runtime-audit.test.cjs
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Inspect function health without changing production
        run: node scripts/office-booking-runtime-audit.cjs
