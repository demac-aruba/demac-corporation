name: Technician approved test project bootstrap

on:
  push:
    branches: ['feature/technician-app-20260923']
    paths: ['.github/workflows/technician-preview-bootstrap.yml']

permissions:
  contents: read

concurrency:
  group: technician-approved-project-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap-test-project:
    if: github.repository == 'demac-aruba/demac-corporation' && github.ref == 'refs/heads/feature/technician-app-20260923' && github.actor == 'demac-aruba'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      # Owner authorized a separate test environment on September 24. Creation is
      # limited to its labelled project under the existing DEMAC parent. No billing
      # link, IAM policy write, production change, application checkout or deploy.
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Provision the approved unbilled test shell or report the precise boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          """Provision only the approved test-project shell; never link billing or change IAM."""
          import json
          import os
          import re
          import subprocess
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          
          PRODUCTION = 'demac-corporation'
          TARGET = 'demac-erp-test-20260924'
          CRM = 'cloudresourcemanager.googleapis.com'
          FIREBASE = 'firebase.googleapis.com'
          LABELS = {'environment': 'test', 'demac-purpose': 'erp-preview', 'demac-task': 'pr-526'}
          PERMISSION = 'resourcemanager.projects.create'
          
          
          class Blocked(Exception):
              pass
          
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          
          def assert_request(method, host, path, body, parent):
              """No arbitrary endpoint, production mutation, credential export or IAM write."""
              allowed_get = (host == CRM and (path in (f'/v3/projects/{PRODUCTION}', f'/v3/projects/{TARGET}')
                             or re.fullmatch(r'/v3/operations/[A-Za-z0-9._-]+', path))) or (
                             host == FIREBASE and (path == f'/v1beta1/projects/{TARGET}'
                             or re.fullmatch(r'/v1beta1/operations/[A-Za-z0-9._-]+', path)))
              if method == 'GET' and body is None and allowed_get:
                  return
              if method == 'POST' and host == CRM and parent and re.fullmatch(r'(organizations|folders)/[0-9]+', parent):
                  if path == f'/v3/{parent}:testIamPermissions' and body == {'permissions': [PERMISSION]}:
                      return
                  if path == '/v3/projects' and body == {'projectId': TARGET, 'displayName': 'DEMAC ERP Test', 'parent': parent, 'labels': LABELS}:
                      return
              if method == 'POST' and host == FIREBASE and path == f'/v1beta1/projects/{TARGET}:addFirebase' and body == {}:
                  return
              raise Blocked('request_outside_approved_scope')
          
          
          class Api:
              def __init__(self, token, report):
                  self.token, self.report, self.parent = token, report, ''
                  self.opener = urllib.request.build_opener(NoRedirect)
          
              def __call__(self, method, host, path, body=None):
                  assert_request(method, host, path, body, self.parent)
                  req = urllib.request.Request('https://' + host + path, method=method,
                        data=None if body is None else json.dumps(body).encode(),
                        headers={'Authorization': 'Bearer ' + self.token, 'Content-Type': 'application/json'})
                  try:
                      with self.opener.open(req, timeout=30) as response:
                          status, result = response.status, json.load(response)
                  except urllib.error.HTTPError as error:
                      # No upstream error text, headers, or request body are retained.
                      status, result = error.code, {}
                  self.report['requests'].append({'method': method, 'host': host, 'path': path, 'httpStatus': status})
                  return status, result
          
          
          def require_ok(status, result, stage):
              if status != 200:
                  raise Blocked(f'{stage}_http_{status}')
              return result
          
          
          def wait_operation(api, host, version, operation, sleep):
              name = operation.get('name', '')
              if not re.fullmatch(r'operations/[A-Za-z0-9._-]+', name):
                  raise Blocked('unexpected_operation_name')
              for _ in range(30):
                  if operation.get('done') is True:
                      if operation.get('error'):
                          raise Blocked('operation_failed')
                      return
                  sleep(2)
                  operation = require_ok(*api('GET', host, f'/{version}/{name}'), 'operation_read')
              raise Blocked('operation_pending_reconcile_before_retry')
          
          
          def run(api, report, sleep=time.sleep):
              live = require_ok(*api('GET', CRM, f'/v3/projects/{PRODUCTION}'), 'production_metadata')
              if live.get('projectId') != PRODUCTION or live.get('state') != 'ACTIVE':
                  raise Blocked('production_metadata_identity_mismatch')
              parent = live.get('parent', '')
              report['productionParent'] = parent or None
              # A service account may not create a project outside an organization. Do not
              # change the production hierarchy or choose an unrelated organization to bypass it.
              if not re.fullmatch(r'(organizations|folders)/[0-9]+', parent):
                  raise Blocked('no_organization_parent_for_service_account_creation')
              api.parent = parent
              status, test = api('GET', CRM, f'/v3/projects/{TARGET}')
              if status == 404:
                  permissions = require_ok(*api('POST', CRM, f'/v3/{parent}:testIamPermissions', {'permissions': [PERMISSION]}), 'parent_permission_check')
                  report['hasProjectCreatePermission'] = PERMISSION in permissions.get('permissions', [])
                  if not report['hasProjectCreatePermission']:
                      raise Blocked('project_create_permission_not_granted')
                  operation = require_ok(*api('POST', CRM, '/v3/projects', {'projectId': TARGET, 'displayName': 'DEMAC ERP Test', 'parent': parent, 'labels': LABELS}), 'project_create')
                  report['projectCreationRequested'] = True
                  wait_operation(api, CRM, 'v3', operation, sleep)
                  test = require_ok(*api('GET', CRM, f'/v3/projects/{TARGET}'), 'created_project_verify')
              elif status != 200:
                  # Inaccessible is not nonexistent. Never try other project IDs after a denial.
                  raise Blocked(f'test_project_read_http_{status}')
              if test.get('projectId') != TARGET or test.get('parent') != parent or test.get('state') != 'ACTIVE' or any(test.get('labels', {}).get(k) != v for k, v in LABELS.items()):
                  raise Blocked('existing_project_not_the_approved_shell')
              report['projectVerified'] = True
              status, firebase = api('GET', FIREBASE, f'/v1beta1/projects/{TARGET}')
              if status == 404:
                  operation = require_ok(*api('POST', FIREBASE, f'/v1beta1/projects/{TARGET}:addFirebase', {}), 'firebase_registration')
                  report['firebaseRegistrationRequested'] = True
                  wait_operation(api, FIREBASE, 'v1beta1', operation, sleep)
                  firebase = require_ok(*api('GET', FIREBASE, f'/v1beta1/projects/{TARGET}'), 'firebase_verify')
              elif status != 200:
                  raise Blocked(f'firebase_read_http_{status}')
              if firebase.get('projectId') != TARGET:
                  raise Blocked('firebase_project_mismatch')
              report['firebaseVerified'] = True
              report['status'] = 'shell_ready_not_deployed'
              report['nextBoundary'] = 'Separate billing decision required before Storage and hosted backend provisioning.'
          
          
          def main():
              report = {'checkedAt': datetime.now(timezone.utc).isoformat(), 'source': os.environ['GITHUB_SHA'],
                        'targetProject': TARGET, 'status': 'running', 'requests': [], 'projectCreationRequested': False,
                        'projectVerified': False, 'firebaseRegistrationRequested': False, 'firebaseVerified': False,
                        'billingLinked': False, 'iamPolicyChanged': False, 'productionWrites': False, 'previewDeployed': False}
              output = Path(os.environ['RUNNER_TEMP']) / 'field-bootstrap-result'
              output.mkdir(parents=True, exist_ok=True)
              code = 0
              try:
                  token = subprocess.run(['gcloud', 'auth', 'print-access-token'], capture_output=True, text=True, check=True).stdout.strip()
                  if not token:
                      raise Blocked('existing_identity_token_unavailable')
                  run(Api(token, report), report)
              except Blocked as error:
                  report.update(status='blocked', reason=str(error))
                  code = 1
              except Exception:
                  report.update(status='failed', reason='unexpected_failure_reconcile_state_no_automatic_retry')
                  code = 1
              finally:
                  report['finishedAt'] = datetime.now(timezone.utc).isoformat()
                  (output / 'result.json').write_text(json.dumps(report, indent=2) + '\n')
                  print(json.dumps(report, indent=2))
              return code
          
          
          if __name__ == '__main__':
              raise SystemExit(main())
          PY
      - name: Preserve sanitized provisioning outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: technician-test-bootstrap-${{ github.sha }}
          path: ${{ runner.temp }}/field-bootstrap-result/
          if-no-files-found: error
          retention-days: 7
