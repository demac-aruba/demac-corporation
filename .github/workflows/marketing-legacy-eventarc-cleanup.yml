name: Marketing Legacy Eventarc Cleanup

on:
  push:
    branches:
      - agent/marketing-function-gcloud-deploy
    paths:
      - '.github/workflows/marketing-legacy-eventarc-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate Firebase deployment service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Delete legacy Eventarc Marketing Agent function
        shell: bash
        run: |
          set -euo pipefail
          if gcloud functions describe analyzeMarketingUploadSession --project=demac-corporation --gen2 --region=us-central1 --format='value(name)' >/dev/null 2>&1; then
            gcloud functions delete analyzeMarketingUploadSession \
              --project=demac-corporation \
              --gen2 \
              --region=us-central1 \
              --quiet
          fi
          if gcloud functions describe analyzeMarketingUploadSession --project=demac-corporation --gen2 --region=us-central1 --format='value(name)' >/dev/null 2>&1; then
            echo '::error::Legacy Eventarc Marketing function still exists after cleanup.'
            exit 1
          fi
          STATE="$(gcloud functions describe requestMarketingImageAnalysis --project=demac-corporation --gen2 --region=us-central1 --format='value(state)')"
          if [ "$STATE" != "ACTIVE" ]; then
            echo "::error::Callable Marketing function is ${STATE:-missing}, expected ACTIVE."
            exit 1
          fi
          echo 'Legacy Eventarc function removed; authenticated callable remains ACTIVE.'
