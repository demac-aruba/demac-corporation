name: Marketing V1C Authenticated Smoke

on:
  push:
    branches:
      - agent/marketing-agent-v1c-campaign-strategy
    paths:
      - 'functions/marketingCampaignStrategy.js'
      - 'functions/bootstrap.js'
      - '.github/workflows/marketing-v1c-authenticated-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install function dependencies
        run: npm install --prefix functions --no-audit --no-fund

      - name: Authenticate Firebase deployment service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve DEMAC runtime identity
        id: config
        shell: bash
        run: |
          set -euo pipefail
          REPORT_NAME='generateProfessionalCustomerReport'
          if ! gcloud functions describe "$REPORT_NAME" --project=demac-corporation --gen2 --region=us-central1 --format='value(name)' >/dev/null 2>&1; then
            REPORT_NAME="$(gcloud functions list --project=demac-corporation --gen2 --format='value(name)' | awk -F/ 'tolower($NF) ~ /generateprofessionalcustomerreport/ {print $NF; exit}')"
          fi
          RUN_SA="$(gcloud functions describe "$REPORT_NAME" --project=demac-corporation --gen2 --region=us-central1 --format='value(serviceConfig.serviceAccountEmail)')"
          test -n "$RUN_SA"
          echo "run_service_account=${RUN_SA}" >> "$GITHUB_OUTPUT"

      - name: Deploy V1C strategist for authenticated smoke
        shell: bash
        env:
          RUN_SERVICE_ACCOUNT: ${{ steps.config.outputs.run_service_account }}
        run: |
          set -euo pipefail
          gcloud functions deploy requestMarketingCampaignStrategy \
            --project=demac-corporation \
            --gen2 \
            --region=us-central1 \
            --runtime=nodejs22 \
            --source=functions \
            --entry-point=requestMarketingCampaignStrategy \
            --memory=512Mi \
            --timeout=540s \
            --run-service-account="$RUN_SERVICE_ACCOUNT" \
            --set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest \
            --trigger-http \
            --allow-unauthenticated \
            --quiet
          STATE="$(gcloud functions describe requestMarketingCampaignStrategy --project=demac-corporation --gen2 --region=us-central1 --format='value(state)')"
          test "$STATE" = 'ACTIVE'

      - name: Run authenticated V1C end-to-end smoke
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}
          FIREBASE_WEB_API_KEY: AIzaSyCo31zuo6d8RsgiLWGqUVOvRmHkisoF1DE
          STRATEGY_URL: https://us-central1-demac-corporation.cloudfunctions.net/requestMarketingCampaignStrategy
        run: |
          set -euo pipefail
          cd functions
          node <<'NODE'
          const { cert, initializeApp } = require('firebase-admin/app');
          const { getAuth } = require('firebase-admin/auth');
          const { getFirestore } = require('firebase-admin/firestore');

          const credentials = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON);
          initializeApp({ credential: cert(credentials), projectId: 'demac-corporation' });
          const auth = getAuth();
          const db = getFirestore();
          const stamp = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
          const email = `marketing-v1c-smoke-${stamp}@demac-smoke.test`;
          const sessionId = `marketing-v1c-smoke-${stamp}`;
          const asset1 = `marketing-v1c-smoke-hero-${stamp}`;
          const asset2 = `marketing-v1c-smoke-support-${stamp}`;
          let uid;

          async function exchangeCustomToken(customToken) {
            const response = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=${encodeURIComponent(process.env.FIREBASE_WEB_API_KEY)}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ token: customToken, returnSecureToken: true }),
            });
            const payload = await response.json();
            if (!response.ok || !payload.idToken) throw new Error(`Firebase token exchange failed: ${JSON.stringify(payload)}`);
            return payload.idToken;
          }

          async function callStrategy(idToken) {
            const response = await fetch(process.env.STRATEGY_URL, {
              method: 'POST',
              headers: { Authorization: `Bearer ${idToken}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ data: { sessionId } }),
            });
            const text = await response.text();
            let payload = {};
            try { payload = text ? JSON.parse(text) : {}; } catch {}
            if (!response.ok || payload.error) throw new Error(`Strategy callable failed (${response.status}): ${payload?.error?.message || text}`);
            return payload.result ?? payload.data ?? payload;
          }

          (async () => {
            const sessionRef = db.collection('marketingUploadSessions').doc(sessionId);
            const campaignRef = db.collection('marketingCampaigns').doc(sessionId);
            const assetRefs = [db.collection('marketingAssets').doc(asset1), db.collection('marketingAssets').doc(asset2)];
            const userRef = () => db.collection('users').doc(uid);
            try {
              const user = await auth.createUser({ email, emailVerified: true, displayName: 'Marketing V1C smoke test' });
              uid = user.uid;
              await userRef().set({ id: uid, name: 'Marketing V1C smoke test', displayName: 'Marketing V1C smoke test', email, active: true, role: 'admin', createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), syntheticSmokeTest: true });
              const now = new Date().toISOString();
              await sessionRef.set({
                id: sessionId,
                name: 'Otro Cliente Contento V1C smoke',
                campaignType: 'otro_cliente_contento',
                status: 'ready',
                expectedAssetCount: 2,
                uploadedAssetCount: 2,
                failedAssetCount: 0,
                analysisStatus: 'completed',
                analyzedAssetCount: 2,
                usableAssetCount: 2,
                primaryAssetId: asset1,
                bestAssetIds: [asset1, asset2],
                recommendedCampaignType: 'otro_cliente_contento',
                createdAt: now,
                updatedAt: now,
                createdByUserId: uid,
                createdByName: 'Marketing V1C smoke test',
                syntheticSmokeTest: true,
              });
              await assetRefs[0].set({ id: asset1, sessionId, originalFileName: 'installed-airco.jpg', status: 'analysis_pending', analysisStatus: 'completed', rank: 1, rankingScore: 94, marketingSuitabilityScore: 96, qualityScore: 93, shotType: 'installed_unit', recommendedCampaignType: 'otro_cliente_contento', strengths: ['Clean completed installation', 'Strong authentic proof of work', 'Clear air-conditioning unit'], issues: [], recommendedUse: 'Use as the dominant real installation hero image.', analysisSummary: 'Professional completed residential air-conditioning installation suitable for social proof.', containsPerson: false, containsReadableSensitiveData: false, createdAt: now, updatedAt: now, uploadedByUserId: uid, syntheticSmokeTest: true });
              await assetRefs[1].set({ id: asset2, sessionId, originalFileName: 'technician-work.jpg', status: 'analysis_pending', analysisStatus: 'completed', rank: 2, rankingScore: 86, marketingSuitabilityScore: 88, qualityScore: 85, shotType: 'technician_at_work', recommendedCampaignType: 'installation', strengths: ['Shows real workmanship', 'Supports trust'], issues: [], recommendedUse: 'Supporting proof image.', analysisSummary: 'Technician performing a professional installation task.', containsPerson: true, personUsageNote: 'Preserve authentic appearance.', containsReadableSensitiveData: false, createdAt: now, updatedAt: now, uploadedByUserId: uid, syntheticSmokeTest: true });

              const customToken = await auth.createCustomToken(uid);
              const idToken = await exchangeCustomToken(customToken);
              const result = await callStrategy(idToken);
              const [sessionSnapshot, campaignSnapshot] = await Promise.all([sessionRef.get(), campaignRef.get()]);
              const session = sessionSnapshot.data() || {};
              const campaign = campaignSnapshot.data() || {};

              if (session.campaignStrategyStatus !== 'completed') throw new Error(`campaignStrategyStatus=${session.campaignStrategyStatus || 'missing'}; error=${session.campaignStrategyError || 'none'}`);
              if (campaign.status !== 'strategy_completed') throw new Error(`campaign status=${campaign.status || 'missing'}`);
              if (campaign.heroAssetId !== asset1 && campaign.heroAssetId !== asset2) throw new Error(`Unexpected hero asset ${campaign.heroAssetId}`);
              if (!campaign.copy?.headline || !campaign.copy?.subheadline || !campaign.copy?.primaryText || !campaign.copy?.cta) throw new Error('Campaign copy fields were not persisted.');
              if (!['passed', 'needs_review'].includes(campaign.papiamentoValidationStatus)) throw new Error(`Unexpected Papiamento validation status ${campaign.papiamentoValidationStatus}`);
              if (!Array.isArray(campaign.papiamentoUnknownWords)) throw new Error('Papiamento unknown-word list missing.');
              if (campaign.factPolicy?.priceOrPromoIncluded && !(campaign.approvedFactSnapshot?.approvedOffers || []).length) throw new Error('Campaign included a price/promotion without an approved offer.');

              console.log('Marketing V1C authenticated smoke PASSED:', JSON.stringify({
                callableResult: result,
                campaignType: campaign.campaignType,
                heroAssetId: campaign.heroAssetId,
                headline: campaign.copy.headline,
                subheadline: campaign.copy.subheadline,
                cta: campaign.copy.cta,
                papiamentoValidationStatus: campaign.papiamentoValidationStatus,
                papiamentoUnknownWords: campaign.papiamentoUnknownWords,
                priceOrPromoIncluded: campaign.factPolicy?.priceOrPromoIncluded,
              }));
            } finally {
              await Promise.allSettled([
                campaignRef.delete(),
                sessionRef.delete(),
                ...assetRefs.map((ref) => ref.delete()),
                uid ? userRef().delete() : Promise.resolve(),
                uid ? auth.deleteUser(uid) : Promise.resolve(),
              ]);
              console.log('Synthetic V1C Firebase Auth user and Firestore documents cleaned up.');
            }
          })().catch((error) => { console.error(error); process.exitCode = 1; });
          NODE
