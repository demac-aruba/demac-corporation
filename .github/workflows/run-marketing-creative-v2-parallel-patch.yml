name: Run Creative V2 Parallel Patch

on:
  push:
    branches:
      - fix/marketing-creative-v2-parallel
    paths:
      - '.github/workflows/run-marketing-creative-v2-parallel-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/marketing-creative-v2-parallel
      - name: Apply patch
        run: python scripts/patchMarketingCreativeV2Parallel.py
      - name: Validate syntax
        run: |
          node --check functions/marketingCreativeBuilderV2.js
          grep -q "render_variants_parallel" functions/marketingCreativeBuilderV2.js
          grep -q "Promise.all(" functions/marketingCreativeBuilderV2.js
      - name: Commit patched function
        run: |
          rm -f .github/workflows/run-marketing-creative-v2-parallel-patch.yml
          rm -f .github/workflows/patch-marketing-creative-v2-parallel.yml
          rm -f scripts/patchMarketingCreativeV2Parallel.py
          git config user.name demac-aruba
          git config user.email gm.demac@gmail.com
          git add -A
          git commit -m "Parallelize Marketing Creative V2 variants"
          git push origin HEAD:fix/marketing-creative-v2-parallel
