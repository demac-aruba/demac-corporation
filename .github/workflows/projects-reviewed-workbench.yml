name: Projects reviewed flow isolated source validation
on:
  push:
    branches: ['chore/projects-reviewed-flow-validation']
permissions:
  contents: write
concurrency:
  group: projects-reviewed-flow-isolated-source
  cancel-in-progress: false
jobs:
  validate-and-propose:
    if: github.repository == 'demac-aruba/demac-corporation' && github.ref == 'refs/heads/chore/projects-reviewed-flow-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GCLOUD_PROJECT: demo-demac-projects
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare exact locally reviewed source in disposable checkout
        run: python3 .github/projects-reviewed-workbench.py apply
      - name: Correct the synthetic persistence boundary without changing runtime validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          path = 'functions/projects/progress-lifecycle.emulator.cjs'
          old_hash = '6e0a50cfbb355855ec9e1fd8dec0dd3a7fb84250'
          assert subprocess.check_output(['git','hash-object',path],text=True).strip() == old_hash
          p = Path(path)
          text = p.read_text()
          old_import = "const { requirePhasePrerequisites } = require('./phase-completion');"
          new_import = "const { storageStatusFromCanonical, projectCanonicalWorkVisit } = require('../fieldOperationsAuthorityWorkVisit');"
          assert text.count(old_import) == 1
          text = text.replace(old_import, new_import)
          old_status = "status: complete ? 'completed' : 'scheduled', version: 2,"
          new_status = "status: storageStatusFromCanonical(complete ? 'completed' : 'scheduled'), version: 2,"
          assert text.count(old_status) == 1
          text = text.replace(old_status, new_status)
          text += """
          test('pending support fixtures use the authoritative persisted status and round-trip correctly', async () => {
            const f = await fixture({ pendingSupport: true });
            const visit = (await db.collection('workVisits').doc(`VISIT-${f.ids[1]}`).get()).data();
            assert.equal(visit.status, 'not_started');
            assert.equal(projectCanonicalWorkVisit(visit).status, 'scheduled');
            const view = await preview(f.id);
            assert.equal(view.canRecord, true);
            assert.equal(view.sources.length, 1);
          });
          test('an invalid persisted support status still blocks progress and leaves all records unchanged', async () => {
            const f = await fixture({ pendingSupport: true });
            await db.collection('workVisits').doc(`VISIT-${f.ids[1]}`).update({ status: 'scheduled' });
            const before = await protectedState();
            const plan = await read(f.id);
            const view = await preview(f.id);
            assert.equal(view.canRecord, false);
            assert.ok(view.blockers.includes('field_visit_reconciliation_required'));
            await assert.rejects(record(f.id, 4, { preview: view }), { code: 'phase_progress_not_ready' });
            assert.deepEqual(await read(f.id), plan);
            assert.deepEqual(await protectedState(), before);
          });
          """
          p.write_text(text)
          new_hash = subprocess.check_output(['git','hash-object',path],text=True).strip()
          helper = Path('.github/projects-reviewed-workbench.py')
          source = helper.read_text()
          needle = "'" + path + "': '" + old_hash + "'"
          assert source.count(needle) == 1
          helper.write_text(source.replace(needle, "'" + path + "': '" + new_hash + "'"))
          print('Synthetic fixture uses canonical-to-storage conversion; original rejection remains covered.')
          print('CORRECTED_TEST_BLOB=' + new_hash)
          PY
          git diff --check
      - run: echo "PROJECTS_UI_TOOLS=$RUNNER_TEMP/reviewed-flow-tools" >> "$GITHUB_ENV"
      - name: Install isolated test tooling without production credentials
        run: |
          npm install --prefix functions --no-audit --no-fund
          npm install --prefix apps/erp-next --no-audit --no-fund
          npm install --prefix "$PROJECTS_UI_TOOLS" --no-audit --no-fund firebase-tools@15.30.0 playwright@1.57.0 esbuild@0.25.9
          "$PROJECTS_UI_TOOLS/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: All Project unit contracts
        run: node --test functions/projects/*.test.js
      - name: Full ERP typecheck
        run: npm run typecheck --prefix apps/erp-next
      - name: Real Auth Firestore progress lifecycle templates contention and pause
        run: >-
          "$PROJECTS_UI_TOOLS/node_modules/.bin/firebase" emulators:exec
          --project demo-demac-projects --config firebase.projects-emulator.json --only firestore,auth
          'node --test functions/projects/progress-lifecycle.emulator.cjs'
      - name: Actual dialogs in Chromium and WebKit with isolated transport
        run: node apps/erp-next/scripts/projects-central-reviewed-flow-browser.cjs
      - name: Full ERP production build with existing prebuild gates intact
        run: npm run build --prefix apps/erp-next
      - name: Create reviewed Git objects only, no ref update or deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/projects-reviewed-workbench.py propose
      - name: Retain proposed source manifest and synthetic UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projects-reviewed-proposed-source
          path: |
            reviewed-proposed-commit.json
            projects-reviewed-flow-evidence/
          if-no-files-found: warn
          retention-days: 3
