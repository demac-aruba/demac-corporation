name: Van Schedule Policy Diagnostic

on:
  push:
    branches:
      - main
    paths:
      - 'functions/diagnostics/readVanSchedulePolicy.js'
      - '.github/workflows/van-schedule-policy-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: van-schedule-policy-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install function dependencies
        run: npm install --prefix functions --no-audit --no-fund
      - name: Validate diagnostic
        run: node --check functions/diagnostics/readVanSchedulePolicy.js
      - name: Authenticate Firebase production service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}
      - name: Read production van schedule policy
        env:
          GCLOUD_PROJECT: demac-corporation
          GOOGLE_CLOUD_PROJECT: demac-corporation
        run: node functions/diagnostics/readVanSchedulePolicy.js | tee /tmp/van-policy.json
      - name: Publish diagnostic summary statuses
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for van in VAN-1 VAN-2 VAN-3 VAN-4; do
            description="$(node - "$van" /tmp/van-policy.json <<'NODE'
          const fs = require('node:fs');
          const vanId = process.argv[2];
          const path = process.argv[3];
          const payload = JSON.parse(fs.readFileSync(path, 'utf8'));
          const van = payload.vans.find((item) => item.vanId === vanId);
          const rules = van?.rules || [];
          const summary = rules.length ? rules.map((r) => `weekday=${r.weekday} ${r.workdayStart || '08:00'}-${r.workdayEnd || '13:00'}`).join('; ') : 'NO ACTIVE HALF-DAY RULE';
          process.stdout.write(summary.slice(0, 140));
          NODE
            )"
            gh api repos/${{ github.repository }}/statuses/${{ github.sha }} -f state=success -f context="DEMAC / ${van} Schedule" -f description="$description"
          done
          totals="$(node - /tmp/van-policy.json <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          process.stdout.write(`halfDays=${p.activeHalfDayCount}; deprecatedEmployeeDays=${p.deprecatedEmployeeDayOffs.length}`);
          NODE
          )"
          gh api repos/${{ github.repository }}/statuses/${{ github.sha }} -f state=success -f context='DEMAC / Van Schedule Diagnostic' -f description="$totals"
