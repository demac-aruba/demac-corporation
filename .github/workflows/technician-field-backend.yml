name: Technician Field backend integration

on:
  push:
    branches: ['feature/technician-app-20260923']
    paths:
      - 'functions/fieldOperations*.js'
      - 'functions/test-support/fieldProcedure*.cjs'
      - 'functions/package.json'
      - '.github/workflows/technician-field-backend.yml'
  pull_request:
    paths:
      - 'functions/fieldOperations*.js'
      - 'functions/test-support/fieldProcedure*.cjs'
      - 'functions/package.json'
      - '.github/workflows/technician-field-backend.yml'

permissions:
  contents: read

concurrency:
  group: technician-field-backend-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-integration:
    if: github.repository == 'demac-aruba/demac-corporation' && ((github.event_name == 'push' && github.ref == 'refs/heads/feature/technician-app-20260923') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/technician-app-20260923' && github.event.pull_request.number == 526))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GCLOUD_PROJECT: demo-demac-dwellings
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8297
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9297
      FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9397
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Retain exact upstream changes for compatibility review
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 38542864b07ef18b32542ff08118fe9eea1526aa d82350f9cfad76a12d089fa6a00f938a75f5cf77
          python3 - <<'PYCODE'
          import hashlib,json,os,subprocess
          from pathlib import Path
          base='38542864b07ef18b32542ff08118fe9eea1526aa'
          main='d82350f9cfad76a12d089fa6a00f938a75f5cf77'
          def git(*args): return subprocess.check_output(['git',*args])
          paths=git('diff','--name-only','-z',base,main).decode().strip('\0').split('\0')
          output=Path(os.environ['RUNNER_TEMP'])/'field-upstream-source';output.mkdir()
          records=[]
          for path in paths:
              entry=git('ls-tree',main,'--',path).decode().strip()
              mode,kind,sha_and_path=entry.split(' ',2)
              sha,name=sha_and_path.split('\t',1)
              if mode!='100644' or kind!='blob' or name!=path or '..' in path.split('/') or Path(path).name.startswith('.env'):
                  raise SystemExit('Unexpected upstream source path or mode')
              content=git('show',main+':'+path)
              if b'PRIVATE KEY-----' in content: raise SystemExit('Private key material rejected')
              records.append({'path':path,'sha':sha,'size':len(content),'sha256':hashlib.sha256(content).hexdigest()})
          archive=git('archive','--format=tar.gz',main,'--',*paths)
          (output/'upstream.tar.gz').write_bytes(archive)
          (output/'manifest.json').write_text(json.dumps({'base':base,'main':main,'head':git('rev-parse','HEAD').decode().strip(),'files':records,'archiveSha256':hashlib.sha256(archive).hexdigest()},indent=2))
          print('Captured exact upstream source only; no merge, branch update or application execution.')
          PYCODE
      - name: Retain upstream source artifact
        uses: actions/upload-artifact@v4
        with:
          name: technician-field-upstream-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/field-upstream-source/
          retention-days: 3
          if-no-files-found: error
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Existing dependencies and required tests
        run: |
          set -euo pipefail
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}"
          npm install --prefix functions --ignore-scripts --no-audit --no-fund
          npm run validate:firebase --prefix functions
          npm run test:field-authority --prefix functions
          npm install --prefix "$RUNNER_TEMP/field-tools" --no-audit --no-fund firebase-tools@15.30.0
      - name: Real loopback Auth, Firestore, Storage and HTTP integration
        run: |
          set -euo pipefail
          export FIELD_PROCEDURE_TEST_RESULTS="$RUNNER_TEMP/field-procedure-backend"
          # Pin the exact checked-out rules using absolute paths. Never substitute open rules.
          node - <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),cp=require('node:child_process');
          const config=JSON.parse(fs.readFileSync('firebase.dwellings-preview.json','utf8'));
          for(const key of ['firestore','storage']) {
            const rule=key+'.rules';
            const expected=cp.execFileSync('git',['show','HEAD:'+rule]);
            if(!fs.readFileSync(rule).equals(expected))throw new Error('Rules changed during test preparation: '+key);
            config[key]={rules:path.resolve(rule)};
          }
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'field-backend.firebase.json'),JSON.stringify(config));
          NODE
          "$RUNNER_TEMP/field-tools/node_modules/.bin/firebase" emulators:exec --project demo-demac-dwellings --config "$RUNNER_TEMP/field-backend.firebase.json" --only auth,firestore,storage 'node functions/test-support/fieldProcedureEmulator.cjs'
      - name: Retain sanitized backend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: technician-field-backend-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/field-procedure-backend/
          retention-days: 7
          if-no-files-found: warn
