permissions:
  contents: read

concurrency:
  group: office-booking-authority-production
  cancel-in-progress: false

jobs:
  validate-office-booking-authority:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install function dependencies
        run: npm install --prefix functions --no-audit --no-fund

      - name: Validate Office Booking Authority boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/index.js
          node --check functions/bootstrap.js
          node --check functions/officeBookingAuthority.js
          node --check functions/officeBookingAuthorityFacade.js
          node --check functions/officeBookingAuthorityPartialWrapper.js
          node --check functions/appointmentCommunicationAuthority.js
          node --check functions/appointmentCommunicationRenderer.js
          node --check functions/vanScheduleCommunicationAuthority.js
          node --check functions/technicianDailyScheduleService.js
          node --check functions/whatsappTransactionalService.js
          node --check functions/operatingCalendarService.js
          node --check functions/appointmentNotificationService.js
          node --check functions/customerContactDirectory.js
          node --check functions/bookingAdhocSupport.js
          node --check functions/bookingOperationalMove.js
          node --check functions/bookingRegularHistoricalCapacity.js
          node --check functions/bookingAuthorityCore.js
          node --check functions/bookingAuthorityFirestore.js
          node --check functions/bookingAuthorityWorkOrders.js
          node --check functions/bookingAuthorityAppointmentLifecycle.js
          node --check functions/bookingAuthoritySchedulingEngine.js
          node --check functions/bookingAuthoritySchedulingProvider.js
          node --check functions/serviceCatalog.js
          node --check functions/bookingCapacityAvailability.js
          node --check functions/bookingVanIdentity.js
          node --test functions/vanScheduleCommunicationAuthority.test.js
          node --test functions/technicianDailyScheduleService.test.js
          node --test functions/whatsappTransactionalGroupRecipient.test.js
          node --test functions/operatingCalendarService.test.js
          node --test functions/appointmentCommunicationRenderer.test.js
          node --test functions/appointmentNotificationService.test.js
          node --test functions/appointmentCommunicationAuthority.test.js
          node --test functions/customerContactDirectory.test.js
          node --test functions/bookingAuthorityWorkOrders.test.js
          node --test functions/bookingAdhocSupport.test.js
          node --test functions/bookingOperationalMove.test.js
          node --test functions/bookingRegularHistoricalCapacity.test.js
          node --test functions/bookingCapacityAvailability.test.js
          node --test functions/bookingAuthorityAppointmentLifecycle.test.js
          node --test functions/serviceCatalog.test.js
          node --test functions/bookingAuthoritySchedulingEngine.test.js
          node --test functions/bookingAuthoritySchedulingProvider.test.js
          node --test functions/bookingVanIdentity.test.js
          node --test functions/officeBookingAuthority.test.js
          node --test functions/projectOperatorBooking.test.js
          node --test functions/officeBookingAuthorityFacadeProject.test.js functions/officeBookingAuthorityFacadePartial.test.js functions/officeBookingAuthorityPartialWrapper.test.js functions/bookingPartialCompletion.test.js
          node --test functions/officeBookingAuthorityCommunication.test.js
          node --test functions/officeBookingAuthorityCatalog.test.js
          node --test functions/officeBookingAuthorityMasterData.test.js
          node - <<'NODE'
          const mod = require('./functions/bootstrap');
          if (typeof mod.officeBookingAuthority !== 'function') {
            throw new Error('officeBookingAuthority export missing from functions/bootstrap.js');
          }
          NODE

  validate-appointment-charges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated verification tools and app dependencies
        run: |
          npm install --prefix functions --no-audit --no-fund
          npm install --prefix apps/erp-next --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/charge-tools" --no-audit --no-fund esbuild@0.25.12 playwright@1.58.2 firebase-tools@15.30.0
          "$RUNNER_TEMP/charge-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Financial authority and integration regressions
        run: |
          node --test functions/appointmentCharges.test.js functions/bookingAuthorityFirestore.test.js functions/bookingAfterHours.test.js functions/servicePricingAuthority.test.js functions/bookingProjectHistoricalCapacity.test.js functions/projectRecords.test.js functions/projectOperatorBooking.test.js
          node --check scripts/appointment-charges-project-deploy.cjs
          node --test scripts/appointment-charges-project-deploy.test.cjs
          node --test scripts/appointment-charges-project-compat.test.cjs
          npm run typecheck --prefix apps/erp-next
      - name: Real Firestore transaction and authorization checks
        run: >-
          "$RUNNER_TEMP/charge-tools/node_modules/.bin/firebase" emulators:exec
          --only firestore --project demo-demac-charges --config firebase.appointment-charges-test.json
          'node --test functions/appointmentCharges.emulator.test.cjs'
      - name: Real component browser flows and visual evidence
        env:
          BOOKING_MODAL_TEST_TOOLS: ${{ runner.temp }}/charge-tools
          BOOKING_MODAL_TEST_OUTPUT: ${{ runner.temp }}/charge-evidence
        run: |
          node apps/erp-next/scripts/booking-modal-browser.cjs
          node apps/erp-next/scripts/appointment-charges-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appointment-charges-evidence
          path: ${{ runner.temp }}/charge-evidence

  deploy-office-booking-authority:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (!contains(github.event.head_commit.message, '[merge-only]') || contains(github.event.head_commit.message, '[deploy-appointment-charges]'))
    needs: [validate-office-booking-authority, validate-appointment-charges]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Authenticate Firebase deployment service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy reviewed Project commercial guard first
        if: contains(github.event.head_commit.message, '[deploy-appointment-charges]')
        run: node scripts/appointment-charges-project-deploy.cjs

      - name: Resolve DEMAC runtime identity
        id: config
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_FUNCTION='generateProfessionalCustomerReport'
          if ! gcloud functions describe "$SOURCE_FUNCTION" --project=demac-corporation --gen2 --region=us-central1 --format='value(name)' >/dev/null 2>&1; then
            SOURCE_FUNCTION='wacliWebhook'
          fi
          RUN_SA="$(gcloud functions describe "$SOURCE_FUNCTION" --project=demac-corporation --gen2 --region=us-central1 --format='value(serviceConfig.serviceAccountEmail)')"
          if [ -z "$RUN_SA" ]; then
            echo '::error::Could not resolve the DEMAC Cloud Functions runtime service account.'
            exit 1
          fi
          echo "run_service_account=${RUN_SA}" >> "$GITHUB_OUTPUT"

      - name: Deploy Office Booking Authority only
        shell: bash
        env:
          RUN_SERVICE_ACCOUNT: ${{ steps.config.outputs.run_service_account }}
        run: |
          set -euo pipefail
          gcloud functions deploy officeBookingAuthority \
            --project=demac-corporation \
            --gen2 \
            --region=us-central1 \
            --runtime=nodejs22 \
            --source=functions \
            --entry-point=officeBookingAuthority \
            --memory=256Mi \
            --timeout=60s \
            --run-service-account="$RUN_SERVICE_ACCOUNT" \
            --trigger-http \
            --allow-unauthenticated \
            --quiet

      - name: Verify deployed Office Booking Authority
        shell: bash
        run: |
          set -euo pipefail
          name='officeBookingAuthority'
          endpoint="https://us-central1-demac-corporation.cloudfunctions.net/${name}"
          state="$(gcloud functions describe "$name" --project=demac-corporation --gen2 --region=us-central1 --format='value(state)')"
          if [ "$state" != 'ACTIVE' ]; then
            echo "::error::${name} state is ${state:-unknown}."
            exit 1
          fi

          cors_headers="$(mktemp)"
          cors_status="$(curl --silent --show-error --output /dev/null --dump-header "$cors_headers" --write-out '%{http_code}' \
            --request OPTIONS "$endpoint" \
            --header 'Origin: https://demac-corporation.vercel.app' \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: authorization,content-type')"
          if [ "$cors_status" != '204' ]; then
            echo "::error::Office Booking Authority CORS preflight returned HTTP ${cors_status}; expected 204."
            cat "$cors_headers"
            rm -f "$cors_headers"
            exit 1
          fi
          rm -f "$cors_headers"

          body="$(mktemp)"
          status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
            --request POST "$endpoint" \
            --header 'Content-Type: application/json' \
            --data '{"action":"list_presets","data":{}}')"
          if [ "$status" != '401' ]; then
            echo "::error::${name} returned HTTP ${status}; expected 401 without Firebase authentication."
            cat "$body"
            rm -f "$body"
            exit 1
          fi
          node - "$body" <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (payload?.error?.code !== 'unauthenticated') {
            throw new Error(`Unexpected unauthenticated payload: ${JSON.stringify(payload)}`);
          }
          console.log('officeBookingAuthority: ACTIVE and Firebase-auth protected');
          NODE
          rm -f "$body"

      - uses: actions/upload-artifact@v4
        if: always() && contains(github.event.head_commit.message, '[deploy-appointment-charges]')
        with:
          name: appointment-charges-project-release
          path: ${{ runner.temp }}/appointment-charges-project-release.json
