    paths:
      - 'functions/bootstrap.js'
      - 'scripts/appointment-charges-project-*'
      - 'functions/projectCommercialGuard.js'
      - 'functions/appointmentCharges*'
      - 'functions/test-support/transactionalFirestore.js'
      - 'functions/servicePricingAuthority*'
      - 'apps/erp-next/**/appointment-charge*'
      - 'firebase.appointment-charges-test.json'
      - 'functions/officeBookingAuthority.js'
      - 'functions/officeBookingAuthorityFacade.js'
      - 'functions/officeBookingAuthorityPartialWrapper.js'
      - 'functions/officeBookingAuthorityFacadeProject.test.js'
      - 'functions/projectBookingLinks.js'
      - 'functions/projectOperatorBooking.test.js'
      - 'functions/appointmentCommunicationAuthority.js'
      - 'functions/appointmentCommunicationAuthority.test.js'
      - 'functions/appointmentCommunicationRenderer.js'
      - 'functions/appointmentCommunicationRenderer.test.js'
      - 'functions/vanScheduleCommunicationAuthority.js'
      - 'functions/vanScheduleCommunicationAuthority.test.js'
      - 'functions/technicianDailyScheduleService.js'
      - 'functions/technicianDailyScheduleService.test.js'
      - 'functions/whatsappTransactionalService.js'
      - 'functions/whatsappTransactionalGroupRecipient.test.js'
