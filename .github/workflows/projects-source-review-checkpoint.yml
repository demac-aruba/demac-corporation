name: Projects exact source review checkpoint
on:
  push:
    branches: ['feature/projects-canonical-integration']
    paths: ['.github/workflows/projects-source-review-checkpoint.yml']
permissions:
  contents: read
jobs:
  source-review:
    if: github.repository == 'demac-aruba/demac-corporation' && github.ref == 'refs/heads/feature/projects-canonical-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Export tracked code only for exact-commit local verification
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, zipfile, json
          paths = subprocess.check_output(['git', 'ls-files', '-z'], text=True).split('\0')
          roots = ('apps/erp-next/', 'functions/', 'docs/', '.github/workflows/')
          extras = {'AGENTS.md', 'firebase.projects-emulator.json', 'firestore.indexes.json', 'firebase.json'}
          extensions = {'.ts', '.tsx', '.js', '.cjs', '.mjs', '.css', '.json', '.md', '.yml', '.yaml', '.rules'}
          manifest = {}
          with zipfile.ZipFile('projects-exact-source.zip', 'w', zipfile.ZIP_DEFLATED) as out:
              for name in paths:
                  if not name: continue
                  path = pathlib.Path(name)
                  if not (name.startswith(roots) or name in extras): continue
                  if path.suffix not in extensions or any(part.startswith('.env') or part in {'node_modules', 'secrets', 'credentials'} for part in path.parts): continue
                  if path.is_symlink() or not path.is_file(): continue
                  out.write(path, name)
                  manifest[name] = subprocess.check_output(['git', 'hash-object', name], text=True).strip()
              out.writestr('SOURCE-MANIFEST.json', json.dumps({'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'blobs': manifest}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: projects-exact-source
          path: projects-exact-source.zip
          retention-days: 1
          if-no-files-found: error
