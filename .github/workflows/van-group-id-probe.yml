name: Van Group ID Probe

on:
  push:
    branches:
      - main
    paths:
      - 'functions/migrations/probeVanScheduleGroupIds.js'
      - '.github/workflows/van-group-id-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: van-group-id-probe-production
  cancel-in-progress: false

jobs:
  send-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install function dependencies
        run: npm install --prefix functions --no-audit --no-fund

      - name: Validate probe
        run: node --check functions/migrations/probeVanScheduleGroupIds.js

      - name: Authenticate Firebase production service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}

      - name: Send four WhatsApp group ID probe labels
        env:
          GCLOUD_PROJECT: demac-corporation
          GOOGLE_CLOUD_PROJECT: demac-corporation
          PROBE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: node functions/migrations/probeVanScheduleGroupIds.js
