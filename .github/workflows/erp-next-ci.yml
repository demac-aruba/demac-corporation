name: ERP Next CI

on:
  pull_request:
    paths:
      - 'apps/erp-next/**'
      - 'functions/whatsappWacliGateway.js'
      - 'services/whatsapp-bridge/**'
      - 'docs/ERP_NEXT_**'
      - '.github/workflows/erp-next-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/erp-next/**'
      - 'functions/whatsappWacliGateway.js'
      - 'services/whatsapp-bridge/**'
      - 'docs/ERP_NEXT_**'
      - '.github/workflows/erp-next-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/erp-next
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate WhatsApp bridge syntax
        working-directory: .
        run: node --check services/whatsapp-bridge/server.mjs
      - name: Validate WhatsApp Firebase gateway syntax
        working-directory: .
        run: node --check functions/whatsappWacliGateway.js
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Dispatch acceptance simulation
        run: npm run test:dispatch
      - name: Appointment lifecycle acceptance simulation
        run: npm run test:lifecycle
      - name: Booking intelligence acceptance simulation
        run: npm run test:booking-intelligence
      - name: Booking Copilot acceptance simulation
        run: npm run test:booking-copilot
      - name: Build
        run: npm run build
