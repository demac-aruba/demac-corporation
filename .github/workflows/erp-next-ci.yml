name: ERP Next CI

on:
  pull_request:
    paths:
      - 'apps/erp-next/**'
      - 'functions/bootstrap.js'
      - 'functions/index.js'
      - 'functions/fieldOperations*.js'
      - 'functions/bookingSchedulingPrimitives.js'
      - 'functions/bookingSchedulingPrimitives.test.js'
      - 'functions/bookingVanIdentity.js'
      - 'functions/bookingVanIdentity.test.js'
      - 'functions/package.json'
      - 'functions/employeeAttendanceCalculation.js'
      - 'functions/employeeAttendanceCalculation.d.ts'
      - 'functions/whatsappWacliGateway.js'
      - 'services/whatsapp-bridge/**'
      - 'docs/ERP_NEXT_**'
      - 'docs/ai/TECHNICIAN_PORTAL_**'
      - '.github/workflows/erp-next-ci.yml'
  push:
    branches:
      - main
      - feature/scheduling-booking-whatsapp-consolidation
    paths:
      - 'apps/erp-next/**'
      - 'functions/bootstrap.js'
      - 'functions/index.js'
      - 'functions/fieldOperations*.js'
      - 'functions/bookingSchedulingPrimitives.js'
      - 'functions/bookingSchedulingPrimitives.test.js'
      - 'functions/bookingVanIdentity.js'
      - 'functions/bookingVanIdentity.test.js'
      - 'functions/package.json'
      - 'functions/employeeAttendanceCalculation.js'
      - 'functions/employeeAttendanceCalculation.d.ts'
      - 'functions/whatsappWacliGateway.js'
      - 'services/whatsapp-bridge/**'
      - 'docs/ERP_NEXT_**'
      - 'docs/ai/TECHNICIAN_PORTAL_**'
      - '.github/workflows/erp-next-ci.yml'

permissions:
  contents: read

jobs:
  field-functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Functions Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install Functions
        run: npm install --no-audit --no-fund
      - name: Validate Firebase Functions syntax
        run: npm run validate:firebase
      - name: Field authority acceptance
        run: npm run test:field-authority
      - name: Booking and scheduling regression
        run: npm run test:booking-authority

  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/erp-next
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate WhatsApp bridge syntax
        working-directory: .
        run: node --check services/whatsapp-bridge/server.mjs
      - name: Validate WhatsApp Firebase gateway syntax
        working-directory: .
        run: node --check functions/whatsappWacliGateway.js
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Project phase planner acceptance
        run: >-
          node -e "require('fs').rmSync('.project-phase-planner-test',{recursive:true,force:true})"
          && npx tsc --ignoreConfig scripts/project-phase-planner-acceptance.ts
          --module commonjs --target ES2022 --moduleResolution node --ignoreDeprecations 6.0
          --esModuleInterop --skipLibCheck --types node
          --outDir .project-phase-planner-test --rootDir . --lib ES2022,DOM
          && node .project-phase-planner-test/scripts/project-phase-planner-acceptance.js
      - name: Projects browser autofill acceptance
        run: >-
          node -e "require('fs').rmSync('.projects-browser-autofill-test',{recursive:true,force:true})"
          && npx tsc --ignoreConfig scripts/projects-browser-autofill-acceptance.ts
          --module commonjs --target ES2022 --moduleResolution node --ignoreDeprecations 6.0
          --esModuleInterop --skipLibCheck --types node
          --outDir .projects-browser-autofill-test --rootDir . --lib ES2022,DOM
          && node .projects-browser-autofill-test/scripts/projects-browser-autofill-acceptance.js
      - name: Dispatch acceptance simulation
        run: npm run test:dispatch
      - name: Appointment lifecycle acceptance simulation
        run: npm run test:lifecycle
      - name: Booking intelligence acceptance simulation
        run: npm run test:booking-intelligence
      - name: Booking Copilot acceptance simulation
        run: npm run test:booking-copilot
      - name: Live scheduling acceptance simulation
        run: npm run test:live-scheduling
      - name: Employee schedule architecture acceptance
        run: npm run test:employee-schedule
      - name: Employee attendance Work Order authority acceptance
        run: npm run test:employee-attendance-work-orders
      - name: Field operations domain acceptance
        run: npm run test:field-domain
      - name: Field today-only admin simulator acceptance
        run: npm run test:field-simulator
      - name: Field simplified technician experience acceptance
        run: npm run test:field-experience
      - name: Field assignment security acceptance
        run: npm run test:field-security
      - name: Field offline cache, draft and outbox acceptance
        run: npm run test:field-offline
      - name: Build
        run: npm run build
