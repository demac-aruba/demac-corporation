name: ERP Next CI

on:
  pull_request:
    paths:
      - 'apps/erp-next/**'
      - 'functions/whatsappWacliGateway.js'
      - 'services/whatsapp-bridge/**'
      - 'docs/ERP_NEXT_**'
      - '.github/workflows/erp-next-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/erp-next/**'
      - 'functions/whatsappWacliGateway.js'
      - 'services/whatsapp-bridge/**'
      - 'docs/ERP_NEXT_**'
      - '.github/workflows/erp-next-ci.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/erp-next
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate WhatsApp bridge syntax
        working-directory: .
        run: node --check services/whatsapp-bridge/server.mjs
      - name: Validate WhatsApp Firebase gateway syntax
        working-directory: .
        run: node --check functions/whatsappWacliGateway.js
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Dispatch acceptance simulation
        run: npm run test:dispatch
      - name: Appointment lifecycle acceptance simulation
        run: npm run test:lifecycle
      - name: Booking intelligence acceptance simulation
        run: npm run test:booking-intelligence
      - name: Booking Copilot acceptance simulation
        run: npm run test:booking-copilot
      - name: Live scheduling acceptance simulation
        run: npm run test:live-scheduling
      - name: Build
        run: npm run build

  inventory-finalize:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/consolidated-inventory-authority'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout inventory feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/consolidated-inventory-authority
          fetch-depth: 0

      - name: Prepare exact finalization guards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/erp-next/lib/browser-demo-data.ts')
          text = path.read_text()
          replacements = [
              ("import { BROWSER_WORKORDER_MATERIALS_KEY, type BrowserWorkOrderMaterialPlan } from './browser-workorder-materials';\n", ''),
              ("function buildMaterialPlans(): BrowserWorkOrderMaterialPlan[] {\n  return jobSeeds\n    .filter((seed) => workOrderId(seed) !== releasedRiskId)\n    .map((seed) => ({ workOrderId: workOrderId(seed), mode: 'not_required', lines: [], updatedAt: isoAt('18:20', -24 * 60), updatedBy: 'Demo Operations' }));\n}\n\n", ''),
              ('    BROWSER_WORKORDER_MATERIALS_KEY,\n', ''),
              ('  const materialPlans = buildMaterialPlans();\n', ''),
              ('  writeRaw(BROWSER_WORKORDER_MATERIALS_KEY, materialPlans);\n', ''),
          ]
          for old, new in replacements:
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f'expected exactly one demo dependency match, found {text.count(old)}')
                  text = text.replace(old, new, 1)
          path.write_text(text)

          workflow = Path('.github/workflows/inventory-finalize.yml')
          finalizer = workflow.read_text()
          old_guard = """          if git grep -n -F 'BrowserInventoryTransfers' -- apps/erp-next | grep -v 'browser-inventory-transfers.tsx'; then
            echo '::error::Old BrowserInventoryTransfers component is still referenced.'
            exit 1
          fi
"""
          new_guard = """          if git grep -n -F '<BrowserInventoryTransfers' -- apps/erp-next/app apps/erp-next/components 2>/dev/null; then
            echo '::error::Old BrowserInventoryTransfers JSX is still referenced.'
            exit 1
          fi
          if git grep -n -F \"import { BrowserInventoryTransfers }\" -- apps/erp-next/app apps/erp-next/components apps/erp-next/lib 2>/dev/null; then
            echo '::error::Old BrowserInventoryTransfers import is still referenced.'
            exit 1
          fi
"""
          if old_guard in finalizer:
              if finalizer.count(old_guard) != 1:
                  raise SystemExit(f'transfer guard expected once, found {finalizer.count(old_guard)}')
              workflow.write_text(finalizer.replace(old_guard, new_guard, 1))
          elif new_guard not in finalizer:
              raise SystemExit('transfer component guard not found')
          PY

      - name: Execute guarded finalization plan
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          lines = Path('.github/workflows/inventory-finalize.yml').read_text().splitlines()
          blocks = []
          index = 0
          while index < len(lines):
              line = lines[index]
              if line.strip() != 'run: |':
                  index += 1
                  continue
              indent = len(line) - len(line.lstrip())
              index += 1
              body = []
              while index < len(lines):
                  candidate = lines[index]
                  candidate_indent = len(candidate) - len(candidate.lstrip()) if candidate.strip() else indent + 2
                  if candidate.strip() and candidate_indent <= indent:
                      break
                  body.append(candidate)
                  index += 1
              blocks.append(dedent('\n'.join(body)).rstrip())
          if len(blocks) != 4:
              raise SystemExit(f'Expected exactly 4 finalizer blocks, found {len(blocks)}')
          Path('/tmp/inventory-finalize.sh').write_text('\n\n'.join(blocks) + '\n')
          PY
          bash /tmp/inventory-finalize.sh
