name: Booking dwelling messages audited release
on:
  push:
    branches: [fix/booking-dwelling-messages, release/booking-dwelling-messages-20261012]
permissions:
  contents: read
jobs:
  configuration-diagnostic:
    if: github.ref == 'refs/heads/fix/booking-dwelling-messages'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: node scripts/booking-dwelling-config-inspect.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dwelling-config-inspection
          path: ${{ runner.temp }}/dwelling-config-inspection.json
  isolated-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - name: Syntax, message, lifecycle, references and release-safety gates
        run: |
          npm run validate:firebase --prefix functions
          npm run test:booking-authority --prefix functions
          npm run test:transactional-whatsapp --prefix functions
          node --test scripts/booking-dwelling-release.test.cjs scripts/booking-references-release-config.test.cjs scripts/booking-dwelling-scaling-proof.test.cjs
      - name: Isolated apartment create/read/edit/booking/persistence and message preparation
        env:
          GCLOUD_PROJECT: demo-demac-dwellings
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8297
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9297
          FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9397
        run: npx --yes firebase-tools@15.30.0 emulators:exec --only firestore --project demo-demac-dwellings --config firebase.dwellings-preview.json "node --test functions/propertyLocations.emulator.test.cjs"
  runtime-audit-or-release:
    needs: isolated-audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: field-operations-authority-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read-only baseline, candidate and recovery audit
        run: node scripts/booking-dwelling-release.cjs
      - uses: actions/upload-artifact@v4
        id: recovery
        with:
          name: dwelling-reviewed-recovery-and-candidate
          path: ${{ runner.temp }}/dwelling-release/packages
          retention-days: 90
          if-no-files-found: error
      - name: Owner-approved source and dependency release of merged code
        if: github.ref == 'refs/heads/release/booking-dwelling-messages-20261012'
        env:
          RECOVERY_ARTIFACT_ID: ${{ steps.recovery.outputs.artifact-id }}
        run: node scripts/booking-dwelling-release.cjs --deploy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dwelling-release-evidence
          path: |
            ${{ runner.temp }}/dwelling-release/summary.json
            ${{ runner.temp }}/dwelling-release-publish/summary.json
          if-no-files-found: error
