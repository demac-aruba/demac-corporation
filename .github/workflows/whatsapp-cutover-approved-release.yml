name: Owner-approved WhatsApp cutover 20261019
on:
  push:
    branches: [release/whatsapp-cutover-20261019]
permissions:
  contents: read
concurrency:
  group: whatsapp-owner-cutover-20261019
  cancel-in-progress: false
jobs:
  discard-old-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - name: Validate all release and recovery boundaries before production writes
        run: |
          node --check scripts/whatsapp-cutover-release.cjs
          node --test scripts/whatsapp-cutover-queue.test.cjs
          npm run validate:firebase --prefix functions
          npm run test:transactional-whatsapp --prefix functions
          node --test functions/bookingVisitReferences.test.js functions/bookingVisitReferencesHttp.test.js functions/whatsappReferenceBundle.test.js functions/whatsappWacliGateway.test.js functions/wacliOutboundMediaUpload.test.js
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Prepare existing restricted bridge health access
        env:
          DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -T 10 -H 159.223.160.239 >> "$HOME/.ssh/known_hosts"
      - name: Discard pre-authorization payloads then deploy only outbound poll
        run: node scripts/whatsapp-cutover-release.cjs --execute
      - name: Remove temporary SSH credential
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whatsapp-cutover-summary
          path: ${{ runner.temp }}/whatsapp-cutover-20261019/summary.json
