name: WhatsApp wacli Connector

on:
  pull_request:
    paths:
      - 'functions/whatsappWacliGateway.js'
      - 'functions/whatsappWacliGateway.test.js'
      - 'functions/wacliOutboundMediaUpload.js'
      - 'functions/wacliOutboundMediaUpload.test.js'
      - 'functions/bootstrap.js'
      - 'functions/package.json'
      - '.github/workflows/wacli-webhook-deploy.yml'
  push:
    branches:
      - main
    paths:
      - 'functions/whatsappWacliGateway.js'
      - 'functions/whatsappWacliGateway.test.js'
      - 'functions/wacliOutboundMediaUpload.js'
      - 'functions/wacliOutboundMediaUpload.test.js'
      - 'functions/bootstrap.js'
      - 'functions/package.json'
      - '.github/workflows/wacli-webhook-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wacli-connector-production
  cancel-in-progress: false

jobs:
  validate-wacli-connector:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install function dependencies
        run: npm install --prefix functions --no-audit --no-fund

      - name: Validate outbound-only and AI-first connector boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/whatsappWacliGateway.js
          node --check functions/wacliOutboundMediaUpload.js
          node --check functions/bootstrap.js
          node --test functions/whatsappWacliGateway.test.js functions/wacliOutboundMediaUpload.test.js
          if grep -Eqi 'ed25519|x-demac-bridge-signature|BRIDGE_PUBLIC_KEY|WACLI_BRIDGE_URL|bridgeEndpoint\(|sendQueuedWacliMessage' functions/whatsappWacliGateway.js; then
            echo '::error::Retired inbound-to-Droplet or custom-auth code remains in Firebase gateway.'
            exit 1
          fi
          if ! grep -q 'authorizedBridgeRequest(request)' functions/whatsappWacliGateway.js; then
            echo '::error::Standard Bearer bridge authentication is missing.'
            exit 1
          fi
          if ! grep -q 'authorizedOperationsUser(user.uid)' functions/wacliOutboundMediaUpload.js; then
            echo '::error::ERP media upload must enforce active operations-role authorization.'
            exit 1
          fi
          if grep -Eq 'WACLI_BRIDGE_TOKEN|WACLI_BRIDGE_URL|WACLI_WEBHOOK_SECRET' functions/wacliOutboundMediaUpload.js; then
            echo '::error::ERP media upload source must remain isolated from bridge secrets.'
            exit 1
          fi
          node - <<'NODE'
          const mod = require('./functions/bootstrap');
          for (const name of ['wacliWebhook', 'wacliMediaIngest', 'wacliOutboundPoll', 'wacliOutboundAck', 'wacliOutboundMediaUpload']) {
            if (typeof mod[name] !== 'function') throw new Error(`${name} export missing`);
          }
          if (typeof mod.sendQueuedWacliMessage === 'function') throw new Error('Legacy sendQueuedWacliMessage export must be retired');
          NODE

  deploy-wacli-connector:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-wacli-connector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect deployable function changes
        id: changes
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          deploy='false'
          if [ -z "${BEFORE_SHA:-}" ] || [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            deploy='true'
          else
            git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" > /tmp/changed-files.txt
            if grep -Eq '^functions/(whatsappWacliGateway\.js|whatsappWacliGateway\.test\.js|wacliOutboundMediaUpload\.js|bootstrap\.js|package\.json)$' /tmp/changed-files.txt; then
              deploy='true'
            fi
          fi
          echo "deploy=${deploy}" >> "$GITHUB_OUTPUT"
          echo "Function source deployment required: ${deploy}"

      - name: Authenticate Firebase deployment service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve DEMAC runtime identity
        if: steps.changes.outputs.deploy == 'true'
        id: config
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_FUNCTION='wacliWebhook'
          if ! gcloud functions describe "$SOURCE_FUNCTION" --project=demac-corporation --gen2 --region=us-central1 --format='value(name)' >/dev/null 2>&1; then
            SOURCE_FUNCTION='generateProfessionalCustomerReport'
          fi
          RUN_SA="$(gcloud functions describe "$SOURCE_FUNCTION" --project=demac-corporation --gen2 --region=us-central1 --format='value(serviceConfig.serviceAccountEmail)')"
          if [ -z "$RUN_SA" ]; then
            echo '::error::Could not resolve the DEMAC Cloud Functions runtime service account.'
            exit 1
          fi
          echo "run_service_account=${RUN_SA}" >> "$GITHUB_OUTPUT"

      - name: Deploy outbound connector and ERP media upload
        if: steps.changes.outputs.deploy == 'true'
        shell: bash
        env:
          RUN_SERVICE_ACCOUNT: ${{ steps.config.outputs.run_service_account }}
        run: |
          set -euo pipefail
          deploy_bridge_http() {
            local name="$1" memory="$2" timeout="$3"
            gcloud functions deploy "$name" \
              --project=demac-corporation \
              --gen2 \
              --region=us-central1 \
              --runtime=nodejs22 \
              --source=functions \
              --entry-point="$name" \
              --memory="$memory" \
              --timeout="$timeout" \
              --run-service-account="$RUN_SERVICE_ACCOUNT" \
              --set-env-vars='FIREBASE_CONFIG={"storageBucket":"demac-corporation.firebasestorage.app"}' \
              --set-secrets=WACLI_BRIDGE_TOKEN=WACLI_BRIDGE_TOKEN:latest \
              --trigger-http \
              --allow-unauthenticated \
              --quiet
          }

          deploy_bridge_http wacliMediaIngest 512Mi 120s
          deploy_bridge_http wacliOutboundPoll 256Mi 30s
          deploy_bridge_http wacliOutboundAck 256Mi 60s
          deploy_bridge_http wacliWebhook 256Mi 120s

          gcloud functions deploy wacliOutboundMediaUpload \
            --project=demac-corporation \
            --gen2 \
            --region=us-central1 \
            --runtime=nodejs22 \
            --source=functions \
            --entry-point=wacliOutboundMediaUpload \
            --memory=512Mi \
            --timeout=120s \
            --run-service-account="$RUN_SERVICE_ACCOUNT" \
            --set-env-vars='FIREBASE_CONFIG={"storageBucket":"demac-corporation.firebasestorage.app"}' \
            --trigger-http \
            --allow-unauthenticated \
            --quiet

      - name: Retire legacy Firebase-to-Droplet sender
        shell: bash
        run: |
          set -euo pipefail
          if gcloud functions describe sendQueuedWacliMessage --project=demac-corporation --gen2 --region=us-central1 --format='value(name)' >/dev/null 2>&1; then
            gcloud functions delete sendQueuedWacliMessage \
              --project=demac-corporation \
              --gen2 \
              --region=us-central1 \
              --quiet
          fi

      - name: Verify deployed outbound-only boundary
        shell: bash
        run: |
          set -euo pipefail
          probe_bridge_endpoint() {
            local name="$1"
            local endpoint="https://us-central1-demac-corporation.cloudfunctions.net/${name}"
            local body status state secrets
            state="$(gcloud functions describe "$name" --project=demac-corporation --gen2 --region=us-central1 --format='value(state)')"
            if [ "$state" != 'ACTIVE' ]; then
              echo "::error::${name} state is ${state:-unknown}."
              exit 1
            fi
            secrets="$(gcloud functions describe "$name" --project=demac-corporation --gen2 --region=us-central1 --format='value(serviceConfig.secretEnvironmentVariables[].key)' | tr ';' '\n' | sort -u)"
            if ! printf '%s\n' "$secrets" | grep -qx 'WACLI_BRIDGE_TOKEN'; then
              echo "::error::${name} is missing WACLI_BRIDGE_TOKEN."
              exit 1
            fi
            if printf '%s\n' "$secrets" | grep -Eq 'WACLI_BRIDGE_URL|WACLI_WEBHOOK_SECRET'; then
              echo "::error::${name} still carries a retired connector secret."
              exit 1
            fi
            body="$(mktemp)"
            status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
              --request POST "$endpoint" \
              --header 'Content-Type: application/json' \
              --header 'Authorization: Bearer invalid-ci-probe' \
              --data '{}')"
            if [ "$status" != '401' ]; then
              echo "::error::${name} returned HTTP ${status}; expected 401."
              cat "$body"
              rm -f "$body"
              exit 1
            fi
            python3 - "$body" "$name" <<'PY'
          import json, sys
          path, name = sys.argv[1:3]
          with open(path, encoding='utf-8') as handle:
              payload = json.load(handle)
          if payload != {'error': 'Unauthorized'}:
              raise SystemExit(f'{name} returned unexpected auth payload: {payload}')
          print(f'{name}: ACTIVE and Bearer-protected')
          PY
            rm -f "$body"
          }

          for name in wacliMediaIngest wacliOutboundPoll wacliOutboundAck wacliWebhook; do
            probe_bridge_endpoint "$name"
          done

          media_name='wacliOutboundMediaUpload'
          media_endpoint="https://us-central1-demac-corporation.cloudfunctions.net/${media_name}"
          media_state="$(gcloud functions describe "$media_name" --project=demac-corporation --gen2 --region=us-central1 --format='value(state)')"
          if [ "$media_state" != 'ACTIVE' ]; then
            echo "::error::${media_name} state is ${media_state:-unknown}."
            exit 1
          fi
          media_secrets="$(gcloud functions describe "$media_name" --project=demac-corporation --gen2 --region=us-central1 --format='value(serviceConfig.secretEnvironmentVariables[].key)' | tr ';' '\n' | sort -u)"
          if printf '%s\n' "$media_secrets" | grep -Eq 'WACLI_BRIDGE_TOKEN|WACLI_BRIDGE_URL|WACLI_WEBHOOK_SECRET'; then
            echo '::error::ERP media upload must not receive bridge secrets.'
            exit 1
          fi
          echo 'wacliOutboundMediaUpload: ACTIVE and isolated from bridge secrets'

          cors_headers="$(mktemp)"
          cors_status="$(curl --silent --show-error --output /dev/null --dump-header "$cors_headers" --write-out '%{http_code}' \
            --request OPTIONS "$media_endpoint" \
            --header 'Origin: https://demac-corporation.vercel.app' \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: authorization,content-type')"
          if [ "$cors_status" != '204' ]; then
            echo "::error::Media upload CORS preflight returned HTTP ${cors_status}; expected 204."
            cat "$cors_headers"
            rm -f "$cors_headers"
            exit 1
          fi
          if ! tr -d '\r' < "$cors_headers" | grep -Fqi 'access-control-allow-origin: https://demac-corporation.vercel.app'; then
            echo '::error::Media upload did not allow the production ERP Vercel origin.'
            cat "$cors_headers"
            rm -f "$cors_headers"
            exit 1
          fi
          rm -f "$cors_headers"
          echo 'wacliOutboundMediaUpload: production ERP CORS allowed'

          media_body="$(mktemp)"
          media_status="$(curl --silent --show-error --output "$media_body" --write-out '%{http_code}' \
            --request POST "$media_endpoint?fileName=probe.bin" \
            --header 'Content-Type: application/octet-stream' \
            --data-binary 'probe')"
          if [ "$media_status" != '401' ]; then
            echo "::error::${media_name} returned HTTP ${media_status}; expected 401 without a Firebase session."
            cat "$media_body"
            rm -f "$media_body"
            exit 1
          fi
          python3 - "$media_body" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as handle:
              payload = json.load(handle)
          if payload != {'error': 'Unauthorized'}:
              raise SystemExit(f'Unexpected media upload application-auth payload: {payload}')
          print('wacliOutboundMediaUpload: Firebase application authentication required')
          PY
          rm -f "$media_body"

          if gcloud functions describe sendQueuedWacliMessage --project=demac-corporation --gen2 --region=us-central1 --format='value(name)' >/dev/null 2>&1; then
            echo '::error::Legacy sendQueuedWacliMessage still exists after migration.'
            exit 1
          fi
          echo 'OUTBOUND_ONLY_FIREBASE_CONNECTOR_READY'
          echo 'OUTBOUND_MEDIA_UPLOAD_READY'
