name: Projects registry isolated integration
on:
  pull_request:
    paths:
      - 'functions/projects/**'
      - 'functions/fieldOperationsAuthorityWorkVisit.js'
      - 'functions/fieldOperationsOfficeReview.js'
      - 'firebase.projects-emulator.json'
      - '.github/workflows/projects-registry-ci.yml'
  push:
    branches: ['feature/projects-canonical-integration']
    paths:
      - 'functions/projects/**'
      - 'firebase.projects-emulator.json'
      - '.github/workflows/projects-registry-ci.yml'
permissions:
  contents: read
concurrency:
  group: projects-registry-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scoped-review-source:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Archive only versioned Projects code for reproducible review
        run: >-
          git archive --format=zip --output="$RUNNER_TEMP/projects-review-source.zip" HEAD
          AGENTS.md docs/ai functions/projects
          apps/erp-next/lib/browser-projects.ts apps/erp-next/lib/project-phase-planner.ts
          apps/erp-next/lib/project-record-sanitizer.ts
          apps/erp-next/components/projects/projects-phase-workspace-v2.tsx
          apps/erp-next/components/projects/projects-recovery.tsx
          functions/fieldOperationsAuthorityWorkVisit.js functions/fieldOperationsOfficeReview.js
          functions/package.json functions/package-lock.json
          .github/workflows/projects-registry-ci.yml firebase.projects-emulator.json
      - uses: actions/upload-artifact@v4
        with:
          name: projects-review-source
          path: ${{ runner.temp }}/projects-review-source.zip
          retention-days: 3
          if-no-files-found: error
  isolated-auth-firestore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GCLOUD_PROJECT: demo-demac-projects
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated dependencies without production credentials
        run: |
          npm install --prefix functions --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/projects-tools" --no-audit --no-fund firebase-tools@15.30.0
      - name: Domain and recovery contracts
        run: |
          node --check functions/projects/registry-service.js
          node --check functions/projects/registry-activity.js
          node --test functions/projects/*.test.js
      - name: Real Auth and Firestore; atomicity, contention, permissions and read-only activity
        run: >-
          "$RUNNER_TEMP/projects-tools/node_modules/.bin/firebase" emulators:exec
          --project demo-demac-projects --config firebase.projects-emulator.json --only firestore,auth
          'node --test functions/projects/registry.emulator.cjs'
