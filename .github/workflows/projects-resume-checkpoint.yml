name: Projects isolated resume checkpoint
on:
  push:
    branches: ['feature/projects-canonical-integration']
    paths: ['.github/workflows/projects-resume-checkpoint.yml']
permissions:
  contents: read
jobs:
  browser-engine-differential:
    if: github.repository == 'demac-aruba/demac-corporation' && github.ref == 'refs/heads/feature/projects-canonical-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        playwright: ['1.57.0', '1.63.0']
    env:
      GCLOUD_PROJECT: demo-demac-projects
      NEXT_PUBLIC_PROJECTS_REGISTRY_ENABLED: 'true'
      NEXT_PUBLIC_PROJECTS_LEGACY_IMPORT_ENABLED: 'false'
      NEXT_PUBLIC_PERFORMANCE_TELEMETRY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: echo "PROJECTS_UI_TOOLS=$RUNNER_TEMP/projects-ui-tools" >> "$GITHUB_ENV"
      - name: Install isolated pinned browser engines
        env:
          PW_VERSION: ${{ matrix.playwright }}
        run: |
          npm install --prefix functions --no-audit --no-fund
          npm install --prefix apps/erp-next --no-audit --no-fund
          npm install --prefix "$PROJECTS_UI_TOOLS" --no-audit --no-fund firebase-tools@15.30.0 "playwright@$PW_VERSION"
          "$PROJECTS_UI_TOOLS/node_modules/.bin/playwright" install --with-deps chromium webkit
      - run: npm run build --prefix apps/erp-next
      - name: Same source, same assertions, eight fresh emulator runs
        run: |
          mkdir -p projects-engine-evidence
          test "$(git hash-object apps/erp-next/scripts/projects-central-browser.cjs)" = bf14414d8a9f226235f6e8373553cd93da015b61
          node -e 'const p=require(process.env.PROJECTS_UI_TOOLS+"/node_modules/playwright/package.json");console.log(p.version)' > projects-engine-evidence/engine-version.txt
          failed=0
          for attempt in 1 2 3 4 5 6 7 8; do
            rm -rf projects-central-ui-evidence
            set +e
            "$PROJECTS_UI_TOOLS/node_modules/.bin/firebase" emulators:exec --project demo-demac-projects --config firebase.projects-emulator.json --only firestore,auth 'node apps/erp-next/scripts/projects-central-browser.cjs' > "projects-engine-evidence/run-$attempt.log" 2>&1
            result=$?
            set -e
            echo "$result" > "projects-engine-evidence/run-$attempt.exit"
            cp -r projects-central-ui-evidence "projects-engine-evidence/run-$attempt"
            if [ "$result" != 0 ]; then failed=1; tail -45 "projects-engine-evidence/run-$attempt.log"; fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: projects-browser-engine-${{ matrix.playwright }}
          path: projects-engine-evidence/
          retention-days: 3
          if-no-files-found: error
