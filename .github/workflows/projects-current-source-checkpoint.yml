name: Projects reviewed source checkpoint
on:
  push:
    branches: ['feature/projects-canonical-integration']
    paths: ['.github/workflows/projects-current-source-checkpoint.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fd691230a3c464576e8dd51c90a23621dc01dcdc
          persist-credentials: false
      - name: Archive exact tracked source only; no dependencies or production access
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess,zipfile
          entries=subprocess.check_output(['git','ls-files','-z'],text=True).split('\0')
          manifest={}
          with zipfile.ZipFile('projects-current-source.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for name in entries:
                  if not name: continue
                  p=pathlib.Path(name)
                  if not (name.startswith(('functions/','apps/erp-next/','docs/ai/','.github/workflows/')) or name in ['AGENTS.md','firebase.projects-emulator.json']): continue
                  if p.suffix not in {'.md','.js','.cjs','.mjs','.ts','.tsx','.json','.css','.yml','.yaml'}: continue
                  if p.is_symlink() or not p.is_file() or any(part.startswith('.env') or part in ['node_modules','secrets','credentials'] for part in p.parts): continue
                  archive.write(p,name)
                  manifest[name]=subprocess.check_output(['git','hash-object',name],text=True).strip()
              archive.writestr('SOURCE-MANIFEST.json',json.dumps({'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'blobs':manifest}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: projects-reviewed-source-fd69123
          path: projects-current-source.zip
          retention-days: 1
