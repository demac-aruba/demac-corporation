name: Build DEMAC Copilot Extension

on:
  pull_request:
    paths:
      - "extensions/demac-whatsapp-ai-copilot/**"
      - ".github/workflows/build-copilot-extension.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-extension:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate JavaScript
        working-directory: extensions/demac-whatsapp-ai-copilot
        run: |
          node --check background.js
          node --check composer-linebreaks.js
          node --check content.js
          node --check sidepanel.js
          node --check appointment-guard.js
          node --check options.js

      - name: Build ZIP
        run: |
          mkdir -p build/DEMAC-WhatsApp-AI-Copilot-v0.4.2
          cp -R extensions/demac-whatsapp-ai-copilot/. build/DEMAC-WhatsApp-AI-Copilot-v0.4.2/
          cd build
          zip -r DEMAC-WhatsApp-AI-Copilot-v0.4.2.zip DEMAC-WhatsApp-AI-Copilot-v0.4.2

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: DEMAC-WhatsApp-AI-Copilot-v0.4.2
          path: build/DEMAC-WhatsApp-AI-Copilot-v0.4.2.zip
          if-no-files-found: error
          retention-days: 30
