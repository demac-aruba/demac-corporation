name: Build DEMAC Copilot Extension

on:
  pull_request:
    paths:
      - "extensions/demac-whatsapp-ai-copilot/**"
      - "functions/whatsappCopilotKnowledge.js"
      - "functions/whatsappCopilotRouter.js"
      - "functions/whatsappCopilotCompanyRules.js"
      - "functions/whatsappCopilotCompanyRules.test.js"
      - "functions/whatsappCopilotConversationPolicy.js"
      - "functions/whatsappCopilotConversationPolicy.test.js"
      - "functions/whatsappCopilotFlowV19.js"
      - "functions/whatsappCopilotFlowV19.test.js"
      - "functions/whatsappCopilotFlowV20.js"
      - "functions/whatsappCopilotFlowV20.test.js"
      - "functions/whatsappCopilotSessionContextV20.js"
      - "functions/whatsappCopilotSessionContextV20.test.js"
      - "functions/whatsappCopilotRuntimeV20.js"
      - "functions/whatsappCopilotStateMachineV21.js"
      - "functions/whatsappCopilotStateMachineV21.test.js"
      - "functions/whatsappCopilotStateMachineV22.js"
      - "functions/whatsappCopilotStateMachineV22.test.js"
      - "functions/whatsappCopilotSchedulingRuntimeV19.js"
      - "functions/whatsappCopilotRouterExports.test.js"
      - "functions/demacServicePricingRules.js"
      - "functions/demacServicePricingRules.test.js"
      - "functions/whatsappCopilotServiceRules.js"
      - "functions/whatsappCopilotScheduling.js"
      - "functions/whatsappCopilot.js"
      - "functions/bootstrap.js"
      - "functions/package.json"
      - "src/screens/WhatsAppKnowledgeScreen.tsx"
      - "src/screens/CompanyRulesScreen.tsx"
      - "src/screens/SettingsHubScreen.tsx"
      - "scripts/patchWhatsappKnowledgeSettingsV13.cjs"
      - "scripts/patchCompanyRulesV14.cjs"
      - "docs/DEMAC-company-rules-v1.md"
      - "package.json"
      - ".github/workflows/build-copilot-extension.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-extension:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply ERP patch chain
        run: npm run patch:all

      - name: Validate extension JavaScript
        working-directory: extensions/demac-whatsapp-ai-copilot
        run: |
          node --check background.js
          node --check conversation-memory.mjs
          node --check content.js
          node --check composer-controller.js
          node --check sidepanel.js
          node --check auto-test-panel.js
          node --check appointment-guard.js
          node --check options.js
          node --test conversation-memory.test.mjs

      - name: Validate unified ERP routing
        working-directory: functions
        run: |
          npm install --ignore-scripts
          npm run test:whatsapp-copilot
          node --check whatsappCopilotKnowledge.js
          node --check whatsappCopilotRouter.js
          node --check whatsappCopilotCompanyRules.js
          node --check whatsappCopilotConversationPolicy.js
          node --check whatsappCopilotFlowV19.js
          node --check whatsappCopilotFlowV20.js
          node --check whatsappCopilotSessionContextV20.js
          node --check whatsappCopilotRuntimeV20.js
          node --check whatsappCopilotStateMachineV21.js
          node --check whatsappCopilotStateMachineV22.js
          node --check whatsappCopilotSchedulingRuntimeV19.js
          node --check demacServicePricingRules.js
          node --check whatsappCopilotServiceRules.js
          node --check whatsappCopilotScheduling.js
          node --check whatsappCopilot.js
          node --check bootstrap.js

      - name: Verify V18 public runtime with V22 appointment state
        run: |
          grep -q 'openai+erp-conversation-orchestrator-v18-flow-v22' functions/whatsappCopilotRouter.js
          grep -q 'flowVersion: 22' functions/whatsappCopilotRouter.js
          grep -q 'whatsappCopilotStateMachineV22' functions/whatsappCopilotRouter.js
          grep -q 'whatsappCopilotDraft: router.whatsappCopilotDraft' functions/bootstrap.js
          grep -q '"version": "0.5.0"' extensions/demac-whatsapp-ai-copilot/manifest.json
          if grep -q 'runAutoReply' extensions/demac-whatsapp-ai-copilot/background.js; then
            echo "Legacy background auto-reply engine is still present" >&2
            exit 1
          fi

      - name: Build ZIP
        run: |
          mkdir -p build/DEMAC-WhatsApp-AI-Copilot-v0.5.0
          cp -R extensions/demac-whatsapp-ai-copilot/. build/DEMAC-WhatsApp-AI-Copilot-v0.5.0/
          cd build
          zip -r DEMAC-WhatsApp-AI-Copilot-v0.5.0.zip DEMAC-WhatsApp-AI-Copilot-v0.5.0

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: DEMAC-WhatsApp-AI-Copilot-v0.5.0
          path: build/DEMAC-WhatsApp-AI-Copilot-v0.5.0.zip
          if-no-files-found: error
          retention-days: 30
