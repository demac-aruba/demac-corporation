name: Website editor isolated source review
on:
  pull_request:
    paths:
      - '.github/workflows/website-editor-review-snapshot.yml'
permissions:
  contents: read
jobs:
  source-review:
    if: github.event.pull_request.number == 513
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export tracked review inputs, never credentials or live data
        env:
          REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
          REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import io, os, pathlib, re, subprocess, tarfile
          os.makedirs('/tmp/editor-review-inputs', exist_ok=True)
          prefixes = ('apps/erp-next/', 'functions/', 'src/', 'scripts/', 'docs/ai/', '.github/workflows/')
          roots = {'AGENTS.md', 'package.json', 'package-lock.json', 'tsconfig.json', 'firebase.json', 'firestore.rules', 'storage.rules', 'vercel.json', 'website-editor.emulator.json'}
          extensions = {'.ts', '.tsx', '.js', '.jsx', '.mjs', '.cjs', '.json', '.css', '.md', '.yml', '.yaml', '.rules', '.patch'}
          for label, ref in [('base', os.environ['REVIEW_BASE']), ('head', os.environ['REVIEW_HEAD'])]:
              if not re.fullmatch('[0-9a-f]{40}', ref): raise ValueError('Unexpected review ref')
              files = subprocess.check_output(['git', 'ls-tree', '-r', '--name-only', ref]).decode().splitlines()
              with tarfile.open('/tmp/editor-review-inputs/' + label + '.tar.gz', 'w:gz') as archive:
                  for name in files:
                      if not (name in roots or name.startswith(prefixes)): continue
                      if any(part.startswith('.env') for part in name.split('/')): continue
                      if any(term in name.lower() for term in ['credential', 'service-account', 'serviceaccount', 'private-key']): continue
                      source = pathlib.PurePosixPath(name)
                      public_image = name.startswith('apps/erp-next/public/') and source.suffix in {'.png', '.jpg', '.jpeg', '.webp', '.svg'}
                      if source.suffix not in extensions and not public_image: continue
                      data = subprocess.check_output(['git', 'show', ref + ':' + name])
                      info = tarfile.TarInfo(name); info.size = len(data); archive.addfile(info, io.BytesIO(data))
          pathlib.Path('/tmp/editor-review-inputs/refs.txt').write_text(os.environ['REVIEW_BASE'] + '\n' + os.environ['REVIEW_HEAD'] + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: website-editor-source-review
          path: /tmp/editor-review-inputs/
          retention-days: 2
