name: Restore original booking reference scaling only
on:
  push:
    branches: [recovery/booking-dwelling-scaling-20261012]
permissions:
  contents: read
concurrency:
  group: field-operations-authority-production
  cancel-in-progress: false
jobs:
  restore-original-configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node --test scripts/booking-dwelling-release.test.cjs scripts/booking-references-release-config.test.cjs scripts/booking-dwelling-scaling-recovery.test.cjs
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: node scripts/booking-dwelling-scaling-recovery.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dwelling-scaling-recovery
          path: ${{ runner.temp }}/dwelling-scaling-recovery.json
