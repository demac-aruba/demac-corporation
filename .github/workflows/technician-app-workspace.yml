name: Technician App workspace

on:
  pull_request:
    paths:
      - '.github/workflows/technician-app-workspace.yml'

permissions:
  contents: read

concurrency:
  group: technician-app-workspace-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  source-and-test-tools:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/technician-app-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Capture tracked source only (never Git credentials or environment files)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/field-workspace"
          python3 - <<'PY'
          import pathlib, re, subprocess
          names = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          for name in filter(None, names):
              path = pathlib.Path(name)
              if path.name.startswith('.env') and not path.name.endswith(('.example', '.sample', '.template')):
                  raise SystemExit('Refusing to package tracked environment configuration')
              if path.is_file() and path.stat().st_size < 2_000_000:
                  text = path.read_bytes()
                  if re.search(rb'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----', text):
                      raise SystemExit('Refusing to package private key material')
          PY
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/field-workspace/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/field-workspace/COMMIT.txt"
      - name: Install narrowly scoped browser test tooling without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/field-tools" --ignore-scripts --no-audit --no-fund react@19.2.7 react-dom@19.2.7 esbuild@0.25.9 playwright@1.57.0 @types/react@19.2.0 @types/react-dom@19.2.0 csstype@3.1.3
          tar -czf "$RUNNER_TEMP/field-workspace/test-tools.tar.gz" -C "$RUNNER_TEMP/field-tools" node_modules
          cd "$RUNNER_TEMP/field-workspace"
          sha256sum source.tar.gz test-tools.tar.gz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: technician-app-workspace-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/field-workspace/
          retention-days: 3
          if-no-files-found: error
