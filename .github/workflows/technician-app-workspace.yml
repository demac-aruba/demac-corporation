name: Technician App workspace
on:
  pull_request:
    paths: ['.github/workflows/technician-app-workspace.yml']
permissions:
  contents: read
concurrency:
  group: technician-workspace-526
  cancel-in-progress: true
jobs:
  source-and-test-tools:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/technician-app-20260923' && github.event.pull_request.number == 526
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Capture tracked source without credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/field-workspace"
          python3 - <<'PY'
          import pathlib,re,subprocess
          for name in filter(None,subprocess.check_output(['git','ls-files','-z']).decode().split('\0')):
              p=pathlib.Path(name)
              if p.name.startswith('.env') and not p.name.endswith(('.example','.sample','.template')): raise SystemExit('Tracked environment configuration rejected')
              if p.is_file() and p.stat().st_size < 2000000 and re.search(rb'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----',p.read_bytes()): raise SystemExit('Private key material rejected')
          PY
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/field-workspace/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/field-workspace/COMMIT.txt"
      - name: Install isolated local validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/field-tools" --ignore-scripts --no-audit --no-fund react@19.2.7 react-dom@19.2.7 esbuild@0.25.9 playwright@1.57.0 @types/react@19.2.0 @types/react-dom@19.2.0 csstype@3.1.3 firebase-admin@13.4.0 firebase-functions@6.4.0
          tar -czf "$RUNNER_TEMP/field-workspace/test-tools.tar.gz" -C "$RUNNER_TEMP/field-tools" node_modules
          cd "$RUNNER_TEMP/field-workspace"
          sha256sum source.tar.gz test-tools.tar.gz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: technician-app-workspace-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/field-workspace/
          retention-days: 3
          if-no-files-found: error
