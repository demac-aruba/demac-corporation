name: Projects source checkpoint
on:
  push:
    branches: ['feature/projects-canonical-integration']
    paths: ['.github/workflows/projects-source-checkpoint.yml']
permissions:
  contents: read
jobs:
  source-review:
    if: github.repository == 'demac-aruba/demac-corporation' && github.ref == 'refs/heads/feature/projects-canonical-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Capture tracked code only; no credentials or operational data
        run: |
          python3 - <<'PY'
          import subprocess, zipfile, pathlib
          paths=subprocess.check_output(['git','ls-files','-z'],text=True).split('\0')
          roots=('apps/erp-next/','functions/','docs/ai/','.github/workflows/')
          extensions={'.ts','.tsx','.js','.cjs','.mjs','.css','.json','.md','.yml','.yaml'}
          with zipfile.ZipFile('projects-source-checkpoint.zip','w',zipfile.ZIP_DEFLATED) as out:
              for name in paths:
                  if not name: continue
                  p=pathlib.Path(name)
                  if not (name.startswith(roots) or name in ['AGENTS.md','firebase.projects-emulator.json']): continue
                  if p.suffix not in extensions or any(part.startswith('.env') or part in ['node_modules','secrets','credentials'] for part in p.parts): continue
                  if p.is_symlink() or not p.is_file(): continue
                  out.write(p,name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: projects-source-checkpoint
          path: projects-source-checkpoint.zip
          retention-days: 1
