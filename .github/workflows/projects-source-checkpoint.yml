name: Projects isolated drawer source preparation
on:
  push:
    branches: ['feature/projects-canonical-integration']
    paths:
      - '.github/workflows/projects-source-checkpoint.yml'
      - 'scripts/dev/projects-drawer-source-edit.py'
permissions:
  contents: write
concurrency:
  group: projects-isolated-drawer-source-preparation
  cancel-in-progress: false
jobs:
  verify-proposed-source:
    if: github.repository == 'demac-aruba/demac-corporation' && github.ref == 'refs/heads/feature/projects-canonical-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Apply exact-source edits in the isolated workspace
        run: python3 scripts/dev/projects-drawer-source-edit.py
      - name: Install ERP dependencies without production credentials
        run: npm install --prefix apps/erp-next --no-audit --no-fund
      - name: Validate actual edited code and failure-recovery contracts
        run: |
          npm run typecheck --prefix apps/erp-next
          node --test apps/erp-next/scripts/projects-booking-recovery.test.cjs
          git diff --check
      - name: Build ERP with existing prebuild gates intact
        run: npm run build --prefix apps/erp-next
      - name: Create proposed Git objects only; do not update any ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          repo = 'demac-aruba/demac-corporation'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          assert os.environ['GITHUB_REF'] == 'refs/heads/feature/projects-canonical-integration'
          head = os.environ['GITHUB_SHA']
          def api(path, body=None):
              request = urllib.request.Request('https://api.github.com/repos/' + repo + path,
                  data=None if body is None else json.dumps(body).encode(),
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},
                  method='GET' if body is None else 'POST')
              with urllib.request.urlopen(request, timeout=60) as response: return json.load(response)
          assert api('/git/ref/heads/feature/projects-canonical-integration')['object']['sha'] == head, 'Branch advanced; do not propose stale source.'
          base_tree = api('/git/commits/'+head)['tree']['sha']
          paths = [
              'apps/erp-next/components/scheduling/live-appointment-create-drawer.tsx',
              'apps/erp-next/components/scheduling/live-scheduling-overview.tsx',
              'apps/erp-next/lib/office-booking-authority.ts',
          ]
          entries = []
          for path in paths:
              blob=api('/git/blobs',{'content':Path(path).read_text(),'encoding':'utf-8'})
              entries.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
          for path in ['scripts/dev/projects-drawer-source-edit.py','.github/workflows/projects-source-checkpoint.yml']:
              entries.append({'path':path,'mode':'100644','type':'blob','sha':None})
          tree=api('/git/trees',{'base_tree':base_tree,'tree':entries})
          commit=api('/git/commits',{'message':'feat(projects): wire existing Scheduling drawer to atomic central booking\n\nDefault-off central selection, complete multi-Van receipt verification and exact pending recovery. Preserve legacy/ordinary flows, availability and original estimates. Remove one-use source preparation. No production activation, data migration or main merge.', 'tree':tree['sha'],'parents':[head]})
          print('PROPOSED_COMMIT='+commit['sha'])
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('Proposed commit: `'+commit['sha']+'`\n\nNo branch/ref was moved. Connector review and explicit feature-branch update are required. Main and production unchanged.\n')
          PY
