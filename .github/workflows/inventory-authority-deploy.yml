name: Inventory Authority

on:
  pull_request:
    paths:
      - 'functions/inventoryAuthority.js'
      - 'functions/inventoryAuthority.test.js'
      - 'functions/index.js'
      - '.github/workflows/inventory-authority-deploy.yml'
  push:
    branches:
      - main
    paths:
      - 'functions/inventoryAuthority.js'
      - 'functions/inventoryAuthority.test.js'
      - 'functions/index.js'
      - '.github/workflows/inventory-authority-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inventory-authority-production
  cancel-in-progress: false

jobs:
  validate-inventory-authority:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install function dependencies
        run: npm install --prefix functions --no-audit --no-fund

      - name: Validate consolidated inventory boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/index.js
          node --check functions/inventoryAuthority.js
          node --test functions/inventoryAuthority.test.js
          node - <<'NODE'
          const mod = require('./functions/index');
          if (typeof mod.inventoryAuthority !== 'function') {
            throw new Error('inventoryAuthority export missing from functions/index.js');
          }
          NODE

  deploy-inventory-authority:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-inventory-authority
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate Firebase deployment service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve DEMAC runtime identity
        id: config
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_FUNCTION='generateProfessionalCustomerReport'
          if ! gcloud functions describe "$SOURCE_FUNCTION" --project=demac-corporation --gen2 --region=us-central1 --format='value(name)' >/dev/null 2>&1; then
            SOURCE_FUNCTION='wacliWebhook'
          fi
          RUN_SA="$(gcloud functions describe "$SOURCE_FUNCTION" --project=demac-corporation --gen2 --region=us-central1 --format='value(serviceConfig.serviceAccountEmail)')"
          if [ -z "$RUN_SA" ]; then
            echo '::error::Could not resolve the DEMAC Cloud Functions runtime service account.'
            exit 1
          fi
          echo "run_service_account=${RUN_SA}" >> "$GITHUB_OUTPUT"

      - name: Deploy Inventory Authority only
        shell: bash
        env:
          RUN_SERVICE_ACCOUNT: ${{ steps.config.outputs.run_service_account }}
        run: |
          set -euo pipefail
          gcloud functions deploy inventoryAuthority \
            --project=demac-corporation \
            --gen2 \
            --region=us-central1 \
            --runtime=nodejs22 \
            --source=functions \
            --entry-point=inventoryAuthority \
            --memory=256Mi \
            --timeout=60s \
            --run-service-account="$RUN_SERVICE_ACCOUNT" \
            --trigger-http \
            --allow-unauthenticated \
            --quiet

      - name: Verify deployed Inventory Authority
        shell: bash
        run: |
          set -euo pipefail
          name='inventoryAuthority'
          endpoint="https://us-central1-demac-corporation.cloudfunctions.net/${name}"
          state="$(gcloud functions describe "$name" --project=demac-corporation --gen2 --region=us-central1 --format='value(state)')"
          if [ "$state" != 'ACTIVE' ]; then
            echo "::error::${name} state is ${state:-unknown}."
            exit 1
          fi

          cors_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request OPTIONS "$endpoint" \
            --header 'Origin: https://demac-corporation.vercel.app' \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: authorization,content-type')"
          if [ "$cors_status" != '204' ]; then
            echo "::error::Inventory Authority CORS preflight returned HTTP ${cors_status}; expected 204."
            exit 1
          fi

          body="$(mktemp)"
          status="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
            --request POST "$endpoint" \
            --header 'Content-Type: application/json' \
            --data '{"action":"get_snapshot","data":{}}')"
          if [ "$status" != '401' ]; then
            echo "::error::${name} returned HTTP ${status}; expected 401 without Firebase authentication."
            cat "$body"
            rm -f "$body"
            exit 1
          fi
          node - "$body" <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (payload?.error?.code !== 'unauthenticated') {
            throw new Error(`Unexpected unauthenticated payload: ${JSON.stringify(payload)}`);
          }
          console.log('inventoryAuthority: ACTIVE and Firebase-auth protected');
          NODE
          rm -f "$body"
