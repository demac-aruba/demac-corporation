name: Marketing Creative V2 Production Smoke Long

on:
  push:
    branches:
      - test/marketing-creative-v2-production-smoke
    paths:
      - 'functions/marketingCreativeV2ProductionSmoke.js'
      - '.github/workflows/marketing-creative-v2-production-smoke-long.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  creative-v2-smoke-long:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --prefix functions --no-audit --no-fund
      - name: Run robust authenticated V2 production smoke
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}
          FIREBASE_WEB_API_KEY: AIzaSyCo31zuo6d8RsgiLWGqUVOvRmHkisoF1DE
          CREATIVE_URL: https://us-central1-demac-corporation.cloudfunctions.net/requestMarketingCreativeBuild
          READ_URL: https://us-central1-demac-corporation.cloudfunctions.net/getMarketingCreativeState
        run: node functions/marketingCreativeV2ProductionSmoke.js
