name: Deploy Firebase Rules

on:
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-rules-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-firebase-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Deploy Firestore and Storage rules to demac-corporation
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail

          if [ -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            CREDENTIAL_FILE="$RUNNER_TEMP/firebase-service-account.json"
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$CREDENTIAL_FILE"
            chmod 600 "$CREDENTIAL_FILE"
            export GOOGLE_APPLICATION_CREDENTIALS="$CREDENTIAL_FILE"
            npx --yes firebase-tools@15.2.1 deploy --only firestore:rules,storage --project demac-corporation --non-interactive
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            npx --yes firebase-tools@15.2.1 deploy --only firestore:rules,storage --project demac-corporation --non-interactive --token "$FIREBASE_TOKEN"
          else
            echo "::error title=Firebase deployment credential missing::Add FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION (preferred) or FIREBASE_TOKEN as a GitHub Actions repository secret. No Firebase rules were changed."
            exit 1
          fi
