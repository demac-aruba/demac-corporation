name: Marketing V1B Runtime Diagnostics

on:
  push:
    branches:
      - agent/marketing-function-gcloud-deploy
    paths:
      - '.github/workflows/marketing-v1b-runtime-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate Firebase deployment service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Compare working and Marketing Firestore triggers
        shell: bash
        run: |
          set -euo pipefail
          echo '--- MARKETING FUNCTION ---'
          gcloud functions describe analyzeMarketingUploadSession --project=demac-corporation --gen2 --region=us-central1 \
            --format='yaml(name,state,serviceConfig.serviceAccountEmail,eventTrigger.trigger,eventTrigger.triggerRegion,eventTrigger.eventType,eventTrigger.eventFilters,eventTrigger.serviceAccountEmail)'
          echo '--- WORKING PROFESSIONAL REPORT FUNCTION ---'
          gcloud functions describe generateProfessionalCustomerReport --project=demac-corporation --gen2 --region=us-central1 \
            --format='yaml(name,state,serviceConfig.serviceAccountEmail,eventTrigger.trigger,eventTrigger.triggerRegion,eventTrigger.eventType,eventTrigger.eventFilters,eventTrigger.serviceAccountEmail)'
          echo '--- EVENTARC TRIGGERS ---'
          gcloud eventarc triggers list --project=demac-corporation --location=nam5 \
            --format='table(name,eventFilters.type,eventFilters.database,eventFilters.document,serviceAccount,destination.cloudRunService.service)' || true
