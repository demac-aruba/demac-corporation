name: Marketing V1B Runtime Diagnostics

on:
  push:
    branches:
      - agent/marketing-function-gcloud-deploy
    paths:
      - '.github/workflows/marketing-v1b-runtime-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate Firebase deployment service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Describe deployed function and recent logs
        shell: bash
        run: |
          set -euo pipefail
          echo '--- FUNCTION ---'
          gcloud functions describe analyzeMarketingUploadSession --project=demac-corporation --gen2 --region=us-central1 \
            --format='yaml(name,state,serviceConfig.uri,eventTrigger.eventType,eventTrigger.eventFilters,eventTrigger.triggerRegion)'
          echo '--- CLOUD RUN LOGS ---'
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.service_name="analyzemarketinguploadsession"' \
            --project=demac-corporation --freshness=15m --limit=80 \
            --format='value(timestamp,severity,textPayload,jsonPayload.message)' || true
          echo '--- CLOUD FUNCTION LOGS ---'
          gcloud logging read \
            'resource.type="cloud_function" AND resource.labels.function_name="analyzeMarketingUploadSession"' \
            --project=demac-corporation --freshness=15m --limit=80 \
            --format='value(timestamp,severity,textPayload,jsonPayload.message)' || true
