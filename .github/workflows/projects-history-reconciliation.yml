name: Projects historical reconciliation
on:
  pull_request:
    paths:
      - 'functions/projects/**'
      - 'apps/erp-next/components/projects/central/**'
      - 'apps/erp-next/lib/projects/**'
      - 'apps/erp-next/scripts/projects-history-browser.cjs'
      - '.github/workflows/projects-history-reconciliation.yml'
permissions:
  contents: read
concurrency:
  group: projects-history-${{ github.ref }}
  cancel-in-progress: true
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GCLOUD_PROJECT: demo-demac-projects
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: echo "PROJECTS_UI_TOOLS=$RUNNER_TEMP/projects-history-tools" >> "$GITHUB_ENV"
      - run: |
          npm install --prefix functions --no-audit --no-fund
          npm install --prefix apps/erp-next --no-audit --no-fund
          npm install --prefix "$PROJECTS_UI_TOOLS" --no-audit --no-fund firebase-tools@15.30.0 playwright@1.57.0 esbuild@0.25.9
          "$PROJECTS_UI_TOOLS/node_modules/.bin/playwright" install --with-deps chromium webkit
      - run: node --test functions/projects/*.test.js
      - run: npm run typecheck --prefix apps/erp-next
      - name: Real Auth and Firestore historical review, replay, contention and atomic audit
        run: >-
          "$PROJECTS_UI_TOOLS/node_modules/.bin/firebase" emulators:exec
          --project demo-demac-projects --config firebase.projects-emulator.json --only firestore,auth
          'node --test functions/projects/history-reconciliation.emulator.cjs'
      - name: Real history dialog in two browser engines
        run: node apps/erp-next/scripts/projects-history-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: projects-history-ui-evidence
          path: projects-history-ui-evidence/
          retention-days: 7
          if-no-files-found: warn
