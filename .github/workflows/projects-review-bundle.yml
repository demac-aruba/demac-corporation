name: Projects isolated source review
on:
  push:
    branches: ['feature/projects-canonical-integration']
    paths: ['.github/workflows/projects-review-bundle.yml']
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Archive tracked source only, no environment or credentials
        run: |
          python3 - <<'PY'
          import subprocess, tarfile
          from pathlib import Path
          files = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          allowed = ['AGENTS.md', 'package.json', 'package-lock.json', 'firestore.rules', 'firestore.indexes.json', 'firebase.json']
          prefixes = ('apps/erp-next/', 'functions/', 'types/', 'utils/', 'services/', 'constants/', 'docs/ai/', '.github/workflows/')
          suffixes = {'.ts','.tsx','.js','.cjs','.mjs','.css','.md','.json','.yml','.yaml'}
          with tarfile.open('projects-source-review.tar.gz','w:gz') as archive:
              for name in files:
                  p = Path(name)
                  if not name or not p.is_file() or p.is_symlink(): continue
                  if name not in allowed and not (name.startswith(prefixes) and p.suffix in suffixes): continue
                  if any(x in p.name.lower() for x in ('.env','serviceaccount','service-account','credential','private-key')): continue
                  archive.add(name, arcname=name, recursive=False)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: projects-source-review
          path: projects-source-review.tar.gz
          retention-days: 1
          if-no-files-found: error
