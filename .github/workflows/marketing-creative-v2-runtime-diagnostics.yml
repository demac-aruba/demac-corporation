name: Marketing Creative V2 Runtime Diagnostics

on:
  push:
    branches:
      - test/marketing-creative-v2-production-smoke
    paths:
      - '.github/workflows/marketing-creative-v2-runtime-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Authenticate Firebase deployment service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Inspect Creative Builder runtime and recent errors
        shell: bash
        run: |
          set -euo pipefail
          FN=requestMarketingCreativeBuild
          echo '=== Cloud Function ==='
          gcloud functions describe "$FN" --project=demac-corporation --gen2 --region=us-central1 --format='yaml(state,serviceConfig.timeoutSeconds,serviceConfig.availableMemory,serviceConfig.maxInstanceCount,serviceConfig.service,serviceConfig.uri,updateTime)'
          SERVICE="$(gcloud functions describe "$FN" --project=demac-corporation --gen2 --region=us-central1 --format='value(serviceConfig.service)')"
          SERVICE="${SERVICE##*/}"
          echo "Resolved Cloud Run service: $SERVICE"
          echo '=== Cloud Run timeout ==='
          gcloud run services describe "$SERVICE" --project=demac-corporation --region=us-central1 --format='yaml(spec.template.spec.timeoutSeconds,status.latestReadyRevisionName,status.conditions)'
          echo '=== Recent Cloud Run error/warning logs ==='
          gcloud logging read "resource.type=\"cloud_run_revision\" AND resource.labels.service_name=\"$SERVICE\" AND timestamp>=\"2026-08-17T00:29:00Z\" AND severity>=WARNING" --project=demac-corporation --limit=80 --format='value(timestamp,severity,textPayload,jsonPayload.message,httpRequest.status)' || true
