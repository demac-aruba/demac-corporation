name: Careers audit source snapshot
on:
  push:
    branches: [feature/careers-funnel-preview]
    paths: ['.github/workflows/careers-audit-snapshot.yml']
permissions:
  contents: read
jobs:
  source:
    if: github.ref == 'refs/heads/feature/careers-funnel-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - name: Export tracked engineering source only
        run: >-
          git archive --format=zip --output=careers-audit-source.zip HEAD
          AGENTS.md docs/ai apps/erp-next functions
          firestore.rules storage.rules firebase.careers-test.json
      - uses: actions/upload-artifact@v4
        with:
          name: careers-audit-source-${{ github.sha }}
          path: careers-audit-source.zip
          retention-days: 1
          if-no-files-found: error
