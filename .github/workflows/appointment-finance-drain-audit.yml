name: Read-only finance revision drain evidence
on:
  push:
    branches: [fix/appointment-finance-release-20261012]
    paths: ['scripts/appointment-finance-drain-audit.cjs', '.github/workflows/appointment-finance-drain-audit.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: node scripts/appointment-finance-drain-audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appointment-finance-drain-audit
          path: ${{ runner.temp }}/finance-drain-audit.json
          retention-days: 30
          if-no-files-found: error
