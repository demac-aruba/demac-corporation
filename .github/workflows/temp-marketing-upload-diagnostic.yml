name: Temporary Marketing Upload Diagnostic

on:
  push:
    branches:
      - agent/marketing-upload-diagnostic
    paths:
      - '.github/workflows/temp-marketing-upload-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}

      - name: Inspect Cloud Storage for Firebase service-agent IAM
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_NUMBER="$(gcloud projects describe demac-corporation --format='value(projectNumber)')"
          STORAGE_AGENT="service-${PROJECT_NUMBER}@gcp-sa-firebasestorage.iam.gserviceaccount.com"
          echo "projectNumber=${PROJECT_NUMBER}"
          echo "storageServiceAgent=${STORAGE_AGENT}"
          gcloud projects get-iam-policy demac-corporation --format=json > /tmp/policy.json
          python3 - <<'PY'
          import json, os
          p=json.load(open('/tmp/policy.json'))
          n=os.popen("gcloud projects describe demac-corporation --format='value(projectNumber)'").read().strip()
          targets={
            'storage':f'serviceAccount:service-{n}@gcp-sa-firebasestorage.iam.gserviceaccount.com',
            'rules':f'serviceAccount:service-{n}@gcp-sa-firebaserules.iam.gserviceaccount.com',
            'legacy_rules':f'serviceAccount:service-{n}@firebase-rules.iam.gserviceaccount.com',
          }
          out={k:[] for k in targets}
          for b in p.get('bindings',[]):
              for k,m in targets.items():
                  if m in b.get('members',[]): out[k].append(b.get('role'))
          print(json.dumps({'targets':targets,'roles':out},indent=2))
          PY
