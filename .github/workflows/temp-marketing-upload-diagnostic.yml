name: Temporary Marketing Upload Diagnostic

on:
  push:
    branches:
      - agent/marketing-upload-diagnostic
    paths:
      - '.github/workflows/temp-marketing-upload-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}

      - name: Inspect Firebase Rules Firestore service-agent IAM
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_NUMBER="$(gcloud projects describe demac-corporation --format='value(projectNumber)')"
          AGENT="service-${PROJECT_NUMBER}@gcp-sa-firebaserules.iam.gserviceaccount.com"
          echo "projectNumber=${PROJECT_NUMBER}"
          echo "rulesServiceAgent=${AGENT}"
          echo '=== MATCHING IAM BINDINGS ==='
          gcloud projects get-iam-policy demac-corporation --format=json > /tmp/policy.json
          python3 - <<'PY'
          import json, os
          p=json.load(open('/tmp/policy.json'))
          project_number=os.popen("gcloud projects describe demac-corporation --format='value(projectNumber)'").read().strip()
          agent=f'serviceAccount:service-{project_number}@gcp-sa-firebaserules.iam.gserviceaccount.com'
          found=[]
          for b in p.get('bindings',[]):
              if agent in b.get('members',[]):
                  found.append(b.get('role'))
          print(json.dumps({'agent':agent,'roles':found},indent=2))
          PY
