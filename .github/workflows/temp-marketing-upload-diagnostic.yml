name: Temporary Marketing Upload Diagnostic

on:
  push:
    branches:
      - agent/marketing-upload-diagnostic
    paths:
      - '.github/workflows/temp-marketing-upload-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}

      - name: Inspect bucket CORS and browser preflight
        shell: bash
        run: |
          set -euo pipefail
          echo '=== BUCKET CORS ==='
          gcloud storage buckets describe gs://demac-corporation.firebasestorage.app --format='json(cors_config)' || true
          echo '=== PREFLIGHT demac-aruba.com ==='
          curl -sS -i -X OPTIONS \
            -H 'Origin: https://demac-aruba.com' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,content-type,x-goog-upload-protocol' \
            'https://firebasestorage.googleapis.com/v0/b/demac-corporation.firebasestorage.app/o?name=marketing%2Foriginals%2Fcors-test%2Ftest.png' | head -80
          echo '=== PREFLIGHT www.demac-aruba.com ==='
          curl -sS -i -X OPTIONS \
            -H 'Origin: https://www.demac-aruba.com' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,content-type,x-goog-upload-protocol' \
            'https://firebasestorage.googleapis.com/v0/b/demac-corporation.firebasestorage.app/o?name=marketing%2Foriginals%2Fcors-test%2Ftest.png' | head -80
