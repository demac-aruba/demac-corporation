name: Temporary wacli status-broadcast migration

on:
  push:
    branches:
      - fix/wacli-ignore-status-broadcast-20260817
    paths:
      - tools/fix-wacli-status-broadcast-poison.py
      - .github/workflows/tmp-fix-wacli-status-broadcast.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply deterministic status-broadcast filter
        run: python3 tools/fix-wacli-status-broadcast-poison.py
      - name: Validate bridge source
        run: |
          node --check ops/digitalocean/deploy/server-v2.mjs
          grep -Fq "return chat === 'status@broadcast';" ops/digitalocean/deploy/server-v2.mjs
          grep -Fq "reason: 'status-broadcast'" ops/digitalocean/deploy/server-v2.mjs
      - name: Commit migrated bridge
        run: |
          git config user.name demac-aruba
          git config user.email gm.demac@gmail.com
          git add ops/digitalocean/deploy/server-v2.mjs
          git commit -m "Ignore WhatsApp status broadcasts in customer connector"
          git push origin HEAD:fix/wacli-ignore-status-broadcast-20260817
