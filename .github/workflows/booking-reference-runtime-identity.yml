name: Booking reference runtime identity check
on:
  push:
    branches: [test/booking-reference-runtime-identity-20261007]
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Compare runtime identities and private storage configuration only
        run: |
          python3 - <<'PY'
          import json,subprocess
          def describe(name):
              return json.loads(subprocess.check_output(['gcloud','functions','describe',name,'--project=demac-corporation','--region=us-central1','--gen2','--format=json'],stderr=subprocess.PIPE))
          office=describe('officeBookingAuthority')
          gateway=describe('wacliOutboundPoll')
          inventory=json.loads(subprocess.check_output(['gcloud','functions','list','--project=demac-corporation','--regions=us-central1','--v2','--format=json(name)'],stderr=subprocess.PIPE))
          for name in ['wacliBookingReferenceMedia','cleanupBookingReferenceUploads','notifyBookingReferenceUpdate','bookingVisitReferences']:
              if not any(item['name'].endswith('/'+name) for item in inventory):
                  print(json.dumps({'name':name,'present':False}));continue
              fn=describe(name); sc=fn['serviceConfig'];cfg=json.loads(sc.get('environmentVariables',{}).get('FIREBASE_CONFIG','{}'))
              result={'name':name,'state':fn['state'],'sameRuntimeAsOffice':sc.get('serviceAccountEmail')==office['serviceConfig']['serviceAccountEmail'],'sameRuntimeAsGateway':sc.get('serviceAccountEmail')==gateway['serviceConfig']['serviceAccountEmail'],'expectedPrivateBucket':cfg.get('storageBucket')=='demac-corporation.firebasestorage.app','memory':sc.get('availableMemory'),'concurrency':sc.get('maxInstanceRequestConcurrency'),'revision':sc.get('revision')}
              print(json.dumps(result))
          PY
      - name: Inspect changed event function configuration without exposing environment values
        run: |
          python3 - <<'PY'
          import json,subprocess
          def run(args): return json.loads(subprocess.check_output(['gcloud']+args,stderr=subprocess.PIPE))
          fn=run(['functions','describe','queueAppointmentConfirmation','--project=demac-corporation','--region=us-central1','--gen2','--format=json'])
          print(json.dumps({'name':'queueAppointmentConfirmation','revision':fn['serviceConfig']['revision'],'eventTrigger':fn.get('eventTrigger')}))
          def spec(revision):
              r=run(['run','revisions','describe',revision,'--project=demac-corporation','--region=us-central1','--format=json'])
              s=r['spec']
              for c in s.get('containers',[]):
                  c.pop('image',None); c['env']=sorted(c.get('env',[]),key=lambda e:e['name'])
              return s
          before=spec('queueappointmentconfirmation-00043-doh');after=spec(fn['serviceConfig']['revision'])
          def differences(a,b,p=''):
              if isinstance(a,dict) and isinstance(b,dict):
                  return sum((differences(a.get(k),b.get(k),p+'.'+k) for k in sorted(set(a)|set(b))),[])
              if a!=b: return [p]
              return []
          print(json.dumps({'runtimeSpecChangedPaths':differences(before,after)}))
          query='protoPayload.serviceName="cloudfunctions.googleapis.com" AND protoPayload.resourceName="projects/demac-corporation/locations/us-central1/functions/queueAppointmentConfirmation" AND protoPayload.methodName="google.cloud.functions.v2.FunctionService.UpdateFunction"'
          try:
              raw=run(['logging','read',query,'--project=demac-corporation','--limit=12','--freshness=30d','--format=json'])
              logs=[{'at':entry.get('timestamp'),'updateMask':entry.get('protoPayload',{}).get('request',{}).get('updateMask'),'requestEventTrigger':entry.get('protoPayload',{}).get('request',{}).get('function',{}).get('eventTrigger'),'responseEventTrigger':entry.get('protoPayload',{}).get('response',{}).get('eventTrigger')} for entry in raw]
              print(json.dumps({'eventDeploymentAudit':logs}))
          except subprocess.CalledProcessError as e:
              print(json.dumps({'loggingReadError':e.stderr.decode()[:1500]}))
          trigger=run(['eventarc','triggers','describe','queueappointmentconfirmation-968617','--project=demac-corporation','--location=nam5','--format=json'])
          print(json.dumps({'eventarcCreatedAt':trigger.get('createTime'),'eventarcUpdatedAt':trigger.get('updateTime'),'eventarcFilters':trigger.get('eventFilters'),'eventarcService':trigger.get('destination',{}).get('cloudRun',{}).get('service')}))
          PY
