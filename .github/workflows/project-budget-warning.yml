name: Project budget advisory acceptance
on:
  pull_request:
    paths:
      - 'apps/erp-next/lib/browser-projects.ts'
      - 'apps/erp-next/lib/firebase/firestore-rest.ts'
      - 'apps/erp-next/lib/project-labor-budget.ts'
      - 'apps/erp-next/lib/*project-slot-progress.ts'
      - 'apps/erp-next/lib/project-phase-planner.ts'
      - 'apps/erp-next/lib/office-booking-authority.ts'
      - 'apps/erp-next/components/projects/**'
      - 'apps/erp-next/components/scheduling/live-appointment-create-drawer.tsx'
      - 'apps/erp-next/scripts/project-budget*'
      - 'apps/erp-next/scripts/project-slot-progress*'
      - '.github/workflows/project-budget-warning.yml'
  push:
    branches: [main]
    paths:
      - 'apps/erp-next/lib/project-labor-budget.ts'
      - 'apps/erp-next/lib/firebase/firestore-rest.ts'
      - 'apps/erp-next/lib/*project-slot-progress.ts'
      - 'apps/erp-next/lib/office-booking-authority.ts'
      - 'apps/erp-next/scripts/project-budget*'
      - 'apps/erp-next/scripts/project-slot-progress*'
      - '.github/workflows/project-budget-warning.yml'
permissions:
  contents: read
jobs:
  budget-advisory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/erp-next
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - name: Budget and phase acceptance
        run: >-
          npx tsc --ignoreConfig scripts/project-budget-acceptance.ts scripts/project-budget-transport-acceptance.ts scripts/project-phase-planner-acceptance.ts
          --module commonjs --target ES2022 --moduleResolution node --ignoreDeprecations 6.0
          --esModuleInterop --skipLibCheck --types node --outDir .project-budget-test --rootDir . --lib ES2022,DOM
          && node .project-budget-test/scripts/project-budget-acceptance.js
          && node .project-budget-test/scripts/project-budget-transport-acceptance.js
          && node .project-budget-test/scripts/project-phase-planner-acceptance.js
      - run: npm run test:projects-preview
      - run: npm run test:project-slot-progress
      - run: npm run typecheck
      - name: Preserve Booking Authority and support/replay contracts
        working-directory: .
        run: |
          npm install --prefix functions --no-audit --no-fund
          node --test functions/bookingAuthorityCore.test.js functions/bookingAuthorityFirestore.test.js functions/bookingAuthorityWorkOrders.test.js functions/officeBookingAuthority.test.js functions/bookingCapacityAvailability.test.js functions/bookingAuthoritySchedulingEngine.test.js functions/officeBookingAuthorityMultiWork.test.js functions/officeBookingAuthorityCommunication.test.js
  isolated-budget-browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install isolated browser tooling
        env:
          BUDGET_TEST_TOOLS: ${{ runner.temp }}/budget-tools
        run: |
          npm install --prefix apps/erp-next --no-audit --no-fund
          npm install --prefix "$BUDGET_TEST_TOOLS" --no-audit --no-fund playwright@1.57.0 esbuild@0.25.9
          "$BUDGET_TEST_TOOLS/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Real drawer with synthetic authority responses; no external requests
        env:
          BUDGET_TEST_TOOLS: ${{ runner.temp }}/budget-tools
        run: node apps/erp-next/scripts/project-budget-browser.cjs
      - name: Retain synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-budget-browser-evidence
          path: project-budget-browser-evidence/
          if-no-files-found: warn
          retention-days: 7
      - name: Current slots and chronological detail with synthetic read-only data
        env:
          BUDGET_TEST_TOOLS: ${{ runner.temp }}/budget-tools
        run: node apps/erp-next/scripts/project-slot-progress-browser.cjs
      - name: Retain Project slot progress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-slot-progress-evidence
          path: project-slot-progress-evidence/
          if-no-files-found: warn
          retention-days: 7
