name: Marketing Agent Function

on:
  pull_request:
    paths:
      - 'functions/marketingImageAnalysis.js'
      - 'functions/marketingImageAnalysisCallable.js'
      - 'functions/marketingCampaignStrategy.js'
      - 'functions/bootstrap.js'
      - '.github/workflows/marketing-agent-function-deploy.yml'
  push:
    branches:
      - main
    paths:
      - 'functions/marketingImageAnalysis.js'
      - 'functions/marketingImageAnalysisCallable.js'
      - 'functions/marketingCampaignStrategy.js'
      - 'functions/bootstrap.js'
      - '.github/workflows/marketing-agent-function-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-marketing-function:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install function dependencies
        run: npm install --prefix functions --no-audit --no-fund
      - name: Validate function syntax and callable exports
        run: |
          node --check functions/marketingImageAnalysis.js
          node --check functions/marketingImageAnalysisCallable.js
          node --check functions/marketingCampaignStrategy.js
          node --check functions/bootstrap.js
          node -e "const mod=require('./functions/bootstrap'); if(typeof mod.requestMarketingImageAnalysis!=='function') throw new Error('requestMarketingImageAnalysis export missing'); if(typeof mod.requestMarketingCampaignStrategy!=='function') throw new Error('requestMarketingCampaignStrategy export missing'); if(typeof mod.analyzeMarketingUploadSession==='function') throw new Error('legacy Eventarc marketing handler must not be exported from bootstrap');"

  deploy-marketing-function:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-marketing-function
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate Firebase deployment service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve existing DEMAC runtime identity
        id: config
        shell: bash
        run: |
          set -euo pipefail
          REPORT_NAME='generateProfessionalCustomerReport'
          if ! gcloud functions describe "$REPORT_NAME" --project=demac-corporation --gen2 --region=us-central1 --format='value(name)' >/dev/null 2>&1; then
            REPORT_NAME="$(gcloud functions list --project=demac-corporation --gen2 --format='value(name)' | awk -F/ 'tolower($NF) ~ /generateprofessionalcustomerreport/ {print $NF; exit}')"
          fi
          if [ -z "$REPORT_NAME" ]; then
            echo '::error::Could not find the existing DEMAC professional report function to mirror its runtime identity.'
            exit 1
          fi
          RUN_SA="$(gcloud functions describe "$REPORT_NAME" --project=demac-corporation --gen2 --region=us-central1 --format='value(serviceConfig.serviceAccountEmail)')"
          if [ -z "$RUN_SA" ]; then
            echo '::error::Could not resolve the existing DEMAC runtime service account.'
            exit 1
          fi
          echo "run_service_account=${RUN_SA}" >> "$GITHUB_OUTPUT"

      - name: Deploy Marketing Agent visual analysis callable
        shell: bash
        env:
          RUN_SERVICE_ACCOUNT: ${{ steps.config.outputs.run_service_account }}
        run: |
          set -euo pipefail
          gcloud functions deploy requestMarketingImageAnalysis \
            --project=demac-corporation \
            --gen2 \
            --region=us-central1 \
            --runtime=nodejs22 \
            --source=functions \
            --entry-point=requestMarketingImageAnalysis \
            --memory=512Mi \
            --timeout=540s \
            --run-service-account="$RUN_SERVICE_ACCOUNT" \
            --set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest \
            --trigger-http \
            --allow-unauthenticated \
            --quiet
          RUN_SERVICE="$(gcloud functions describe requestMarketingImageAnalysis --project=demac-corporation --gen2 --region=us-central1 --format='value(serviceConfig.service)')"
          RUN_SERVICE="${RUN_SERVICE##*/}"
          gcloud run services add-iam-policy-binding "$RUN_SERVICE" \
            --project=demac-corporation \
            --region=us-central1 \
            --member=allUsers \
            --role=roles/run.invoker \
            --quiet

      - name: Deploy Marketing Agent campaign strategist callable
        shell: bash
        env:
          RUN_SERVICE_ACCOUNT: ${{ steps.config.outputs.run_service_account }}
        run: |
          set -euo pipefail
          gcloud functions deploy requestMarketingCampaignStrategy \
            --project=demac-corporation \
            --gen2 \
            --region=us-central1 \
            --runtime=nodejs22 \
            --source=functions \
            --entry-point=requestMarketingCampaignStrategy \
            --memory=512Mi \
            --timeout=540s \
            --run-service-account="$RUN_SERVICE_ACCOUNT" \
            --set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest \
            --trigger-http \
            --allow-unauthenticated \
            --quiet
          RUN_SERVICE="$(gcloud functions describe requestMarketingCampaignStrategy --project=demac-corporation --gen2 --region=us-central1 --format='value(serviceConfig.service)')"
          RUN_SERVICE="${RUN_SERVICE##*/}"
          gcloud run services add-iam-policy-binding "$RUN_SERVICE" \
            --project=demac-corporation \
            --region=us-central1 \
            --member=allUsers \
            --role=roles/run.invoker \
            --quiet

      - name: Verify deployed Marketing Agent callables
        shell: bash
        run: |
          set -euo pipefail
          for FUNCTION_NAME in requestMarketingImageAnalysis requestMarketingCampaignStrategy; do
            STATE="$(gcloud functions describe "$FUNCTION_NAME" --project=demac-corporation --gen2 --region=us-central1 --format='value(state)')"
            URI="$(gcloud functions describe "$FUNCTION_NAME" --project=demac-corporation --gen2 --region=us-central1 --format='value(serviceConfig.uri)')"
            if [ "$STATE" != "ACTIVE" ] || [ -z "$URI" ]; then
              echo "::error::$FUNCTION_NAME state is ${STATE:-unknown}; URI=${URI:-missing}."
              exit 1
            fi
            echo "$FUNCTION_NAME is ACTIVE at $URI"
          done