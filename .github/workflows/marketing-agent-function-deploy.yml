name: Marketing Agent Function

on:
  pull_request:
    paths:
      - 'functions/marketingImageAnalysis.js'
      - 'functions/bootstrap.js'
      - '.github/workflows/marketing-agent-function-deploy.yml'
  push:
    branches:
      - main
    paths:
      - 'functions/marketingImageAnalysis.js'
      - 'functions/bootstrap.js'
      - '.github/workflows/marketing-agent-function-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-marketing-function:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install function dependencies
        run: npm install --prefix functions --no-audit --no-fund
      - name: Validate function syntax and exports
        run: |
          node --check functions/marketingImageAnalysis.js
          node --check functions/bootstrap.js
          node -e "const mod=require('./functions/bootstrap'); if(typeof mod.analyzeMarketingUploadSession!=='function') throw new Error('analyzeMarketingUploadSession export missing');"

  deploy-marketing-function:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-marketing-function
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate Firebase deployment service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve existing DEMAC runtime configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          DB_LOCATION="$(gcloud firestore databases describe --project=demac-corporation --database='(default)' --format='value(locationId)')"
          if [ -z "$DB_LOCATION" ]; then
            echo '::error::Could not resolve the default Firestore database location.'
            exit 1
          fi

          REPORT_NAME='generateProfessionalCustomerReport'
          if ! gcloud functions describe "$REPORT_NAME" --project=demac-corporation --gen2 --region=us-central1 --format='value(name)' >/dev/null 2>&1; then
            REPORT_NAME="$(gcloud functions list --project=demac-corporation --gen2 --format='value(name)' | awk -F/ 'tolower($NF) ~ /generateprofessionalcustomerreport/ {print $NF; exit}')"
          fi
          if [ -z "$REPORT_NAME" ]; then
            echo '::error::Could not find the existing DEMAC professional report function to mirror its runtime identity.'
            exit 1
          fi

          RUN_SA="$(gcloud functions describe "$REPORT_NAME" --project=demac-corporation --gen2 --region=us-central1 --format='value(serviceConfig.serviceAccountEmail)')"
          if [ -z "$RUN_SA" ]; then
            echo '::error::Could not resolve the existing DEMAC runtime service account.'
            exit 1
          fi

          echo "database_location=${DB_LOCATION}" >> "$GITHUB_OUTPUT"
          echo "run_service_account=${RUN_SA}" >> "$GITHUB_OUTPUT"

      - name: Deploy Marketing Agent analysis function
        shell: bash
        env:
          DB_LOCATION: ${{ steps.config.outputs.database_location }}
          RUN_SERVICE_ACCOUNT: ${{ steps.config.outputs.run_service_account }}
        run: |
          set -euo pipefail
          gcloud functions deploy analyzeMarketingUploadSession \
            --project=demac-corporation \
            --gen2 \
            --region=us-central1 \
            --trigger-location="$DB_LOCATION" \
            --runtime=nodejs22 \
            --source=functions \
            --entry-point=analyzeMarketingUploadSession \
            --memory=512Mi \
            --timeout=540s \
            --run-service-account="$RUN_SERVICE_ACCOUNT" \
            --set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest \
            --trigger-event-filters=type=google.cloud.firestore.document.v1.updated \
            --trigger-event-filters=database='(default)' \
            --trigger-event-filters-path-pattern="document=marketingUploadSessions/{sessionId}" \
            --quiet

      - name: Verify deployed function
        shell: bash
        run: |
          set -euo pipefail
          STATE="$(gcloud functions describe analyzeMarketingUploadSession --project=demac-corporation --gen2 --region=us-central1 --format='value(state)')"
          if [ "$STATE" != "ACTIVE" ]; then
            echo "::error::Marketing Agent function state is ${STATE:-unknown}, expected ACTIVE."
            exit 1
          fi
          echo 'Marketing Agent analysis function is ACTIVE.'
