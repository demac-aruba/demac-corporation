name: Marketing Agent Function

on:
  pull_request:
    paths:
      - 'functions/marketingImageAnalysis.js'
      - 'functions/marketingImageAnalysisCallable.js'
      - 'functions/marketingCampaignStrategy.js'
      - 'functions/marketingCampaignStrategyAruba.js'
      - 'functions/marketingCreativeBuilder.js'
      - 'functions/marketingCreativeBuilderV2.js'
      - 'functions/marketingCreativeBuilderV2Compat.js'
      - 'functions/marketingCreativeBuilderV21.js'
      - 'functions/marketingCreativeBuilderV3.js'
      - 'functions/marketingCreativeSkillsV3.js'
      - 'functions/marketingCreativeProvidersV3.js'
      - 'functions/marketingCreativeRead.js'
      - 'functions/package.json'
      - 'functions/bootstrap.js'
      - '.github/workflows/marketing-agent-function-deploy.yml'
  push:
    branches:
      - main
    paths:
      - 'functions/marketingImageAnalysis.js'
      - 'functions/marketingImageAnalysisCallable.js'
      - 'functions/marketingCampaignStrategy.js'
      - 'functions/marketingCampaignStrategyAruba.js'
      - 'functions/marketingCreativeBuilder.js'
      - 'functions/marketingCreativeBuilderV2.js'
      - 'functions/marketingCreativeBuilderV2Compat.js'
      - 'functions/marketingCreativeBuilderV21.js'
      - 'functions/marketingCreativeBuilderV3.js'
      - 'functions/marketingCreativeSkillsV3.js'
      - 'functions/marketingCreativeProvidersV3.js'
      - 'functions/marketingCreativeRead.js'
      - 'functions/package.json'
      - 'functions/bootstrap.js'
      - '.github/workflows/marketing-agent-function-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-marketing-function:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install function dependencies
        run: npm install --prefix functions --no-audit --no-fund
      - name: Validate function syntax and callable exports
        run: |
          node --check functions/marketingImageAnalysis.js
          node --check functions/marketingImageAnalysisCallable.js
          node --check functions/marketingCampaignStrategy.js
          node --check functions/marketingCampaignStrategyAruba.js
          node --check functions/marketingCreativeBuilder.js
          node --check functions/marketingCreativeBuilderV2.js
          node --check functions/marketingCreativeBuilderV2Compat.js
          node --check functions/marketingCreativeBuilderV21.js
          node --check functions/marketingCreativeBuilderV3.js
          node --check functions/marketingCreativeSkillsV3.js
          node --check functions/marketingCreativeProvidersV3.js
          node --check functions/marketingCreativeRead.js
          node --check functions/bootstrap.js
          node - <<'NODE'
          const mod = require('./functions/bootstrap');
          for (const name of [
            'requestMarketingImageAnalysis',
            'requestMarketingCampaignStrategy',
            'requestMarketingCreativeBuild',
            'approveMarketingCreative',
            'getMarketingCreativeState',
          ]) {
            if (typeof mod[name] !== 'function') throw new Error(`${name} export missing`);
          }
          if (typeof mod.analyzeMarketingUploadSession === 'function') {
            throw new Error('legacy Eventarc marketing handler must not be exported from bootstrap');
          }

          const aruba = require('./functions/marketingCampaignStrategyAruba').__marketingCampaignStrategyArubaTest;
          if (!aruba || aruba.verifiedArubaMarketingWords.length < 20) {
            throw new Error('Aruba Marketing lexicon did not load enough verified official words.');
          }
          const replacements = new Map(aruba.verifiedCuracaoReplacements);
          for (const [curacao, expectedAruba] of [
            ['ku', 'cu'],
            ['hasi', 'haci'],
            ['kada', 'cada'],
            ['atenshon', 'atencion'],
            ['konfiabel', 'confiabel'],
            ['profeshonal', 'profesional'],
          ]) {
            if (replacements.get(curacao) !== expectedAruba) {
              throw new Error(`Official Aruba replacement missing: ${curacao} -> ${expectedAruba}`);
            }
          }
          const badStrategy = {
            copy: {
              language: 'pap_aw',
              headline: 'Trabou profeshonal i konfiabel',
              subheadline: 'Hasi bo cita ku atenshon',
              primaryText: 'Kada detaye ta importante ku DEMAC.',
              cta: 'WhatsApp nos awe mes',
            },
          };
          const normalized = aruba.applyVerifiedArubaReplacements(badStrategy);
          const forbidden = aruba.papiamentoForbiddenWords(normalized);
          if (forbidden.length) throw new Error(`Curaçao forms survived normalization: ${forbidden.join(', ')}`);
          const safeFallback = aruba.deterministicSafeCopy(badStrategy, 'installation', {}, []);
          const fallbackIssues = aruba.papiamentoReviewWords(safeFallback, []);
          if (fallbackIssues.length) throw new Error(`Approved DEMAC fallback did not validate: ${fallbackIssues.join(', ')}`);

          const v3 = require('./functions/marketingCreativeBuilderV3').__marketingCreativeBuilderV3Test;
          if (!v3 || v3.IMAGE_MODEL !== 'gpt-image-2') throw new Error('Creative Engine V3 must require gpt-image-2 as the active image provider.');
          if (v3.ART_DIRECTOR_MODEL !== 'gpt-5.6-sol' || v3.QA_MODEL !== 'gpt-5.6-sol') {
            throw new Error('Creative Engine V3 must use GPT-5.6 Sol for art direction and benchmark QA.');
          }
          if (v3.BUILDER_VERSION !== 'V3') throw new Error('Creative Builder production version must be V3.');
          if (v3.EXPLORATION_COUNT !== 12 || v3.SHORTLIST_COUNT !== 4 || v3.REFINEMENT_COUNT !== 2) {
            throw new Error('Creative Engine V3 must use the 12 -> 4 -> 2 exploration funnel.');
          }
          if (v3.FOOTER_RESERVED_PX < 140) throw new Error('Footer reserve is too small.');

          const skills = require('./functions/marketingCreativeSkillsV3');
          if (!Array.isArray(skills.AMATEUR_ANTI_PATTERNS) || skills.AMATEUR_ANTI_PATTERNS.length < 8) {
            throw new Error('V3 amateur anti-pattern skill is incomplete.');
          }
          if (!Array.isArray(skills.DESIGN_DNA) || skills.DESIGN_DNA.length < 8) {
            throw new Error('V3 DEMAC design DNA skill is incomplete.');
          }
          const provider = require('./functions/marketingCreativeProvidersV3').providerManifest();
          if (provider.activeProvider !== 'openai_full_design' || provider.providers.openai_full_design !== true) {
            throw new Error('V3 provider manifest must expose OpenAI full-design as the active provider.');
          }
          const production = require('./functions/marketingCreativeBuilderV2Compat').__marketingCreativeBuilderV3Test;
          if (!production || production.BUILDER_VERSION !== 'V3') {
            throw new Error('Production Marketing Creative adapter is not routed to V3.');
          }
          console.log('Aruba Papiamento + Marketing Creative Engine V3 guardrails: PASS');
          NODE

  deploy-marketing-function:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-marketing-function
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate Firebase deployment service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve existing DEMAC runtime identity
        id: config
        shell: bash
        run: |
          set -euo pipefail
          REPORT_NAME='generateProfessionalCustomerReport'
          if ! gcloud functions describe "$REPORT_NAME" --project=demac-corporation --gen2 --region=us-central1 --format='value(name)' >/dev/null 2>&1; then
            REPORT_NAME="$(gcloud functions list --project=demac-corporation --gen2 --format='value(name)' | awk -F/ 'tolower($NF) ~ /generateprofessionalcustomerreport/ {print $NF; exit}')"
          fi
          if [ -z "$REPORT_NAME" ]; then
            echo '::error::Could not find the existing DEMAC professional report function to mirror its runtime identity.'
            exit 1
          fi
          RUN_SA="$(gcloud functions describe "$REPORT_NAME" --project=demac-corporation --gen2 --region=us-central1 --format='value(serviceConfig.serviceAccountEmail)')"
          if [ -z "$RUN_SA" ]; then
            echo '::error::Could not resolve the existing DEMAC runtime service account.'
            exit 1
          fi
          echo "run_service_account=${RUN_SA}" >> "$GITHUB_OUTPUT"

      - name: Deploy Marketing Agent callables
        shell: bash
        env:
          RUN_SERVICE_ACCOUNT: ${{ steps.config.outputs.run_service_account }}
        run: |
          set -euo pipefail

          make_public() {
            local function_name="$1"
            local run_service
            run_service="$(gcloud functions describe "$function_name" --project=demac-corporation --gen2 --region=us-central1 --format='value(serviceConfig.service)')"
            run_service="${run_service##*/}"
            gcloud run services add-iam-policy-binding "$run_service" \
              --project=demac-corporation \
              --region=us-central1 \
              --member=allUsers \
              --role=roles/run.invoker \
              --quiet
          }

          deploy_openai_callable() {
            local function_name="$1"
            local memory="$2"
            local timeout="$3"
            gcloud functions deploy "$function_name" \
              --project=demac-corporation \
              --gen2 \
              --region=us-central1 \
              --runtime=nodejs22 \
              --source=functions \
              --entry-point="$function_name" \
              --memory="$memory" \
              --timeout="$timeout" \
              --run-service-account="$RUN_SERVICE_ACCOUNT" \
              --set-env-vars='FIREBASE_CONFIG={"storageBucket":"demac-corporation.firebasestorage.app"}' \
              --set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest \
              --trigger-http \
              --allow-unauthenticated \
              --quiet
            make_public "$function_name"
          }

          deploy_plain_callable() {
            local function_name="$1"
            local memory="$2"
            local timeout="$3"
            gcloud functions deploy "$function_name" \
              --project=demac-corporation \
              --gen2 \
              --region=us-central1 \
              --runtime=nodejs22 \
              --source=functions \
              --entry-point="$function_name" \
              --memory="$memory" \
              --timeout="$timeout" \
              --run-service-account="$RUN_SERVICE_ACCOUNT" \
              --set-env-vars='FIREBASE_CONFIG={"storageBucket":"demac-corporation.firebasestorage.app"}' \
              --trigger-http \
              --allow-unauthenticated \
              --quiet
            make_public "$function_name"
          }

          deploy_openai_callable requestMarketingImageAnalysis 512Mi 540s
          deploy_openai_callable requestMarketingCampaignStrategy 512Mi 540s
          deploy_openai_callable requestMarketingCreativeBuild 2Gi 900s
          deploy_plain_callable approveMarketingCreative 512Mi 120s
          deploy_plain_callable getMarketingCreativeState 512Mi 120s

      - name: Verify deployed Marketing Agent callables
        shell: bash
        run: |
          set -euo pipefail
          FUNCTIONS=(
            requestMarketingImageAnalysis
            requestMarketingCampaignStrategy
            requestMarketingCreativeBuild
            approveMarketingCreative
            getMarketingCreativeState
          )

          MAX_ATTEMPTS=30
          SLEEP_SECONDS=10

          for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do
            PENDING=0
            echo "Readiness check ${ATTEMPT}/${MAX_ATTEMPTS}"

            for FUNCTION_NAME in "${FUNCTIONS[@]}"; do
              STATE="$(gcloud functions describe "$FUNCTION_NAME" --project=demac-corporation --gen2 --region=us-central1 --format='value(state)' || true)"
              URI="$(gcloud functions describe "$FUNCTION_NAME" --project=demac-corporation --gen2 --region=us-central1 --format='value(serviceConfig.uri)' || true)"

              if [ "$STATE" = "FAILED" ]; then
                echo "::error::$FUNCTION_NAME entered FAILED state; URI=${URI:-missing}."
                exit 1
              fi

              if [ "$STATE" = "ACTIVE" ] && [ -n "$URI" ]; then
                echo "$FUNCTION_NAME is ACTIVE at $URI"
              else
                echo "$FUNCTION_NAME is not ready yet: state=${STATE:-unknown}; URI=${URI:-missing}."
                PENDING=$((PENDING + 1))
              fi
            done

            if [ "$PENDING" -eq 0 ]; then
              echo 'All Marketing Agent callables are ACTIVE.'
              exit 0
            fi

            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              sleep "$SLEEP_SECONDS"
            fi
          done

          echo '::error::Marketing Agent callables did not all become ACTIVE within 5 minutes.'
          exit 1
