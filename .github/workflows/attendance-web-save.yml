name: Attendance authenticated web save
on:
  pull_request:
    paths:
      - 'apps/erp-next/lib/firebase/**'
      - 'apps/erp-next/lib/employee-attendance*'
      - 'apps/erp-next/components/employees/**'
      - 'apps/erp-next/scripts/employee-attendance*'
      - 'apps/erp-next/scripts/employee-split*'
      - 'apps/erp-next/scripts/test-support/attendance-emulator.cjs'
      - 'firestore.rules'
      - 'firebase.attendance-test.json'
      - '.github/workflows/attendance-web-save.yml'
  push:
    branches: [main]
    paths:
      - 'apps/erp-next/lib/firebase/**'
      - 'apps/erp-next/lib/employee-attendance*'
      - 'apps/erp-next/components/employees/**'
      - 'apps/erp-next/scripts/employee-attendance*'
      - 'apps/erp-next/scripts/employee-split*'
      - 'apps/erp-next/scripts/test-support/attendance-emulator.cjs'
      - 'firestore.rules'
      - 'firebase.attendance-test.json'
      - '.github/workflows/attendance-web-save.yml'
permissions:
  contents: read
jobs:
  authenticated-save:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCLOUD_PROJECT: demo-demac-attendance
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8408
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9108
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated test tooling
        run: |
          npm install --prefix apps/erp-next --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/attendance-tools" --no-audit --no-fund firebase-tools@14.17.0 playwright@1.57.0 esbuild@0.25.9
          "$RUNNER_TEMP/attendance-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Compile and verify attendance contracts
        run: npm run test:employee-attendance --prefix apps/erp-next
      - name: Real Rules, real authentication, concurrency and browser persistence
        env:
          ATTENDANCE_TEST_TOOLS: ${{ runner.temp }}/attendance-tools
          ATTENDANCE_TEST_OUTPUT: ${{ runner.temp }}/attendance-auth-evidence
        run: >-
          "$RUNNER_TEMP/attendance-tools/node_modules/.bin/firebase" emulators:exec
          --only firestore,auth --project demo-demac-attendance --config firebase.attendance-test.json
          'node apps/erp-next/scripts/employee-attendance-emulator.cjs && node apps/erp-next/scripts/employee-split-browser.cjs --emulator'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attendance-authenticated-browser-evidence
          path: ${{ runner.temp }}/attendance-auth-evidence/
          if-no-files-found: warn
          retention-days: 30
