name: Technician session resilience
on:
  pull_request:
    paths:
      - 'apps/erp-next/components/auth/**'
      - 'apps/erp-next/lib/firebase/**'
      - 'apps/erp-next/scripts/auth-session-*'
      - '.github/workflows/technician-auth-session.yml'
permissions:
  contents: read
concurrency:
  group: technician-auth-session-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  session-regressions:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Preserve actual application typecheck
        run: |
          npm install --prefix apps/erp-next --no-audit --no-fund
          npm run typecheck --prefix apps/erp-next
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/auth-tools" --no-audit --no-fund playwright@1.57.0 esbuild@0.25.9
          "$RUNNER_TEMP/auth-tools/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Verify real AuthProvider and session module with injected failures
        env:
          FIELD_PORTAL_TEST_TOOLS: ${{ runner.temp }}/auth-tools
          AUTH_SESSION_EVIDENCE: ${{ runner.temp }}/auth-results
        run: node apps/erp-next/scripts/auth-session-browser.cjs
      - name: Preserve regression results and fixture screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: technician-auth-session-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/auth-results/auth-session-results.json
            ${{ runner.temp }}/auth-results/*.png
          if-no-files-found: warn
          retention-days: 7
