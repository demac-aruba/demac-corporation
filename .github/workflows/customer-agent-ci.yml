name: Customer Agent Architecture

on:
  pull_request:
    paths:
      - "functions/bookingAuthority*.js"
      - "functions/officeBookingAuthority*.js"
      - "functions/commercialSalesAuthority*.js"
      - "functions/demacCustomer*.js"
      - "functions/index.js"
      - "functions/whatsappCopilotRouter.js"
      - "functions/whatsappCopilotRouterExports.test.js"
      - "functions/bootstrap.js"
      - "functions/package.json"
      - ".github/workflows/customer-agent-ci.yml"
  push:
    branches: [main]
    paths:
      - "functions/bookingAuthority*.js"
      - "functions/officeBookingAuthority*.js"
      - "functions/commercialSalesAuthority*.js"
      - "functions/demacCustomer*.js"
      - "functions/index.js"
      - "functions/whatsappCopilotRouter.js"
      - "functions/whatsappCopilotRouterExports.test.js"
      - "functions/bootstrap.js"
      - "functions/package.json"
      - ".github/workflows/customer-agent-ci.yml"

permissions:
  contents: read

jobs:
  validate-customer-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install function dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate Firebase function syntax
        run: npm run validate:firebase

      - name: Validate core function index syntax
        run: node --check index.js

      - name: Validate Commercial Sales Authority syntax
        run: node --check commercialSalesAuthority.js

      - name: Validate Office Booking Authority syntax
        run: node --check officeBookingAuthority.js

      - name: Validate Customer Reservation Adapter syntax
        run: node --check demacCustomerReservationTools.js

      - name: Test Booking Authority
        run: npm run test:booking-authority

      - name: Test Office Booking Authority
        run: node --test officeBookingAuthority.test.js

      - name: Test Commercial Sales Authority
        run: node --test commercialSalesAuthority.test.js

      - name: Test Customer Product Reservations
        run: node --test demacCustomerReservationTools.test.js demacCustomerProductReservationRuntime.test.js

      - name: Test Customer Agent
        run: npm run test:customer-agent-tools

      - name: Assert single customer runtime router
        run: node --test whatsappCopilotRouterExports.test.js
