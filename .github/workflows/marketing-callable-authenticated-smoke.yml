name: Marketing Callable Authenticated Smoke Test

on:
  push:
    branches:
      - agent/marketing-function-gcloud-deploy
    paths:
      - '.github/workflows/marketing-callable-authenticated-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install Firebase Admin dependency
        run: npm install --prefix functions --no-audit --no-fund
      - name: Run authenticated Marketing Agent smoke test
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}
          FIREBASE_WEB_API_KEY: AIzaSyCo31zuo6d8RsgiLWGqUVOvRmHkisoF1DE
          MARKETING_CALLABLE_URL: https://us-central1-demac-corporation.cloudfunctions.net/requestMarketingImageAnalysis
        run: |
          set -euo pipefail
          cd functions
          node <<'NODE'
          const { cert, initializeApp } = require('firebase-admin/app');
          const { getAuth } = require('firebase-admin/auth');
          const { getFirestore } = require('firebase-admin/firestore');

          const credentials = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON);
          initializeApp({ credential: cert(credentials), projectId: 'demac-corporation' });
          const auth = getAuth();
          const db = getFirestore();
          const stamp = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
          const email = `marketing-smoke-${stamp}@demac-smoke.test`;
          const sessionId = `marketing-callable-smoke-${stamp}`;
          const assetId = `marketing-callable-smoke-asset-${stamp}`;
          let uid;

          async function exchangeCustomToken(customToken) {
            const response = await fetch(
              `https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=${encodeURIComponent(process.env.FIREBASE_WEB_API_KEY)}`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: customToken, returnSecureToken: true }),
              },
            );
            const text = await response.text();
            let payload = {};
            try { payload = text ? JSON.parse(text) : {}; } catch {}
            if (!response.ok || !payload.idToken) {
              throw new Error(`Could not exchange Firebase custom token (${response.status}): ${payload?.error?.message || text}`);
            }
            return payload.idToken;
          }

          async function callMarketingAgent(idToken) {
            const response = await fetch(process.env.MARKETING_CALLABLE_URL, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${idToken}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ data: { sessionId } }),
            });
            const text = await response.text();
            let payload = {};
            try { payload = text ? JSON.parse(text) : {}; } catch {}
            if (!response.ok || payload.error) {
              throw new Error(`Marketing callable failed (${response.status}): ${payload?.error?.message || text}`);
            }
            return payload.result ?? payload.data ?? payload;
          }

          (async () => {
            const userRef = () => db.collection('users').doc(uid);
            const sessionRef = db.collection('marketingUploadSessions').doc(sessionId);
            const assetRef = db.collection('marketingAssets').doc(assetId);
            try {
              const user = await auth.createUser({ email, emailVerified: true, displayName: 'Marketing smoke test' });
              uid = user.uid;
              await userRef().set({
                id: uid,
                name: 'Marketing smoke test',
                displayName: 'Marketing smoke test',
                email,
                active: true,
                role: 'admin',
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString(),
                syntheticSmokeTest: true,
              });

              const now = new Date().toISOString();
              await sessionRef.set({
                id: sessionId,
                name: 'Authenticated Marketing V1B smoke test',
                campaignType: 'other',
                status: 'ready',
                expectedAssetCount: 1,
                uploadedAssetCount: 1,
                failedAssetCount: 0,
                createdAt: now,
                updatedAt: now,
                createdByUserId: uid,
                createdByName: 'Marketing smoke test',
                syntheticSmokeTest: true,
              });
              await assetRef.set({
                id: assetId,
                sessionId,
                originalFileName: 'demac-icon-smoke-test.png',
                contentType: 'image/png',
                sizeBytes: 25762,
                storagePath: 'synthetic-smoke-test/external-source',
                downloadUrl: 'https://raw.githubusercontent.com/demac-aruba/demac-corporation/main/assets/icon.png',
                status: 'uploaded',
                createdAt: now,
                updatedAt: now,
                uploadedByUserId: uid,
                syntheticSmokeTest: true,
              });

              const customToken = await auth.createCustomToken(uid);
              const idToken = await exchangeCustomToken(customToken);
              const result = await callMarketingAgent(idToken);

              const [sessionSnapshot, assetSnapshot] = await Promise.all([sessionRef.get(), assetRef.get()]);
              const session = sessionSnapshot.data() || {};
              const asset = assetSnapshot.data() || {};

              if (session.analysisStatus !== 'completed') {
                throw new Error(`Session analysisStatus=${session.analysisStatus || 'missing'}; error=${session.analysisError || 'none'}`);
              }
              if (asset.analysisStatus !== 'completed') {
                throw new Error(`Asset analysisStatus=${asset.analysisStatus || 'missing'}; error=${asset.analysisError || 'none'}`);
              }
              for (const field of ['qualityScore', 'marketingSuitabilityScore', 'rankingScore']) {
                if (!Number.isFinite(asset[field])) throw new Error(`Asset ${field} was not persisted.`);
              }
              if (asset.rank !== 1) throw new Error(`Asset rank=${asset.rank}; expected 1.`);
              if (session.primaryAssetId !== assetId) throw new Error('Session primaryAssetId does not match the analyzed asset.');
              if (!Array.isArray(session.bestAssetIds) || !session.bestAssetIds.includes(assetId)) {
                throw new Error('Session bestAssetIds does not include the analyzed asset.');
              }

              console.log('Authenticated Marketing Agent smoke test PASSED:', JSON.stringify({
                callableResult: result,
                analysisStatus: session.analysisStatus,
                analyzedAssetCount: session.analyzedAssetCount,
                qualityScore: asset.qualityScore,
                marketingSuitabilityScore: asset.marketingSuitabilityScore,
                rankingScore: asset.rankingScore,
                rank: asset.rank,
                recommendedCampaignType: asset.recommendedCampaignType,
                doNotUse: Boolean(asset.doNotUse),
              }));
            } finally {
              await Promise.allSettled([
                assetRef.delete(),
                sessionRef.delete(),
                uid ? userRef().delete() : Promise.resolve(),
                uid ? auth.deleteUser(uid) : Promise.resolve(),
              ]);
              console.log('Synthetic Firebase Auth user and Firestore smoke-test documents cleaned up.');
            }
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
