name: Marketing Creative V2 Production Smoke

on:
  push:
    branches:
      - test/marketing-creative-v2-production-smoke
    paths:
      - '.github/workflows/marketing-creative-v2-production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  creative-v2-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --prefix functions --no-audit --no-fund
      - name: Run authenticated V2 production smoke
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}
          FIREBASE_WEB_API_KEY: AIzaSyCo31zuo6d8RsgiLWGqUVOvRmHkisoF1DE
          CREATIVE_URL: https://us-central1-demac-corporation.cloudfunctions.net/requestMarketingCreativeBuild
          READ_URL: https://us-central1-demac-corporation.cloudfunctions.net/getMarketingCreativeState
        run: |
          set -euo pipefail
          cd functions
          node <<'NODE'
          const { randomUUID } = require('node:crypto');
          const { cert, initializeApp } = require('firebase-admin/app');
          const { getAuth } = require('firebase-admin/auth');
          const { getFirestore } = require('firebase-admin/firestore');
          const { getStorage } = require('firebase-admin/storage');
          const sharp = require('sharp');

          const credentials = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON);
          initializeApp({ credential: cert(credentials), projectId: 'demac-corporation', storageBucket: 'demac-corporation.firebasestorage.app' });
          const auth = getAuth();
          const db = getFirestore();
          const bucket = getStorage().bucket();
          const stamp = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
          const email = `marketing-v2-smoke-${stamp}@demac-smoke.test`;
          const sessionId = `marketing-v2-smoke-${stamp}`;
          const assetId = `marketing-v2-hero-${stamp}`;
          const originalPath = `marketing/originals/${sessionId}/synthetic-hvac.png`;
          let uid;

          async function exchangeCustomToken(customToken) {
            const response = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithCustomToken?key=${encodeURIComponent(process.env.FIREBASE_WEB_API_KEY)}`, {
              method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: customToken, returnSecureToken: true }),
            });
            const payload = await response.json();
            if (!response.ok || !payload.idToken) throw new Error(`Token exchange failed: ${JSON.stringify(payload)}`);
            return payload.idToken;
          }

          async function call(url, idToken, data) {
            const response = await fetch(url, {
              method: 'POST', headers: { Authorization: `Bearer ${idToken}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ data }),
            });
            const text = await response.text();
            let payload = {};
            try { payload = text ? JSON.parse(text) : {}; } catch {}
            if (!response.ok || payload.error) throw new Error(`Callable failed (${response.status}): ${payload?.error?.message || text}`);
            return payload.result ?? payload.data ?? payload;
          }

          async function makeSyntheticHvac() {
            const base = await sharp({ create: { width: 1024, height: 1024, channels: 4, background: { r: 234, g: 240, b: 244, alpha: 1 } } }).png().toBuffer();
            const svg = Buffer.from(`<svg width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
              <defs><linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef3f5"/><stop offset="1" stop-color="#cbd7dc"/></linearGradient></defs>
              <rect width="1024" height="1024" fill="url(#wall)"/>
              <rect x="0" y="690" width="1024" height="334" fill="#9db684"/>
              <rect x="90" y="100" width="844" height="590" rx="10" fill="#f6f7f2"/>
              <rect x="580" y="175" width="255" height="300" fill="#8bb3c5"/><rect x="598" y="193" width="219" height="264" fill="#aecbd8"/>
              <rect x="305" y="520" width="390" height="250" rx="20" fill="#f8fafb" stroke="#83919b" stroke-width="12"/>
              <circle cx="500" cy="645" r="90" fill="#d8e0e5" stroke="#7f8d97" stroke-width="10"/>
              <circle cx="500" cy="645" r="65" fill="none" stroke="#85949e" stroke-width="6"/>
              <g stroke="#8797a1" stroke-width="7"><line x1="500" y1="580" x2="500" y2="710"/><line x1="435" y1="645" x2="565" y2="645"/><line x1="455" y1="600" x2="545" y2="690"/><line x1="545" y1="600" x2="455" y2="690"/></g>
              <rect x="345" y="755" width="60" height="45" fill="#56636c"/><rect x="595" y="755" width="60" height="45" fill="#56636c"/>
              <path d="M690 590 C780 555 835 500 875 410" fill="none" stroke="#e5e9eb" stroke-width="22"/><path d="M690 590 C780 555 835 500 875 410" fill="none" stroke="#b5c4cb" stroke-width="4"/>
              <g fill="#4f7f45"><ellipse cx="170" cy="795" rx="75" ry="20" transform="rotate(-22 170 795)"/><ellipse cx="220" cy="835" rx="90" ry="24" transform="rotate(12 220 835)"/><ellipse cx="790" cy="830" rx="95" ry="24" transform="rotate(-14 790 830)"/><ellipse cx="845" cy="775" rx="70" ry="19" transform="rotate(18 845 775)"/></g>
            </svg>`);
            return sharp(base).composite([{ input: svg }]).png().toBuffer();
          }

          (async () => {
            const sessionRef = db.collection('marketingUploadSessions').doc(sessionId);
            const campaignRef = db.collection('marketingCampaigns').doc(sessionId);
            const assetRef = db.collection('marketingAssets').doc(assetId);
            const userRef = () => db.collection('users').doc(uid);
            try {
              const brand = await db.collection('marketingBrandSettings').doc('default').get();
              if (!brand.exists) throw new Error('Live Brand Center default is missing; smoke will not overwrite it.');

              const user = await auth.createUser({ email, emailVerified: true, displayName: 'Marketing Creative V2 smoke' });
              uid = user.uid;
              const now = new Date().toISOString();
              await userRef().set({ id: uid, name: 'Marketing Creative V2 smoke', displayName: 'Marketing Creative V2 smoke', email, active: true, role: 'admin', createdAt: now, updatedAt: now, syntheticSmokeTest: true });

              const image = await makeSyntheticHvac();
              const token = randomUUID();
              await bucket.file(originalPath).save(image, { resumable: false, contentType: 'image/png', metadata: { metadata: { firebaseStorageDownloadTokens: token, syntheticSmokeTest: 'true' } } });
              const downloadUrl = `https://firebasestorage.googleapis.com/v0/b/${encodeURIComponent(bucket.name)}/o/${encodeURIComponent(originalPath)}?alt=media&token=${encodeURIComponent(token)}`;

              await sessionRef.set({
                id: sessionId, name: 'Creative V2 production smoke', campaignType: 'installation', status: 'ready', expectedAssetCount: 1, uploadedAssetCount: 1, failedAssetCount: 0,
                analysisStatus: 'completed', analyzedAssetCount: 1, usableAssetCount: 1, primaryAssetId: assetId, bestAssetIds: [assetId], recommendedCampaignType: 'installation',
                campaignStrategyStatus: 'completed', campaignStrategyId: sessionId, createdAt: now, updatedAt: now, createdByUserId: uid, createdByName: 'Marketing Creative V2 smoke', syntheticSmokeTest: true,
              });
              await assetRef.set({
                id: assetId, sessionId, originalFileName: 'synthetic-hvac.png', contentType: 'image/png', sizeBytes: image.length, storagePath: originalPath, downloadUrl,
                status: 'uploaded', analysisStatus: 'completed', rank: 1, rankingScore: 94, marketingSuitabilityScore: 95, qualityScore: 91, brandSafetyScore: 100,
                shotType: 'completed_outdoor_installation', recommendedCampaignType: 'installation', strengths: ['Clear installed condenser', 'Completed residential HVAC installation', 'Clean outdoor environment'], issues: [],
                recommendedUse: 'Use as authentic-looking installation hero for synthetic test.', analysisSummary: 'A clean completed residential outdoor HVAC condenser installation against a light wall with landscaping and a visible window. No people and no sensitive information.',
                containsPerson: false, containsReadableSensitiveData: false, doNotUse: false, createdAt: now, updatedAt: now, uploadedByUserId: uid, syntheticSmokeTest: true,
              });
              await campaignRef.set({
                id: sessionId, sessionId, status: 'strategy_completed', campaignType: 'installation', objective: 'Generate WhatsApp inquiries by presenting a clean completed air-conditioning installation as proof of professional DEMAC workmanship.',
                angle: 'Real completed installation, premium cooling comfort and professional workmanship.', targetAction: 'WhatsApp inquiry', heroAssetId: assetId, supportingAssetIds: [],
                copy: { language: 'pap_aw', headline: 'Instala bo Airco Nobo', subheadline: 'Trabou profesional cu cuidado pa detaye.', primaryText: 'Confia riba DEMAC pa instala bo airco cu trabou limpi y profesional. WhatsApp nos awe mes.', cta: 'WhatsApp nos awe mes' },
                visualDirection: { heroTreatment: 'Make the real installed condenser the proof-of-work hero while creating a premium cooling advertising composition.', hierarchy: ['real installation', 'headline', 'CTA'], overlayNotes: ['Premium royal-blue and white commercial treatment', 'Keep equipment visible'], footerInstruction: 'Reserve blank bottom area for original DEMAC footer.' },
                factPolicy: { priceOrPromoIncluded: false, factNotes: ['No active promotion'] }, papiamentoValidationStatus: 'passed', papiamentoUnknownWords: [], papiamentoForbiddenWords: [], papiamentoRevisionAttempted: false,
                createdAt: now, updatedAt: now, syntheticSmokeTest: true,
              });

              const idToken = await exchangeCustomToken(await auth.createCustomToken(uid));
              console.log('Calling production Creative Builder V2; this may take several minutes...');
              const result = await call(process.env.CREATIVE_URL, idToken, { sessionId });
              const creativeSnap = await db.collection('marketingCreatives').doc(result.creativeId).get();
              if (!creativeSnap.exists) throw new Error('Creative record missing after callable result.');
              const creative = creativeSnap.data();
              const variants = Array.isArray(creative.variants) ? creative.variants : [];

              if (creative.builderVersion !== 'V2') throw new Error(`builderVersion=${creative.builderVersion}`);
              if (creative.renderMode !== 'ai_multivariant_v2') throw new Error(`renderMode=${creative.renderMode}`);
              if (creative.artDirectorModel !== 'gpt-5.6-sol') throw new Error(`artDirectorModel=${creative.artDirectorModel}`);
              if (creative.imageModel !== 'gpt-image-2') throw new Error(`imageModel=${creative.imageModel}`);
              if (creative.qaModel !== 'gpt-5.6-sol') throw new Error(`qaModel=${creative.qaModel}`);
              if (variants.length < 3) throw new Error(`Expected >=3 variants, got ${variants.length}`);
              for (const required of ['premium_clean', 'sales_impact', 'social_proof']) {
                if (!variants.some((variant) => variant.conceptId === required)) throw new Error(`Missing base concept ${required}`);
              }
              if (variants.some((variant) => variant.imageModel !== 'gpt-image-2')) throw new Error('At least one variant did not use gpt-image-2.');
              if (!creative.selectedVariantId || !variants.some((variant) => variant.id === creative.selectedVariantId)) throw new Error('Selected variant missing.');
              if (!creative.qa || typeof creative.qa.creativeQuality !== 'number' || typeof creative.qa.agencyFeel !== 'number' || typeof creative.qa.scrollStoppingPower !== 'number' || typeof creative.qa.photoIntegration !== 'number') throw new Error('Strict V2 QA metrics missing.');

              const imageResponse = await fetch(creative.imageUrl);
              if (!imageResponse.ok) throw new Error(`Selected image download failed: ${imageResponse.status}`);
              const selectedBuffer = Buffer.from(await imageResponse.arrayBuffer());
              const metadata = await sharp(selectedBuffer).metadata();
              if (metadata.width !== 1080 || metadata.height !== 1080) throw new Error(`Unexpected PNG dimensions ${metadata.width}x${metadata.height}`);
              const footerBuffer = await sharp(selectedBuffer).extract({ left: 0, top: 1080 - 156, width: 1080, height: 156 }).png().toBuffer();
              const stats = await sharp(footerBuffer).stats();
              const rgb = stats.channels.slice(0, 3).map((channel) => channel.mean);
              if (rgb.some((value) => value < 250)) throw new Error(`Footer is not clean white: ${rgb.join(',')}`);

              const readState = await call(process.env.READ_URL, idToken, { sessionId });
              if (!Array.isArray(readState.creatives) || !readState.creatives.some((item) => item.id === creativeSnap.id)) throw new Error('Authenticated creative read did not return V2 creative.');
              const sessionAfter = (await sessionRef.get()).data() || {};
              if (!['qa_passed', 'qa_failed'].includes(sessionAfter.creativeStatus)) throw new Error(`Unexpected session creativeStatus=${sessionAfter.creativeStatus}`);
              if (Number(sessionAfter.creativeProgress?.percent) !== 100) throw new Error(`Progress did not reach 100: ${JSON.stringify(sessionAfter.creativeProgress)}`);

              console.log('CREATIVE_V2_PRODUCTION_SMOKE_PASS', JSON.stringify({
                builderVersion: creative.builderVersion,
                artDirectorModel: creative.artDirectorModel,
                imageModel: creative.imageModel,
                qaModel: creative.qaModel,
                variantIds: variants.map((variant) => variant.id),
                selectedVariantId: creative.selectedVariantId,
                selectedStatus: creative.qa.status,
                qa: {
                  overall: creative.qa.score,
                  creativeQuality: creative.qa.creativeQuality,
                  agencyFeel: creative.qa.agencyFeel,
                  scrollStoppingPower: creative.qa.scrollStoppingPower,
                  photoIntegration: creative.qa.photoIntegration,
                  ctaProminence: creative.qa.ctaProminence,
                },
                dimensions: `${metadata.width}x${metadata.height}`,
                footerRgb: rgb.map((value) => Number(value.toFixed(2))),
                progress: sessionAfter.creativeProgress,
                autoRevised: creative.autoRevised,
              }));
            } finally {
              const creatives = await db.collection('marketingCreatives').where('sessionId', '==', sessionId).get().catch(() => null);
              if (creatives) await Promise.allSettled(creatives.docs.map((doc) => doc.ref.delete()));
              await Promise.allSettled([campaignRef.delete(), sessionRef.delete(), assetRef.delete(), uid ? userRef().delete() : Promise.resolve(), uid ? auth.deleteUser(uid) : Promise.resolve()]);
              const [generatedFiles] = await bucket.getFiles({ prefix: `marketing/generated/${sessionId}/` }).catch(() => [[]]);
              await Promise.allSettled((generatedFiles || []).map((file) => file.delete()));
              await bucket.file(originalPath).delete({ ignoreNotFound: true }).catch(() => undefined);
              console.log('Synthetic V2 smoke data cleaned up.');
            }
          })().catch((error) => { console.error(error); process.exitCode = 1; });
          NODE
