name: Marketing Callable Preview Deploy

on:
  push:
    branches:
      - agent/marketing-function-gcloud-deploy
    paths:
      - 'functions/marketingImageAnalysis.js'
      - 'functions/marketingImageAnalysisCallable.js'
      - 'functions/bootstrap.js'
      - '.github/workflows/marketing-callable-preview-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-callable:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install function dependencies
        run: npm install --prefix functions --no-audit --no-fund
      - name: Validate callable export
        run: |
          node --check functions/marketingImageAnalysis.js
          node --check functions/marketingImageAnalysisCallable.js
          node --check functions/bootstrap.js
          node -e "const mod=require('./functions/bootstrap'); if(typeof mod.requestMarketingImageAnalysis!=='function') throw new Error('requestMarketingImageAnalysis export missing');"
      - name: Authenticate Firebase deployment service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Resolve DEMAC runtime identity
        id: config
        shell: bash
        run: |
          set -euo pipefail
          RUN_SA="$(gcloud functions describe generateProfessionalCustomerReport --project=demac-corporation --gen2 --region=us-central1 --format='value(serviceConfig.serviceAccountEmail)')"
          if [ -z "$RUN_SA" ]; then
            echo '::error::Could not resolve DEMAC runtime service account.'
            exit 1
          fi
          echo "run_service_account=${RUN_SA}" >> "$GITHUB_OUTPUT"
      - name: Deploy callable for smoke test
        shell: bash
        env:
          RUN_SERVICE_ACCOUNT: ${{ steps.config.outputs.run_service_account }}
        run: |
          set -euo pipefail
          gcloud functions deploy requestMarketingImageAnalysis \
            --project=demac-corporation \
            --gen2 \
            --region=us-central1 \
            --runtime=nodejs22 \
            --source=functions \
            --entry-point=requestMarketingImageAnalysis \
            --memory=512Mi \
            --timeout=540s \
            --run-service-account="$RUN_SERVICE_ACCOUNT" \
            --set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest \
            --trigger-http \
            --allow-unauthenticated \
            --quiet
      - name: Verify callable endpoint rejects unauthenticated requests
        shell: bash
        run: |
          set -euo pipefail
          URI="$(gcloud functions describe requestMarketingImageAnalysis --project=demac-corporation --gen2 --region=us-central1 --format='value(serviceConfig.uri)')"
          STATE="$(gcloud functions describe requestMarketingImageAnalysis --project=demac-corporation --gen2 --region=us-central1 --format='value(state)')"
          if [ "$STATE" != "ACTIVE" ] || [ -z "$URI" ]; then
            echo '::error::Callable function is not active.'
            exit 1
          fi
          BODY_FILE="$RUNNER_TEMP/marketing-callable-response.json"
          CODE="$(curl -sS -o "$BODY_FILE" -w '%{http_code}' -X POST "$URI" -H 'Content-Type: application/json' --data '{"data":{"sessionId":"unauthenticated-smoke"}}')"
          cat "$BODY_FILE"
          if [ "$CODE" = "200" ]; then
            if ! grep -qiE 'unauthenticated|sign in' "$BODY_FILE"; then
              echo '::error::Callable accepted unauthenticated request unexpectedly.'
              exit 1
            fi
          elif [ "$CODE" != "401" ] && [ "$CODE" != "403" ]; then
            echo "::error::Unexpected callable HTTP status $CODE"
            exit 1
          fi
          echo "Callable is ACTIVE at $URI and rejects unauthenticated access."
