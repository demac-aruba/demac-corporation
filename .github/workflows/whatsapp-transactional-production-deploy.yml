name: Transactional WhatsApp Production

on:
  pull_request:
    paths:
      - 'functions/whatsappTransactionalService.js'
      - 'functions/whatsappTransactionalService.test.js'
      - 'functions/whatsappTransactionalGroupRecipient.test.js'
      - 'functions/operatingCalendarService.js'
      - 'functions/operatingCalendarService.test.js'
      - 'functions/appointmentCommunicationRenderer.js'
      - 'functions/appointmentCommunicationRenderer.test.js'
      - 'functions/appointmentNotificationService.js'
      - 'functions/appointmentNotificationService.test.js'
      - 'functions/appointmentCommunicationAuthority.js'
      - 'functions/appointmentCommunicationAuthority.test.js'
      - 'functions/appointmentNotifications.js'
      - 'functions/technicianDailyScheduleService.js'
      - 'functions/technicianDailyScheduleService.test.js'
      - 'functions/technicianDailyScheduleRunner.js'
      - 'functions/technicianDailyScheduleRunner.test.js'
      - 'functions/technicianDailySchedules.js'
      - 'functions/vanScheduleDeliveryConfig.js'
      - 'functions/vanScheduleCommunicationAuthority.js'
      - 'functions/vanScheduleCommunicationAuthority.test.js'
      - 'functions/bookingVanIdentity.js'
      - 'functions/bookingVanIdentity.test.js'
      - 'functions/bookingSchedulingPrimitives.js'
      - 'functions/officeBookingAuthority.js'
      - 'functions/officeBookingAuthorityFacade.js'
      - 'functions/officeBookingAuthorityCommunication.test.js'
      - 'functions/bootstrap.js'
      - 'functions/package.json'
      - 'functions/package-lock.json'
      - 'firebase.json'
      - '.github/workflows/whatsapp-transactional-production-deploy.yml'
  push:
    branches:
      - main
    paths:
      - 'functions/whatsappTransactionalService.js'
      - 'functions/whatsappTransactionalService.test.js'
      - 'functions/whatsappTransactionalGroupRecipient.test.js'
      - 'functions/operatingCalendarService.js'
      - 'functions/operatingCalendarService.test.js'
      - 'functions/appointmentCommunicationRenderer.js'
      - 'functions/appointmentCommunicationRenderer.test.js'
      - 'functions/appointmentNotificationService.js'
      - 'functions/appointmentNotificationService.test.js'
      - 'functions/appointmentCommunicationAuthority.js'
      - 'functions/appointmentCommunicationAuthority.test.js'
      - 'functions/appointmentNotifications.js'
      - 'functions/technicianDailyScheduleService.js'
      - 'functions/technicianDailyScheduleService.test.js'
      - 'functions/technicianDailyScheduleRunner.js'
      - 'functions/technicianDailyScheduleRunner.test.js'
      - 'functions/technicianDailySchedules.js'
      - 'functions/vanScheduleDeliveryConfig.js'
      - 'functions/vanScheduleCommunicationAuthority.js'
      - 'functions/vanScheduleCommunicationAuthority.test.js'
      - 'functions/bookingVanIdentity.js'
      - 'functions/bookingVanIdentity.test.js'
      - 'functions/bookingSchedulingPrimitives.js'
      - 'functions/officeBookingAuthority.js'
      - 'functions/officeBookingAuthorityFacade.js'
      - 'functions/officeBookingAuthorityCommunication.test.js'
      - 'functions/bootstrap.js'
      - 'functions/package.json'
      - 'functions/package-lock.json'
      - 'firebase.json'
      - '.github/workflows/whatsapp-transactional-production-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transactional-whatsapp-production
  cancel-in-progress: false

jobs:
  validate-transactional-whatsapp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install function dependencies
        run: npm install --prefix functions --no-audit --no-fund

      - name: Validate transactional WhatsApp producer boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/bootstrap.js
          node --check functions/whatsappTransactionalService.js
          node --check functions/operatingCalendarService.js
          node --check functions/appointmentCommunicationRenderer.js
          node --check functions/appointmentNotificationService.js
          node --check functions/appointmentCommunicationAuthority.js
          node --check functions/appointmentNotifications.js
          node --check functions/technicianDailyScheduleService.js
          node --check functions/technicianDailyScheduleRunner.js
          node --check functions/technicianDailySchedules.js
          node --check functions/vanScheduleDeliveryConfig.js
          node --check functions/vanScheduleCommunicationAuthority.js
          node --check functions/bookingVanIdentity.js
          node --check functions/bookingSchedulingPrimitives.js
          node --check functions/officeBookingAuthorityFacade.js
          node --check functions/officeBookingAuthority.js

          node --test \
            functions/whatsappTransactionalService.test.js \
            functions/whatsappTransactionalGroupRecipient.test.js \
            functions/operatingCalendarService.test.js \
            functions/appointmentCommunicationRenderer.test.js \
            functions/appointmentNotificationService.test.js \
            functions/appointmentCommunicationAuthority.test.js \
            functions/technicianDailyScheduleRunner.test.js \
            functions/technicianDailyScheduleService.test.js \
            functions/vanScheduleCommunicationAuthority.test.js \
            functions/bookingVanIdentity.test.js \
            functions/officeBookingAuthorityCommunication.test.js

          node - <<'NODE'
          const mod = require('./functions/bootstrap');
          for (const name of [
            'queueAppointmentConfirmation',
            'sendDailyAppointmentReminders',
            'sendDailyTechnicianSchedules',
          ]) {
            if (typeof mod[name] !== 'function') throw new Error(`${name} export missing`);
          }
          const config = require('./functions/vanScheduleDeliveryConfig');
          for (const key of ['VAN_SCHEDULE_FUNCTION_NAME', 'VAN_SCHEDULE_REGION', 'VAN_SCHEDULE_TIME_ZONE', 'VAN_SCHEDULE_CRON', 'VAN_SCHEDULE_SCHEDULER_JOB']) {
            if (!String(config[key] || '').trim()) throw new Error(`${key} is missing`);
          }
          NODE

  deploy-transactional-whatsapp:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-transactional-whatsapp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install function dependencies
        run: npm install --prefix functions --no-audit --no-fund

      - name: Authenticate Firebase deployment service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve canonical Van schedule deployment configuration
        id: schedule
        shell: bash
        run: |
          set -euo pipefail
          echo "function=$(node -p \"require('./functions/vanScheduleDeliveryConfig').VAN_SCHEDULE_FUNCTION_NAME\")" >> "$GITHUB_OUTPUT"
          echo "region=$(node -p \"require('./functions/vanScheduleDeliveryConfig').VAN_SCHEDULE_REGION\")" >> "$GITHUB_OUTPUT"
          echo "timezone=$(node -p \"require('./functions/vanScheduleDeliveryConfig').VAN_SCHEDULE_TIME_ZONE\")" >> "$GITHUB_OUTPUT"
          echo "cron=$(node -p \"require('./functions/vanScheduleDeliveryConfig').VAN_SCHEDULE_CRON\")" >> "$GITHUB_OUTPUT"
          echo "job=$(node -p \"require('./functions/vanScheduleDeliveryConfig').VAN_SCHEDULE_SCHEDULER_JOB\")" >> "$GITHUB_OUTPUT"

      - name: Preflight Cloud Scheduler access
        shell: bash
        run: |
          set -euo pipefail
          principal="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n 1)"
          region='${{ steps.schedule.outputs.region }}'
          job='${{ steps.schedule.outputs.job }}'
          if [ -z "$principal" ]; then
            echo '::error::No active Google Cloud deployment principal is available.'
            exit 1
          fi

          if ! gcloud scheduler jobs list \
            --project=demac-corporation \
            --location="$region" \
            --limit=1 \
            --format='value(name)' >/dev/null; then
            echo "::error::Deployment principal ${principal} cannot list Cloud Scheduler jobs. Refusing to deploy a scheduled function because Scheduler state cannot be governed or verified. Grant the deployment identity Cloud Scheduler management permissions (the predefined roles/cloudscheduler.admin role or an approved equivalent custom role)."
            exit 1
          fi

          describe_error="$(mktemp)"
          if gcloud scheduler jobs describe "$job" \
            --project=demac-corporation \
            --location="$region" \
            --format='value(name)' >/dev/null 2>"$describe_error"; then
            echo "Existing Scheduler job is readable by ${principal}: ${job}"
          elif grep -Eqi 'NOT_FOUND|not found|does not exist' "$describe_error"; then
            echo "Canonical Scheduler job does not currently exist; Firebase deployment will be responsible for creating ${job}."
          else
            cat "$describe_error" >&2
            rm -f "$describe_error"
            echo "::error::Deployment principal ${principal} cannot read the canonical Scheduler job. Refusing to deploy."
            exit 1
          fi
          rm -f "$describe_error"
          echo "Cloud Scheduler preflight passed for ${principal}."

      - name: Deploy notification producers only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@15.2.1 deploy \
            --only functions:queueAppointmentConfirmation,functions:sendDailyAppointmentReminders,functions:${{ steps.schedule.outputs.function }} \
            --project demac-corporation \
            --non-interactive \
            --force

      - name: Verify deployed notification producers
        shell: bash
        run: |
          set -euo pipefail
          verify_active() {
            local name="$1"
            local state
            state="$(gcloud functions describe "$name" --project=demac-corporation --gen2 --region='${{ steps.schedule.outputs.region }}' --format='value(state)')"
            if [ "$state" != 'ACTIVE' ]; then
              echo "::error::${name} state is ${state:-unknown}; expected ACTIVE."
              exit 1
            fi
            echo "${name}: ACTIVE"
          }

          verify_event() {
            local name="$1" expected_event="$2"
            local event_type
            verify_active "$name"
            event_type="$(gcloud functions describe "$name" --project=demac-corporation --gen2 --region='${{ steps.schedule.outputs.region }}' --format='value(eventTrigger.eventType)')"
            if [ "$event_type" != "$expected_event" ]; then
              echo "::error::${name} event type is ${event_type:-missing}; expected ${expected_event}."
              exit 1
            fi
          }

          verify_event queueAppointmentConfirmation google.cloud.firestore.document.v1.written
          verify_active sendDailyAppointmentReminders
          verify_active '${{ steps.schedule.outputs.function }}'

      - name: Verify canonical Cloud Scheduler job
        shell: bash
        run: |
          set -euo pipefail
          job='${{ steps.schedule.outputs.job }}'
          region='${{ steps.schedule.outputs.region }}'
          expected_cron='${{ steps.schedule.outputs.cron }}'
          expected_timezone='${{ steps.schedule.outputs.timezone }}'

          state="$(gcloud scheduler jobs describe "$job" --project=demac-corporation --location="$region" --format='value(state)')"
          schedule="$(gcloud scheduler jobs describe "$job" --project=demac-corporation --location="$region" --format='value(schedule)')"
          timezone="$(gcloud scheduler jobs describe "$job" --project=demac-corporation --location="$region" --format='value(timeZone)')"
          target_uri="$(gcloud scheduler jobs describe "$job" --project=demac-corporation --location="$region" --format='value(httpTarget.uri)')"
          invoker="$(gcloud scheduler jobs describe "$job" --project=demac-corporation --location="$region" --format='value(httpTarget.oidcToken.serviceAccountEmail)')"

          if [ "$state" != 'ENABLED' ]; then
            echo "::error::${job} state is ${state:-unknown}; expected ENABLED. A paused Scheduler job is not resumed implicitly by deployment."
            exit 1
          fi
          if [ "$schedule" != "$expected_cron" ]; then
            echo "::error::${job} schedule is ${schedule:-missing}; expected ${expected_cron}."
            exit 1
          fi
          if [ "$timezone" != "$expected_timezone" ]; then
            echo "::error::${job} timezone is ${timezone:-missing}; expected ${expected_timezone}."
            exit 1
          fi
          if [ -z "$target_uri" ] || [ -z "$invoker" ]; then
            echo "::error::${job} is missing its HTTP target or OIDC invoker identity."
            exit 1
          fi
          echo "${job}: ENABLED · ${schedule} · ${timezone} · invoker=${invoker}"
