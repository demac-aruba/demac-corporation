name: Transactional WhatsApp Production

on:
  pull_request:
    paths:
      - 'functions/whatsappTransactionalService.js'
      - 'functions/whatsappTransactionalService.test.js'
      - 'functions/whatsappTransactionalGroupRecipient.test.js'
      - 'functions/demacCommunicationIdentity.js'
      - 'functions/migrations/migrateLegacyMetaTransactionalQueueToWacli.js'
      - 'functions/migrations/migrateLegacyMetaTransactionalQueueToWacli.test.js'
      - 'functions/migrations/realignVanScheduleGroups.js'
      - 'functions/migrations/realignVanScheduleGroups.test.js'
      - 'functions/whatsappWacliGateway.js'
      - 'functions/operatingCalendarService.js'
      - 'functions/operatingCalendarService.test.js'
      - 'functions/appointmentCommunicationRenderer.js'
      - 'functions/appointmentCommunicationRenderer.test.js'
      - 'functions/appointmentNotificationService.js'
      - 'functions/appointmentNotificationService.test.js'
      - 'functions/appointmentCommunicationAuthority.js'
      - 'functions/appointmentCommunicationAuthority.test.js'
      - 'functions/appointmentNotifications.js'
      - 'functions/technicianDailyScheduleService.js'
      - 'functions/technicianDailyScheduleService.test.js'
      - 'functions/technicianDailySchedules.js'
      - 'functions/vanScheduleCommunicationAuthority.js'
      - 'functions/vanScheduleCommunicationAuthority.test.js'
      - 'functions/officeBookingAuthority.js'
      - 'functions/officeBookingAuthorityFacade.js'
      - 'functions/officeBookingAuthorityCommunication.test.js'
      - 'functions/bootstrap.js'
      - 'functions/package.json'
      - '.github/workflows/whatsapp-transactional-production-deploy.yml'
  push:
    branches:
      - main
    paths:
      - 'functions/whatsappTransactionalService.js'
      - 'functions/whatsappTransactionalService.test.js'
      - 'functions/whatsappTransactionalGroupRecipient.test.js'
      - 'functions/demacCommunicationIdentity.js'
      - 'functions/migrations/migrateLegacyMetaTransactionalQueueToWacli.js'
      - 'functions/migrations/migrateLegacyMetaTransactionalQueueToWacli.test.js'
      - 'functions/migrations/realignVanScheduleGroups.js'
      - 'functions/migrations/realignVanScheduleGroups.test.js'
      - 'functions/whatsappWacliGateway.js'
      - 'functions/operatingCalendarService.js'
      - 'functions/operatingCalendarService.test.js'
      - 'functions/appointmentCommunicationRenderer.js'
      - 'functions/appointmentCommunicationRenderer.test.js'
      - 'functions/appointmentNotificationService.js'
      - 'functions/appointmentNotificationService.test.js'
      - 'functions/appointmentCommunicationAuthority.js'
      - 'functions/appointmentCommunicationAuthority.test.js'
      - 'functions/appointmentNotifications.js'
      - 'functions/technicianDailyScheduleService.js'
      - 'functions/technicianDailyScheduleService.test.js'
      - 'functions/technicianDailySchedules.js'
      - 'functions/vanScheduleCommunicationAuthority.js'
      - 'functions/vanScheduleCommunicationAuthority.test.js'
      - 'functions/officeBookingAuthority.js'
      - 'functions/officeBookingAuthorityFacade.js'
      - 'functions/officeBookingAuthorityCommunication.test.js'
      - 'functions/bootstrap.js'
      - 'functions/package.json'
  workflow_dispatch:
    inputs:
      deploy_to_production:
        description: 'Explicitly authorize the guarded production deployment path'
        required: true
        type: boolean
        default: false
      confirmation:
        description: 'Type DEPLOY_TRANSACTIONAL_WHATSAPP exactly when deploy_to_production=true'
        required: false
        type: string
        default: ''
      expected_sha:
        description: 'Exact commit SHA selected for the controlled deployment'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: transactional-whatsapp-production
  cancel-in-progress: false

jobs:
  validate-transactional-whatsapp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install function dependencies
        run: npm install --prefix functions --no-audit --no-fund

      - name: Validate transactional WhatsApp boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/bootstrap.js
          node --check functions/whatsappTransactionalService.js
          node --check functions/demacCommunicationIdentity.js
          node --check functions/migrations/migrateLegacyMetaTransactionalQueueToWacli.js
          node --check functions/migrations/realignVanScheduleGroups.js
          node --check functions/whatsappWacliGateway.js
          node --check functions/operatingCalendarService.js
          node --check functions/appointmentCommunicationRenderer.js
          node --check functions/appointmentNotificationService.js
          node --check functions/appointmentCommunicationAuthority.js
          node --check functions/appointmentNotifications.js
          node --check functions/technicianDailyScheduleService.js
          node --check functions/technicianDailySchedules.js
          node --check functions/vanScheduleCommunicationAuthority.js
          node --check functions/officeBookingAuthorityFacade.js
          node --check functions/officeBookingAuthority.js
          npm run test:transactional-whatsapp --prefix functions
          node - <<'NODE'
          const mod = require('./functions/bootstrap');
          for (const name of [
            'wacliOutboundPoll',
            'wacliOutboundAck',
            'queueAppointmentConfirmation',
            'sendDailyAppointmentReminders',
            'sendDailyTechnicianSchedules',
          ]) {
            if (typeof mod[name] !== 'function') throw new Error(`${name} export missing`);
          }
          NODE

  deploy-transactional-whatsapp:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-transactional-whatsapp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install function dependencies
        run: npm install --prefix functions --no-audit --no-fund

      - name: Authenticate Firebase deployment service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy notification producers only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@15.2.1 deploy \
            --only functions:queueAppointmentConfirmation,functions:sendDailyAppointmentReminders,functions:sendDailyTechnicianSchedules \
            --project demac-corporation \
            --non-interactive \
            --force

      - name: Migrate legacy queued transactional messages to active wacli transport
        shell: bash
        env:
          GCLOUD_PROJECT: demac-corporation
          GOOGLE_CLOUD_PROJECT: demac-corporation
        run: |
          set -euo pipefail
          migration_output="$(node functions/migrations/migrateLegacyMetaTransactionalQueueToWacli.js)"
          echo "$migration_output"
          node - "$migration_output" <<'NODE'
          const payload = JSON.parse(process.argv[2]);
          if (payload.activeProvider !== 'wacli') {
            throw new Error(`Transactional provider is ${payload.activeProvider || 'unknown'}; production is expected to use wacli in this rollout.`);
          }
          console.log(`Legacy queue migration: scanned=${payload.scanned}, migrated=${payload.migrated}, skipped=${payload.skipped}`);
          NODE

      - name: Realign canonical Van WhatsApp group mappings
        shell: bash
        env:
          GCLOUD_PROJECT: demac-corporation
          GOOGLE_CLOUD_PROJECT: demac-corporation
        run: |
          set -euo pipefail
          node functions/migrations/realignVanScheduleGroups.js

      - name: Verify deployed notification producers and 8 AM scheduler
        shell: bash
        run: |
          set -euo pipefail
          verify_active() {
            local name="$1"
            local state
            state="$(gcloud functions describe "$name" --project=demac-corporation --gen2 --region=us-central1 --format='value(state)')"
            if [ "$state" != 'ACTIVE' ]; then
              echo "::error::${name} state is ${state:-unknown}."
              exit 1
            fi
            echo "${name}: ACTIVE"
          }

          verify_event() {
            local name="$1" expected_event="$2"
            local event_type
            verify_active "$name"
            event_type="$(gcloud functions describe "$name" --project=demac-corporation --gen2 --region=us-central1 --format='value(eventTrigger.eventType)')"
            if [ "$event_type" != "$expected_event" ]; then
              echo "::error::${name} event type is ${event_type:-missing}; expected ${expected_event}."
              exit 1
            fi
          }

          verify_scheduler() {
            local function_name="$1" expected_schedule="$2" expected_timezone="$3"
            local job state schedule timezone
            job="$(gcloud scheduler jobs list \
              --project=demac-corporation \
              --location=us-central1 \
              --filter="name:${function_name}" \
              --format='value(name)' | head -n 1)"
            if [ -z "$job" ]; then
              echo "::error::No Cloud Scheduler job found for ${function_name}."
              exit 1
            fi
            state="$(gcloud scheduler jobs describe "$job" --project=demac-corporation --location=us-central1 --format='value(state)')"
            if [ "$state" = 'PAUSED' ]; then
              echo "${job}: PAUSED -> resuming"
              gcloud scheduler jobs resume "$job" --project=demac-corporation --location=us-central1 --quiet
              state="$(gcloud scheduler jobs describe "$job" --project=demac-corporation --location=us-central1 --format='value(state)')"
            fi
            schedule="$(gcloud scheduler jobs describe "$job" --project=demac-corporation --location=us-central1 --format='value(schedule)')"
            timezone="$(gcloud scheduler jobs describe "$job" --project=demac-corporation --location=us-central1 --format='value(timeZone)')"
            if [ "$state" != 'ENABLED' ]; then
              echo "::error::${job} state is ${state:-unknown}; expected ENABLED."
              exit 1
            fi
            if [ "$schedule" != "$expected_schedule" ]; then
              echo "::error::${job} schedule is ${schedule:-missing}; expected ${expected_schedule}."
              exit 1
            fi
            if [ "$timezone" != "$expected_timezone" ]; then
              echo "::error::${job} timezone is ${timezone:-missing}; expected ${expected_timezone}."
              exit 1
            fi
            echo "${job}: ENABLED · ${schedule} · ${timezone}"
          }

          verify_event queueAppointmentConfirmation google.cloud.firestore.document.v1.written
          verify_active sendDailyAppointmentReminders
          verify_active sendDailyTechnicianSchedules
          verify_scheduler sendDailyTechnicianSchedules '0,5,10 8 * * *' 'America/Aruba'
