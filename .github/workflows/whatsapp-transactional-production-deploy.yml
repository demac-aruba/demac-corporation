name: Transactional WhatsApp Production

on:
  pull_request:
    paths:
      - 'functions/whatsappTransactionalService.js'
      - 'functions/whatsappTransactionalService.test.js'
      - 'functions/migrations/migrateLegacyMetaTransactionalQueueToWacli.js'
      - 'functions/migrations/migrateLegacyMetaTransactionalQueueToWacli.test.js'
      - 'functions/whatsappWacliGateway.js'
      - 'functions/operatingCalendarService.js'
      - 'functions/operatingCalendarService.test.js'
      - 'functions/appointmentNotificationService.js'
      - 'functions/appointmentNotificationService.test.js'
      - 'functions/appointmentNotifications.js'
      - 'functions/technicianDailyScheduleService.js'
      - 'functions/technicianDailyScheduleService.test.js'
      - 'functions/technicianDailySchedules.js'
      - 'functions/officeBookingAuthority.js'
      - 'functions/officeBookingAuthorityCommunication.test.js'
      - 'functions/bootstrap.js'
      - 'functions/package.json'
      - '.github/workflows/whatsapp-transactional-production-deploy.yml'
  push:
    branches:
      - main
    paths:
      - 'functions/whatsappTransactionalService.js'
      - 'functions/whatsappTransactionalService.test.js'
      - 'functions/migrations/migrateLegacyMetaTransactionalQueueToWacli.js'
      - 'functions/migrations/migrateLegacyMetaTransactionalQueueToWacli.test.js'
      - 'functions/whatsappWacliGateway.js'
      - 'functions/operatingCalendarService.js'
      - 'functions/operatingCalendarService.test.js'
      - 'functions/appointmentNotificationService.js'
      - 'functions/appointmentNotificationService.test.js'
      - 'functions/appointmentNotifications.js'
      - 'functions/technicianDailyScheduleService.js'
      - 'functions/technicianDailyScheduleService.test.js'
      - 'functions/technicianDailySchedules.js'
      - 'functions/officeBookingAuthority.js'
      - 'functions/officeBookingAuthorityCommunication.test.js'
      - 'functions/bootstrap.js'
      - 'functions/package.json'
      - '.github/workflows/whatsapp-transactional-production-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transactional-whatsapp-production
  cancel-in-progress: false

jobs:
  validate-transactional-whatsapp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install function dependencies
        run: npm install --prefix functions --no-audit --no-fund

      - name: Validate transactional WhatsApp boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/bootstrap.js
          node --check functions/whatsappTransactionalService.js
          node --check functions/migrations/migrateLegacyMetaTransactionalQueueToWacli.js
          node --check functions/whatsappWacliGateway.js
          node --check functions/operatingCalendarService.js
          node --check functions/appointmentNotificationService.js
          node --check functions/appointmentNotifications.js
          node --check functions/technicianDailyScheduleService.js
          node --check functions/technicianDailySchedules.js
          node --check functions/officeBookingAuthority.js
          npm run test:transactional-whatsapp --prefix functions
          node - <<'NODE'
          const mod = require('./functions/bootstrap');
          for (const name of [
            'wacliOutboundPoll',
            'wacliOutboundAck',
            'queueAppointmentConfirmation',
            'sendDailyAppointmentReminders',
            'sendDailyTechnicianSchedules',
          ]) {
            if (typeof mod[name] !== 'function') throw new Error(`${name} export missing`);
          }
          NODE

  deploy-transactional-whatsapp:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-transactional-whatsapp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install function dependencies
        run: npm install --prefix functions --no-audit --no-fund

      - name: Authenticate Firebase deployment service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy notification producers only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@15.2.1 deploy \
            --only functions:queueAppointmentConfirmation,functions:sendDailyAppointmentReminders,functions:sendDailyTechnicianSchedules \
            --project demac-corporation \
            --non-interactive \
            --force

      - name: Migrate legacy queued transactional messages to active wacli transport
        shell: bash
        env:
          GCLOUD_PROJECT: demac-corporation
          GOOGLE_CLOUD_PROJECT: demac-corporation
        run: |
          set -euo pipefail
          migration_output="$(node functions/migrations/migrateLegacyMetaTransactionalQueueToWacli.js)"
          echo "$migration_output"
          node - "$migration_output" <<'NODE'
          const payload = JSON.parse(process.argv[2]);
          if (payload.activeProvider !== 'wacli') {
            throw new Error(`Transactional provider is ${payload.activeProvider || 'unknown'}; production is expected to use wacli in this rollout.`);
          }
          console.log(`Legacy queue migration: scanned=${payload.scanned}, migrated=${payload.migrated}, skipped=${payload.skipped}`);
          NODE

      - name: Verify deployed notification producers
        shell: bash
        run: |
          set -euo pipefail
          verify_active() {
            local name="$1"
            local state
            state="$(gcloud functions describe "$name" --project=demac-corporation --gen2 --region=us-central1 --format='value(state)')"
            if [ "$state" != 'ACTIVE' ]; then
              echo "::error::${name} state is ${state:-unknown}."
              exit 1
            fi
            echo "${name}: ACTIVE"
          }

          verify_event() {
            local name="$1" expected_event="$2"
            local event_type
            verify_active "$name"
            event_type="$(gcloud functions describe "$name" --project=demac-corporation --gen2 --region=us-central1 --format='value(eventTrigger.eventType)')"
            if [ "$event_type" != "$expected_event" ]; then
              echo "::error::${name} event type is ${event_type:-missing}; expected ${expected_event}."
              exit 1
            fi
          }

          verify_event queueAppointmentConfirmation google.cloud.firestore.document.v1.written
          verify_active sendDailyAppointmentReminders
          verify_active sendDailyTechnicianSchedules
