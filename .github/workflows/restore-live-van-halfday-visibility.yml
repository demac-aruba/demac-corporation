name: Restore Live Van Half-Day Visibility

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/restore-live-van-halfday-visibility.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-live-van-halfday-visibility
  cancel-in-progress: false

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Patch live Scheduling van half-day visibility
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/erp-next/components/scheduling/live-scheduling-overview.tsx')
          source = path.read_text()

          old = """  const starts = liveOperationalStartTimes(capacityState, vanId, day.dateKey, baseStarts);\n  const halfDay = liveVanHalfDaySchedule(capacityState, vanId, day.dateKey);\n  const vanAvailable = liveVanOperationallyAvailable(capacityState, vanId, day.dateKey);\n\n  return starts.map((start) => {\n"""
          new = """  const starts = liveOperationalStartTimes(capacityState, vanId, day.dateKey, baseStarts);\n  const halfDay = liveVanHalfDaySchedule(capacityState, vanId, day.dateKey);\n  const capacityReady = Boolean(capacityState);\n  const vanAvailable = capacityReady && liveVanOperationallyAvailable(capacityState, vanId, day.dateKey);\n\n  return starts.map((start) => {\n"""
          if old not in source:
              raise SystemExit('Expected capacity-ready insertion point was not found.')
          source = source.replace(old, new, 1)

          old = """    const offReason = operational\n      ? undefined\n      : !vanAvailable\n        ? 'Van unavailable'\n        : halfDay\n          ? `Weekly half-day · off after ${formatTime(halfDay.workdayEnd || '13:00')}`\n          : liveCompanyClosureReason(capacityState, day.dateKey) || 'Outside operating capacity';\n"""
          new = """    const offReason = operational\n      ? undefined\n      : !capacityReady\n        ? 'Capacity policy loading'\n        : !vanAvailable\n          ? 'Van unavailable'\n          : halfDay\n            ? `Weekly half-day · off after ${formatTime(halfDay.workdayEnd || '13:00')}`\n            : liveCompanyClosureReason(capacityState, day.dateKey) || 'Outside operating capacity';\n"""
          if old not in source:
              raise SystemExit('Expected offReason block was not found.')
          source = source.replace(old, new, 1)

          marker = """function addDays(dateKey: string, amount: number) {\n"""
          helper = """function halfDayVansForDay(day: OperationalDay, vans: DisplayVan[], capacityState: LiveOperationalCapacityState | null) {\n  if (!day.isOpen || !capacityState) return [];\n  return vans\n    .filter((van) => Boolean(liveVanHalfDaySchedule(capacityState, van.id, day.dateKey)))\n    .map((van) => van.id.replace('VAN-', 'Van '));\n}\n\n"""
          if helper not in source:
              if marker not in source:
                  raise SystemExit('Expected helper insertion marker was not found.')
              source = source.replace(marker, helper + marker, 1)

          old = """        {week.map((day) => {\n          const summary = weekSummaries[day.dateKey];\n          return (\n"""
          new = """        {week.map((day) => {\n          const summary = weekSummaries[day.dateKey];\n          const halfDayVans = halfDayVansForDay(day, vans, capacityState);\n          return (\n"""
          if old not in source:
              raise SystemExit('Expected week-card mapping block was not found.')
          source = source.replace(old, new, 1)

          old = """              <small>{day.shiftLabel}</small>\n"""
          new = """              <small>{day.shiftLabel}{halfDayVans.length ? ` · ${halfDayVans.join(', ')} PM off` : ''}</small>\n"""
          if old not in source:
              raise SystemExit('Expected week-card shift label was not found.')
          source = source.replace(old, new, 1)

          path.write_text(source)

      - name: Install ERP Next dependencies
        run: npm install --prefix apps/erp-next --no-audit --no-fund

      - name: Validate employee and live scheduling architecture
        run: |
          set -euo pipefail
          npm --prefix apps/erp-next run test:employee-schedule
          npm --prefix apps/erp-next run test:live-scheduling
          npm --prefix apps/erp-next run typecheck
          npm --prefix apps/erp-next run build

      - name: Commit production fix and retire one-time workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'demac-aruba'
          git config user.email 'gm.demac@gmail.com'
          git rm .github/workflows/restore-live-van-halfday-visibility.yml
          git add apps/erp-next/components/scheduling/live-scheduling-overview.tsx
          if git diff --cached --quiet; then
            echo 'No code change remained after validation.'
            exit 0
          fi
          git commit -m 'Restore explicit van half-day visibility in live scheduling'
          git push origin HEAD:main
