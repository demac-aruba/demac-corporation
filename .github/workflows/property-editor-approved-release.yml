name: Approved property editor backend release

on:
  push:
    branches: [release/property-editor-approved]

permissions:
  contents: read

concurrency:
  group: property-editor-approved-production
  cancel-in-progress: false

jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[inspect-only]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: node scripts/property-editor-release-inspect.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: property-editor-configuration-inspection
          path: ${{ runner.temp }}/property-editor-configuration-inspection.json

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --prefix functions --ignore-scripts --no-audit --no-fund
      - name: Validate the bounded backend candidate
        run: |
          set -euo pipefail
          npm run validate:firebase --prefix functions
          npm run test:booking-authority --prefix functions
          npm run test:field-authority --prefix functions
          npm run test:customer-agent-tools --prefix functions
          node --test functions/officeBookingAuthority*.test.js functions/customerContactDirectory.test.js functions/bookingPartialCompletion.test.js
          test ! -e functions/bookingOperationalMoveOvertime.js
          node --check scripts/property-editor-approved-deploy.cjs
      - name: Verify atomic property and unit transactions in isolated Firestore
        env:
          GCLOUD_PROJECT: demo-demac-dwellings
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8297
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9297
          FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9397
        run: >-
          npx --yes firebase-tools@15.30.0 emulators:exec
          --only firestore --project demo-demac-dwellings
          --config firebase.dwellings-preview.json
          "node --test functions/propertyLocations.emulator.test.cjs"

  deploy:
    needs: validate
    if: github.repository == 'demac-aruba/demac-corporation' && github.ref == 'refs/heads/release/property-editor-approved' && !contains(github.event.head_commit.message, '[inspect-only]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy existing property consumers without changing their configuration
        run: node scripts/property-editor-approved-deploy.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: property-editor-backend-release
          path: ${{ runner.temp }}/property-editor-release-result.json
          if-no-files-found: ignore
