name: Van Group ID Correction

on:
  push:
    branches:
      - main
    paths:
      - 'functions/migrations/applyObservedVanGroupIdCorrection.js'
      - '.github/workflows/van-group-id-correction.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: van-group-id-correction-production
  cancel-in-progress: false

jobs:
  apply-correction:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install function dependencies
        run: npm install --prefix functions --no-audit --no-fund

      - name: Validate correction script
        run: node --check functions/migrations/applyObservedVanGroupIdCorrection.js

      - name: Authenticate Firebase production service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}

      - name: Apply probe-confirmed Van 1 / Van 4 JID swap
        env:
          GCLOUD_PROJECT: demac-corporation
          GOOGLE_CLOUD_PROJECT: demac-corporation
        run: node functions/migrations/applyObservedVanGroupIdCorrection.js
