name: Van Group ID Correction

on:
  push:
    branches:
      - main
    paths:
      - 'functions/migrations/applyObservedVanGroupIdCorrection.js'
      - 'functions/migrations/probeVanScheduleGroupIds.js'
      - '.github/workflows/van-group-id-correction.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: van-group-id-correction-production
  cancel-in-progress: false

jobs:
  apply-correction:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install function dependencies
        run: npm install --prefix functions --no-audit --no-fund

      - name: Validate correction and probe scripts
        run: |
          node --check functions/migrations/applyObservedVanGroupIdCorrection.js
          node --check functions/migrations/probeVanScheduleGroupIds.js

      - name: Authenticate Firebase production service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}

      - name: Apply probe-confirmed Van 1 / Van 4 JID correction
        env:
          GCLOUD_PROJECT: demac-corporation
          GOOGLE_CLOUD_PROJECT: demac-corporation
        run: node functions/migrations/applyObservedVanGroupIdCorrection.js

      - name: Send four live WhatsApp verification labels
        env:
          GCLOUD_PROJECT: demac-corporation
          GOOGLE_CLOUD_PROJECT: demac-corporation
          PROBE_ID: corrected-${{ github.run_id }}-${{ github.run_attempt }}
        run: node functions/migrations/probeVanScheduleGroupIds.js

      - name: Mark verification success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=success \
            -f context='DEMAC / Van Group ID Verification' \
            -f description='Correction verified; 4 WhatsApp probe messages sent'

      - name: Mark verification failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=failure \
            -f context='DEMAC / Van Group ID Verification' \
            -f description='Van group correction or WhatsApp probe failed'
