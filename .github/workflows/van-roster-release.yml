name: Controlled atomic Van roster release
on:
  pull_request:
    paths:
      - 'scripts/van-roster-*'
      - '.github/workflows/van-roster-release.yml'
  push:
    branches: [release/van-roster-20261027]
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node --check scripts/van-roster-release.cjs && node --test scripts/van-roster-release.test.cjs scripts/appointment-finance-source-update.test.cjs scripts/appointment-finance-transport.test.cjs
  publish:
    if: github.ref == 'refs/heads/release/van-roster-20261027'
    needs: safety
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: field-operations-authority-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Publish reviewed fleet authority source, then direct-writer guard
        run: node scripts/van-roster-release.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: van-roster-release
          path: ${{ runner.temp }}/van-roster-release/summary.json
          if-no-files-found: error
          retention-days: 90
