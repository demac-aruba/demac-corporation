name: Audit Van Schedule Production 2026-08-24
# Read-only: this workflow never sends WhatsApp messages or mutates production data.
on:
  pull_request:
    paths:
      - '.github/workflows/audit-van-schedule-production-20260824.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install function dependencies
        run: npm install --prefix functions --no-audit --no-fund
      - name: Authenticate Firebase production service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Read calendar batch and queue history
        env:
          GCLOUD_PROJECT: demac-corporation
          GOOGLE_CLOUD_PROJECT: demac-corporation
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const admin = require('./functions/node_modules/firebase-admin');
          const { createOperatingCalendarService } = require('./functions/operatingCalendarService');
          if (!admin.apps.length) admin.initializeApp();
          const db = admin.firestore();
          const calendar = createOperatingCalendarService({ db });
          const dates = ['2026-08-17','2026-08-18','2026-08-19','2026-08-20','2026-08-21','2026-08-22','2026-08-23','2026-08-24'];
          const safeTs = (v) => v && typeof v.toDate === 'function' ? v.toDate().toISOString() : v ?? null;
          (async () => {
            const settingsSnap = await db.collection('businessSettings').doc('business-calendar').get();
            const whatsappSnap = await db.collection('businessSettings').doc('whatsapp').get();
            const closureSnap = await db.collection('calendarClosures').where('date','>=','2026-08-17').where('date','<=','2026-08-24').get();
            const calendarSettings = settingsSnap.exists ? settingsSnap.data() : {};
            const whatsappSettings = whatsappSnap.exists ? whatsappSnap.data() : {};
            console.log('CALENDAR_SETTINGS', JSON.stringify({ exists: settingsSnap.exists, closedWeekdays: calendarSettings.closedWeekdays ?? null, closures: closureSnap.docs.map(d => ({ id:d.id, date:d.data().date, active:d.data().active !== false, reason:d.data().reason || d.data().name || null })) }));
            console.log('WHATSAPP_SETTINGS', JSON.stringify({ exists: whatsappSnap.exists, transactionalOutboundEnabled: whatsappSettings.transactionalOutboundEnabled !== false, transactionalProvider: whatsappSettings.transactionalProvider || null }));
            for (const dateKey of dates) {
              const [open, batchSnap, woSnap, queueSnap] = await Promise.all([
                calendar.isOpenDate(dateKey),
                db.collection('technicianDailyScheduleBatches').doc(dateKey).get(),
                db.collection('workOrders').where('date','==',dateKey).get(),
                db.collection('whatsappOutboundQueue').where('metadata.scheduleDate','==',dateKey).get(),
              ]);
              const batch = batchSnap.exists ? batchSnap.data() : null;
              const queues = queueSnap.docs.map(d => ({ id:d.id,...d.data() }));
              const automatic = queues.filter(q => String(q.metadata?.reason || q.reason || '') === 'daily-van-schedule');
              const manual = queues.filter(q => String(q.metadata?.reason || q.reason || '').includes('manual'));
              const byStatus = {};
              for (const q of queues) byStatus[String(q.status || 'unknown')] = (byStatus[String(q.status || 'unknown')] || 0) + 1;
              console.log('DAY', JSON.stringify({ dateKey, open, workOrderCount: woSnap.size, batch: batch ? { status: batch.status || null, attemptCount: batch.attemptCount || 0, workOrderCount: batch.workOrderCount ?? null, messageCount: batch.messageCount ?? null, failedCount: batch.failedCount ?? null, fatalError: batch.fatalError || null, startedAt: safeTs(batch.startedAt), lastAttemptAt: safeTs(batch.lastAttemptAt), completedAt: safeTs(batch.completedAt), failedAt: safeTs(batch.failedAt) } : null, queueCount: queues.length, automaticCount: automatic.length, manualCount: manual.length, queueByStatus: byStatus }));
            }
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - name: Inspect scheduled function metadata
        shell: bash
        run: |
          set -u
          gcloud functions describe sendDailyTechnicianSchedules --project=demac-corporation --gen2 --region=us-central1 --format='yaml(name,state,updateTime,labels,serviceConfig.serviceAccountEmail,serviceConfig.uri,eventTrigger)'
      - name: Read schedule-function logs around recent 8 AM windows
        continue-on-error: true
        shell: bash
        run: |
          set -u
          gcloud logging read 'timestamp>="2026-08-17T11:45:00Z" AND timestamp<="2026-08-24T12:30:00Z" AND (textPayload:"Van group daily schedules" OR jsonPayload.message:"Van group daily schedules")' --project=demac-corporation --limit=200 --order=asc --format='table(timestamp,resource.type,resource.labels.service_name,jsonPayload.message,textPayload,severity)' || true
