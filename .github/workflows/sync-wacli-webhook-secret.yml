name: Synchronize wacli Webhook Secret

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-wacli-webhook-secret.yml'

permissions:
  contents: read

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DO_HOST: 159.223.160.239
      DO_USER: demac-deploy
      GCP_PROJECT: demac-corporation
      GCP_REGION: us-central1
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure restricted Droplet SSH
        shell: bash
        env:
          DO_SSH_KEY_B64: ${{ secrets.DO_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s' "$DO_SSH_KEY_B64" | base64 --decode > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
          ssh-keyscan -T 10 -H "$DO_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Securely capture current Droplet webhook secret
        shell: bash
        run: |
          set -euo pipefail
          SECRET="$(ssh -o BatchMode=yes -o ConnectTimeout=10 "$DO_USER@$DO_HOST" 'curl -fsS http://127.0.0.1:8787/__internal/wacli-secret')"
          if ! [[ "$SECRET" =~ ^[A-Fa-f0-9]{64}$ ]]; then
            echo '::error::Droplet webhook secret did not match the expected 64-character format.'
            exit 1
          fi
          echo "::add-mask::$SECRET"
          printf '%s' "$SECRET" > "$RUNNER_TEMP/wacli-webhook-secret"
          chmod 0600 "$RUNNER_TEMP/wacli-webhook-secret"
          echo 'Captured current Droplet webhook secret securely; value masked.'

      - name: Add new Secret Manager version
        shell: bash
        run: |
          set -euo pipefail
          gcloud secrets versions add WACLI_WEBHOOK_SECRET \
            --project="$GCP_PROJECT" \
            --data-file="$RUNNER_TEMP/wacli-webhook-secret" \
            --quiet
          echo 'WACLI_WEBHOOK_SECRET latest version updated.'

      - name: Resolve Cloud Functions runtime identity
        id: config
        shell: bash
        run: |
          set -euo pipefail
          RUN_SA="$(gcloud functions describe wacliWebhook --project="$GCP_PROJECT" --gen2 --region="$GCP_REGION" --format='value(serviceConfig.serviceAccountEmail)')"
          if [ -z "$RUN_SA" ]; then
            echo '::error::Could not resolve wacliWebhook runtime service account.'
            exit 1
          fi
          echo "run_service_account=${RUN_SA}" >> "$GITHUB_OUTPUT"

      - name: Redeploy wacliWebhook against latest secret
        shell: bash
        env:
          RUN_SERVICE_ACCOUNT: ${{ steps.config.outputs.run_service_account }}
        run: |
          set -euo pipefail
          gcloud functions deploy wacliWebhook \
            --project="$GCP_PROJECT" \
            --gen2 \
            --region="$GCP_REGION" \
            --runtime=nodejs22 \
            --source=functions \
            --entry-point=wacliWebhook \
            --memory=256Mi \
            --timeout=120s \
            --run-service-account="$RUN_SERVICE_ACCOUNT" \
            --set-env-vars='FIREBASE_CONFIG={"storageBucket":"demac-corporation.firebasestorage.app"}' \
            --set-secrets=WACLI_WEBHOOK_SECRET=WACLI_WEBHOOK_SECRET:latest,WACLI_BRIDGE_URL=WACLI_BRIDGE_URL:latest,WACLI_BRIDGE_TOKEN=WACLI_BRIDGE_TOKEN:latest \
            --trigger-http \
            --allow-unauthenticated \
            --quiet

      - name: Verify queue resumes with synchronized signature
        shell: bash
        run: |
          set -euo pipefail
          STATE="$(gcloud functions describe wacliWebhook --project="$GCP_PROJECT" --gen2 --region="$GCP_REGION" --format='value(state)')"
          test "$STATE" = 'ACTIVE'
          for attempt in $(seq 1 24); do
            HEALTH="$(ssh "$DO_USER@$DO_HOST" 'curl -fsS http://127.0.0.1:8787/health')"
            PENDING="$(printf '%s' "$HEALTH" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("pendingWebhookEvents",-1))')"
            ERROR="$(printf '%s' "$HEALTH" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("lastForwardError") or "")')"
            SUCCESS="$(printf '%s' "$HEALTH" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("lastForwardSuccessAt") or "")')"
            printf 'attempt=%s pending=%s lastForwardSuccess=%s error_present=%s\n' "$attempt" "$PENDING" "${SUCCESS:-none}" "$([ -n "$ERROR" ] && echo yes || echo no)"
            if [ "$PENDING" = '0' ] && [ -z "$ERROR" ] && [ -n "$SUCCESS" ]; then
              echo 'Bridge queue successfully resumed.'
              exit 0
            fi
            sleep 5
          done
          echo '::error::Bridge queue did not fully recover after secret synchronization.'
          ssh "$DO_USER@$DO_HOST" 'curl -fsS http://127.0.0.1:8787/health | python3 -m json.tool'
          exit 1

      - name: Cleanup sensitive runner files
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/wacli-webhook-secret" "$HOME/.ssh/id_ed25519"
