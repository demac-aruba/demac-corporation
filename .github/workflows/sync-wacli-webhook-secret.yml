name: Probe wacli Bridge Token Access

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-wacli-webhook-secret.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GCP_PROJECT: demac-corporation
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEMAC_CORPORATION }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Probe WACLI_BRIDGE_TOKEN payload access without exposing it
        shell: bash
        run: |
          set -euo pipefail
          TOKEN_FILE="$RUNNER_TEMP/wacli-bridge-token"
          if ! gcloud secrets versions access latest \
            --secret=WACLI_BRIDGE_TOKEN \
            --project="$GCP_PROJECT" \
            >"$TOKEN_FILE" 2>"$RUNNER_TEMP/secret-access-error"; then
            echo 'secret_access=DENIED'
            sed -E 's/[A-Za-z0-9_+\/=.-]{24,}/[redacted]/g' "$RUNNER_TEMP/secret-access-error" | head -n 20
            exit 1
          fi
          TOKEN="$(cat "$TOKEN_FILE")"
          if [ -z "$TOKEN" ]; then
            echo '::error::Secret payload was empty.'
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          printf 'secret_access=OK secret_bytes=%s\n' "$(wc -c <"$TOKEN_FILE" | tr -d ' ')"

      - name: Cleanup sensitive runner files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/wacli-bridge-token" "$RUNNER_TEMP/secret-access-error"
