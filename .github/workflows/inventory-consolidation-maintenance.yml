name: Inventory Consolidation Maintenance

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    if: github.ref == 'refs/heads/feature/consolidated-inventory-authority'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/consolidated-inventory-authority
          fetch-depth: 0

      - name: Remove demo dependency on retired browser-local material plans
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/erp-next/lib/browser-demo-data.ts')
          text = path.read_text()
          replacements = [
              ("import { BROWSER_WORKORDER_MATERIALS_KEY, type BrowserWorkOrderMaterialPlan } from './browser-workorder-materials';\n", '', 'material-plan import'),
              ("function buildMaterialPlans(): BrowserWorkOrderMaterialPlan[] {\n  return jobSeeds\n    .filter((seed) => workOrderId(seed) !== releasedRiskId)\n    .map((seed) => ({ workOrderId: workOrderId(seed), mode: 'not_required', lines: [], updatedAt: isoAt('18:20', -24 * 60), updatedBy: 'Demo Operations' }));\n}\n\n", '', 'demo material-plan builder'),
              ('    BROWSER_WORKORDER_MATERIALS_KEY,\n', '', 'demo backup key'),
              ('  const materialPlans = buildMaterialPlans();\n', '', 'demo material-plan seed'),
              ('  writeRaw(BROWSER_WORKORDER_MATERIALS_KEY, materialPlans);\n', '', 'demo material-plan persistence'),
          ]
          for old, new, label in replacements:
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f'{label}: expected exactly one match, found {text.count(old)}')
                  text = text.replace(old, new, 1)
                  print(f'updated: {label}')
              elif new and new not in text:
                  raise SystemExit(f'{label}: expected old or new form')
          path.write_text(text)
          PY

      - name: Execute guarded finalization plan from feature branch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/inventory-finalize.yml')
          if not workflow.exists():
              raise SystemExit('inventory-finalize.yml is missing from the feature branch')

          lines = workflow.read_text().splitlines()
          blocks = []
          index = 0
          while index < len(lines):
              line = lines[index]
              if line.strip() != 'run: |':
                  index += 1
                  continue
              indent = len(line) - len(line.lstrip())
              index += 1
              body = []
              while index < len(lines):
                  candidate = lines[index]
                  candidate_indent = len(candidate) - len(candidate.lstrip()) if candidate.strip() else indent + 2
                  if candidate.strip() and candidate_indent <= indent:
                      break
                  body.append(candidate)
                  index += 1
              blocks.append(dedent('\n'.join(body)).rstrip())

          if len(blocks) != 4:
              raise SystemExit(f'Expected exactly 4 guarded run blocks in inventory-finalize.yml, found {len(blocks)}')

          script = '\n\n'.join(blocks) + '\n'
          Path('/tmp/inventory-finalize.sh').write_text(script)
          print('Prepared guarded inventory finalization script with 4 validated stages.')
          PY
          bash /tmp/inventory-finalize.sh
